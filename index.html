<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPIK 읽기 연습</title>
<style>
  :root{
    --bg:#FFFFFF;
    --card:#F7F8FA;
    --surface:#FFFFFF;
    --text:#232326;
    --sub:#8B8D98;
    --accent:#2F5FD1;
    --accent-light:#EAF0FE;
    --correct:#1F9D55;
    --correct-bg:#E9F9EF;
    --wrong:#E0393E;
    --wrong-bg:#FDEAEA;
    --hair:#E7E8ED;
    --chart-1:#2F5FD1;
    --chart-2:#E0913F;
    --chart-3:#4FAE9E;
    --chart-4:#C15F86;
    --chart-5:#8A6FD8;
    --chart-6:#9AA1AE;
    --note-amber:#B8720C;
    --note-amber-bg:#FBF0DD;
    --note-teal:#1E8A82;
    --note-teal-bg:#E1F5F2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161C;
      --card:#1C1F27;
      --surface:#242732;
      --text:#ECEDF1;
      --sub:#9497A6;
      --accent:#6C8FEF;
      --accent-light:#202A44;
      --correct:#3ED07E;
      --correct-bg:#163425;
      --wrong:#FF6E6E;
      --wrong-bg:#3A1B1D;
      --hair:#2B2E38;
      --chart-1:#6C8FEF;
      --chart-2:#EBA45F;
      --chart-3:#5FC4B3;
      --chart-4:#DB84A6;
      --chart-5:#A793EA;
      --chart-6:#8B909C;
      --note-amber:#E3A857;
      --note-amber-bg:#3A2C14;
      --note-teal:#5FC9BE;
      --note-teal-bg:#123330;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161C;
    --card:#1C1F27;
    --surface:#242732;
    --text:#ECEDF1;
    --sub:#9497A6;
    --accent:#6C8FEF;
    --accent-light:#202A44;
    --correct:#3ED07E;
    --correct-bg:#163425;
    --wrong:#FF6E6E;
    --wrong-bg:#3A1B1D;
    --hair:#2B2E38;
    --chart-1:#6C8FEF;
    --chart-2:#EBA45F;
    --chart-3:#5FC4B3;
    --chart-4:#DB84A6;
    --chart-5:#A793EA;
    --chart-6:#8B909C;
    --note-amber:#E3A857;
    --note-amber-bg:#3A2C14;
    --note-teal:#5FC9BE;
    --note-teal-bg:#123330;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:720px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  header.topbar{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:28px;
  }
  .brand{
    font-size:15px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:0.02em;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  @keyframes charPop{
    0%{transform:scale(0.5);}
    55%{transform:scale(1.35);}
    100%{transform:scale(1);}
  }
  .char-result{
    font-size:56px;
    line-height:1;
    animation:charPop 0.6s ease-out;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:var(--hair);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    border-radius:999px;
    transition:width 0.4s ease-out;
  }
  .progress-label{
    font-size:14px;
    color:var(--sub);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .score-label{
    font-size:14px;
    color:var(--sub);
    margin-top:6px;
  }
  /* ---- Start screen ---- */
  .start-card, .result-card{
    background:var(--card);
    border-radius:18px;
    padding:32px 28px;
    margin-top:8px;
  }
  .start-card h1{
    font-size:24px;
    margin:0 0 8px;
  }
  .start-card p.lead{
    color:var(--sub);
    font-size:16px;
    margin:0 0 28px;
    line-height:1.7;
  }
  .option-group{
    margin-bottom:24px;
  }
  .option-group h3{
    font-size:14px;
    color:var(--sub);
    margin:0 0 10px;
    font-weight:600;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    padding:10px 16px;
    border-radius:999px;
    border:1.5px solid var(--hair);
    background:var(--surface);
    font-size:15px;
    cursor:pointer;
    color:var(--text);
    transition:all 0.15s ease-out;
  }
  .chip.active{
    border-color:var(--accent);
    background:var(--accent-light);
    color:var(--accent);
    font-weight:700;
  }
  .custom-count-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .custom-count-row label{
    font-size:14px;
    color:var(--sub);
  }
  #custom-count-input{
    width:80px;
    padding:8px 10px;
    border-radius:10px;
    border:1.5px solid var(--hair);
    background:var(--surface);
    color:var(--text);
    font-size:16px;
    font-family:inherit;
  }
  #custom-count-input:focus, #custom-count-input.active{
    outline:none;
    border-color:var(--accent);
  }
  .start-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:#fff;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
    transition:transform 0.1s ease-out, opacity 0.15s;
  }
  .start-btn:hover{opacity:0.92;}
  .start-btn:active{transform:translateY(1px);}
  .start-btn:disabled{background:var(--hair);color:var(--sub);cursor:not-allowed;}
  .analysis-link{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:var(--accent);
    font-size:15px;
    font-weight:700;
    text-align:center;
    padding:14px 0 2px;
    cursor:pointer;
  }
  .analysis-link:hover{opacity:0.75;}

  /* ---- Analysis screen ---- */
  .analysis-card{
    background:var(--card);
    border-radius:18px;
    padding:28px 24px;
  }
  .analysis-overall{
    font-size:16px;
    font-weight:700;
    color:var(--text);
    margin-bottom:24px;
  }
  .analysis-empty{
    color:var(--sub);
    font-size:16px;
    line-height:1.7;
    padding:20px 0;
  }
  .analysis-section{margin-bottom:28px;}
  .analysis-section-heading{
    font-size:13px;
    font-weight:700;
    color:var(--sub);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:10px;
  }
  .analysis-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:8px;
    font-size:15px;
  }
  .analysis-item-label{color:var(--text);}
  .analysis-item-count{
    flex:0 0 auto;
    color:var(--wrong);
    font-weight:700;
    font-size:13px;
    white-space:nowrap;
  }
  .analysis-actions{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .analysis-actions button{
    flex:1;
    padding:14px;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }

  /* ---- Question card ---- */
  .q-card{
    background:var(--card);
    border-radius:18px;
    padding:28px 24px;
    animation:fadein 0.3s ease-out;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .q-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .q-source{
    font-size:13px;
    color:var(--sub);
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:999px;
    padding:4px 12px;
  }
  .q-instruction{
    font-size:15px;
    color:var(--sub);
    margin:0 0 16px;
    line-height:1.6;
  }
  .passage-box{
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:14px;
    padding:20px 20px;
    margin-bottom:20px;
    white-space:pre-line;
    font-size:18px;
  }
  .q-stem{
    font-size:19px;
    font-weight:600;
    margin:0 0 20px;
    line-height:1.7;
  }
  .passage-box u, .q-stem u{
    text-decoration:underline;
    text-decoration-color:var(--accent);
    text-decoration-thickness:2px;
    text-underline-offset:3px;
    font-weight:700;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .choice{
    display:flex;
    align-items:center;
    gap:14px;
    min-height:56px;
    padding:12px 16px;
    border-radius:14px;
    border:1.5px solid var(--hair);
    background:var(--surface);
    cursor:pointer;
    font-size:18px;
    transition:background 0.15s ease-out, border-color 0.15s ease-out, transform 0.1s;
  }
  .choice:hover:not(.disabled){border-color:var(--accent);background:var(--accent-light);}
  .choice:active:not(.disabled){transform:translateY(1px);}
  .choice-num{
    flex:0 0 auto;
    width:28px;height:28px;
    border-radius:50%;
    background:var(--hair);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;
  }
  .choice.correct{border-color:var(--correct);background:var(--correct-bg);}
  .choice.correct .choice-num{background:var(--correct);color:#fff;}
  .choice.wrong{border-color:var(--wrong);background:var(--wrong-bg);}
  .choice.wrong .choice-num{background:var(--wrong);color:#fff;}
  .choice.disabled{cursor:default;}
  .choice.dim{opacity:0.55;}

  .feedback-banner{
    margin-top:18px;
    padding:14px 18px;
    border-radius:12px;
    font-weight:700;
    font-size:17px;
    animation:fadein 0.25s ease-out;
  }
  .feedback-banner.ok{background:var(--correct-bg);color:var(--correct);}
  .feedback-banner.ng{background:var(--wrong-bg);color:var(--wrong);}

  .explain-panel{
    margin-top:14px;
    padding:20px;
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:14px;
    animation:fadein 0.25s ease-out;
  }
  .grammar-badge{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    background:var(--accent-light);
    border-radius:999px;
    padding:5px 12px;
    margin-bottom:10px;
  }
  .explain-text{
    font-size:18px;
    line-height:1.8;
    color:var(--text);
  }
  .gref{
    margin-top:14px;
    border:1px solid var(--hair);
    border-radius:14px;
    background:var(--card);
    padding:4px 16px 14px;
  }
  .gref > summary{
    cursor:pointer;
    font-size:15px;
    font-weight:700;
    color:var(--accent);
    padding:12px 0 8px;
    list-style:none;
  }
  .gref > summary::-webkit-details-marker{display:none;}
  .gref-card{
    padding:14px 0;
    border-top:1px dashed var(--hair);
  }
  .gref-card:first-of-type{border-top:none;padding-top:4px;}
  .gref-term{font-size:18px;font-weight:700;margin-bottom:2px;}
  .gref-meaning{font-size:16px;color:var(--text);margin-bottom:8px;}
  .gref-formula{
    font-size:15px;
    line-height:1.7;
    background:var(--accent-light);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .gref-register{margin-bottom:8px;}
  .gref-register-badge{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    border-radius:999px;
    padding:4px 11px;
  }
  .gref-register-written .gref-register-badge{color:var(--note-amber);background:var(--note-amber-bg);}
  .gref-register-spoken .gref-register-badge{color:var(--note-teal);background:var(--note-teal-bg);}
  .gref-register-both .gref-register-badge{color:var(--correct);background:var(--correct-bg);}
  .gref-register-note{font-size:14px;color:var(--sub);margin-top:4px;line-height:1.6;}
  .gref-points{margin:0 0 8px;padding-left:20px;font-size:15px;line-height:1.7;color:var(--text);}
  .gref-ex{padding:6px 0;}
  .gref-ex-ko{font-size:16px;font-weight:600;}
  .gref-ex-ja{font-size:14px;color:var(--sub);}
  .sub-question{
    margin-top:0;
  }
  .sub-question + .sub-question{
    margin-top:28px;
    padding-top:24px;
    border-top:1px dashed var(--hair);
  }
  .sub-question-numbered .q-stem{
    display:flex;
    gap:8px;
  }
  .sub-num{
    color:var(--accent);
    flex-shrink:0;
  }

  /* ---- Writing mode ---- */
  .blank-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:8px;
  }
  .blank-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .blank-label{
    flex:0 0 auto;
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--accent-light);
    color:var(--accent);
    font-weight:700;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .blank-input{
    flex:1;
    min-height:48px;
    padding:10px 14px;
    border-radius:12px;
    border:1.5px solid var(--hair);
    background:var(--surface);
    color:var(--text);
    font-size:18px;
    font-family:inherit;
  }
  .blank-input:focus{outline:none;border-color:var(--accent);}
  .chart-card{
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
  }
  .chart-card-label{
    font-size:13px;
    font-weight:700;
    color:var(--sub);
    margin-bottom:8px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .chart-line{
    font-size:17px;
    line-height:1.7;
    padding:4px 0;
  }
  .chart-line + .chart-line{border-top:1px dashed var(--hair);}
  .chart-title{
    font-size:16px;
    font-weight:700;
    color:var(--text);
    margin-bottom:14px;
  }
  .chart-caption{
    font-size:13px;
    color:var(--sub);
    margin-top:12px;
  }
  .donut-wrap{
    position:relative;
    width:160px;
    height:160px;
    margin:0 auto 16px;
  }
  .donut-ring{
    width:100%;
    height:100%;
    border-radius:50%;
  }
  .donut-hole{
    position:absolute;
    top:26px; left:26px;
    width:108px; height:108px;
    border-radius:50%;
    background:var(--surface);
  }
  .chart-legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 16px;
    justify-content:center;
    font-size:14px;
    color:var(--text);
  }
  .chart-legend-item{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chart-swatch{
    width:10px;
    height:10px;
    border-radius:3px;
    flex:0 0 auto;
  }
  .bar-chart{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:38px;
    height:160px;
    padding-top:46px;
  }
  .bar-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100%;
    flex:0 1 auto;
  }
  .bar-set{
    display:flex;
    align-items:flex-end;
    gap:6px;
    height:100%;
    flex:1;
  }
  .bar{
    width:28px;
    min-height:3px;
    border-radius:6px 6px 2px 2px;
    position:relative;
    display:flex;
    justify-content:center;
    transition:height 0.4s ease-out;
  }
  .bar-value{
    position:absolute;
    top:-22px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    font-weight:700;
    color:var(--sub);
    white-space:nowrap;
  }
  .bar-value-alt{top:-40px;}
  .bar-cat-label{
    margin-top:10px;
    font-size:13px;
    color:var(--sub);
    text-align:center;
  }
  .sub-questions{
    margin:0 0 12px;
    padding-left:22px;
    font-size:17px;
    line-height:1.9;
    color:var(--text);
  }
  .word-count-hint{
    font-size:14px;
    color:var(--sub);
    font-weight:700;
    margin-bottom:8px;
  }
  .writing-textarea{
    width:100%;
    min-height:160px;
    padding:16px;
    border-radius:14px;
    border:1.5px solid var(--hair);
    background:var(--surface);
    color:var(--text);
    font-size:18px;
    font-family:inherit;
    line-height:1.7;
    resize:vertical;
  }
  .writing-textarea:focus{outline:none;border-color:var(--accent);}
  .model-answer-box{
    margin-top:18px;
    padding:20px;
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:14px;
    animation:fadein 0.25s ease-out;
  }
  .model-answer-box .explain-text{white-space:pre-line;}
  .model-answer-box .explain-text + .explain-text{margin-top:10px;}
  .checklist-box{
    margin-top:14px;
    padding:18px 20px 8px;
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:14px;
    animation:fadein 0.25s ease-out;
  }
  .checklist-count{
    font-size:14px;
    color:var(--sub);
    margin:-4px 0 10px;
  }
  .checklist-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 0;
    font-size:17px;
    line-height:1.5;
    cursor:pointer;
  }
  .checklist-item input{
    margin-top:4px;
    width:18px;
    height:18px;
    accent-color:var(--accent);
    flex:0 0 auto;
  }

  .next-row{
    margin-top:22px;
    display:flex;
    justify-content:flex-end;
    animation:fadein 0.2s ease-out;
  }
  .next-btn{
    padding:14px 28px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
  }
  .next-btn:hover{opacity:0.92;}
  .next-row.has-prev{justify-content:space-between;align-items:center;gap:12px;}
  .prev-btn{
    padding:14px 20px;
    border:1.5px solid var(--hair);
    border-radius:12px;
    background:var(--surface);
    color:var(--text);
    font-size:16px;
    font-weight:600;
    cursor:pointer;
  }
  .prev-btn:hover{border-color:var(--accent);color:var(--accent);}
  .resume-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    background:var(--accent-light);
    border:1.5px solid var(--accent);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:16px;
  }
  .resume-title{font-size:17px;font-weight:700;color:var(--accent);}
  .resume-info{font-size:14px;color:var(--sub);margin-top:2px;}
  .resume-actions{display:flex;gap:8px;}
  .resume-go,.resume-discard{
    padding:10px 18px;
    border-radius:999px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .resume-go{background:var(--accent);border:none;color:#fff;}
  .resume-discard{background:transparent;border:1.5px solid var(--hair);color:var(--sub);}

  /* ---- Result screen ---- */
  .result-card{text-align:center;}
  .result-score{
    font-size:56px;
    font-weight:800;
    color:var(--accent);
    margin:8px 0 4px;
  }
  .result-sub{color:var(--sub);font-size:16px;margin-bottom:28px;}
  .review-list{
    text-align:left;
    margin-top:24px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .review-item{
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:12px;
    padding:14px 16px;
    font-size:15px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .review-item:hover{border-color:var(--accent);}

예약 방법", "일정 문의", "이용 후기", "제품 소개"], "answer": 1, "grammar_point": null, "explanation": "「식사 원하는 날짜와 시간, 인원수를 선택」「연락 받을 분의 성함과 연락처를 입력」という番号付きの手順説明は、飲食店の①예약 방법(予約方法)の案内文である。②일정 문의(日程問い合わせ)は質問する側の文になるはずで手順説明ではなく、③이용 후기(利用後記)は感想文、④제품 소개(製品紹介)は商品の特徴説明になるはずで、いずれもこの手順形式の文章とは合わない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [5~8] 次は何について書かれた文か選びなさい。(各2点)", "passage_ja": "❶ お食事を希望する日付と時間、人数を選択してください。\n❷ ご連絡を受け取る方のお名前と連絡先を入力してください。", "question_text_ja": null, "choices_ja": ["予約方法", "日程の問い合わせ", "利用レビュー", "製品紹介"]}, {"id": "96-9", "round": 96, "source": "제96회 읽기 9번", "number": 9, "instruction": "※ [9~12] 다음 글 또는 그래프의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "제3회 인주시 영상 노래 대회\n제출 방법: 노래하는 영상과 신청서를 이메일(norae@inju.go.kr)로 전송\n※ 신청서는 인주시청 홈페이지 게시판에서 다운로드 가능\n제출 기간: 2024년 11월 1일(금)~15일(금)\n결과 발표: 11월 29일(금), 인주시청 홈페이지 게시", "question_text": null, "choices": ["결과는 이메일로 알려 준다.", "11월 29일까지 신청서를 내야 한다.", "신청서는 홈페이지에서 내려받을 수 있다.", "노래하는 영상은 직접 가서 제출해야 한다."], "answer": 3, "grammar_point": null, "explanation": "공고문에서는 申請書はホームページの掲示板でダウンロードできると案内しており、③の内容と一致する。\n① 結果はメールではなくホームページに掲示されるため誤り。\n② 申請書の提出期限は11月29日ではなく11月15日までの提出期間内であるため誤り(29日は結果発表日)。\n③「신청서는 인주시청 홈페이지 게시판에서 다운로드 가능」という記述と一致。正解。\n④ 歌唱動画は直接提出ではなくメールで送付するため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [9~12] 次の文またはグラフの内容と一致するものを選びなさい。(各2点)", "passage_ja": "第3回 インジュ市 動画歌唱大会\n提出方法: 歌う動画と申込書をメール(norae@inju.go.kr)で送信\n※ 申込書はインジュ市役所ホームページの掲示板からダウンロード可能\n提出期間: 2024年11月1日(金)〜15日(金)\n結果発表: 11月29日(金)、インジュ市役所ホームページに掲示", "question_text_ja": null, "choices_ja": ["結果はメールで知らせてくれる。", "11月29日までに申込書を提出しなければならない。", "申込書はホームページからダウンロードできる。", "歌う動画は直接出向いて提出しなければならない。"]}, {"id": "96-10", "round": 96, "source": "제96회 읽기 10번", "number": 10, "instruction": "※ [9~12] 다음 글 또는 그래프의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "택배로 가장 많이 배송되는 물건은?\n식품: 31%\n의류: 25%\n화장품: 19%\n전자 제품: 13%\n운동 용품: 8%\n기타: 4%\n〈조사 대상: 2023년 인주택배 배송 물품〉", "question_text": null, "choices": ["택배로 배송되는 물건 중 의류가 가장 많다.", "택배로 화장품이 배송되는 비율이 식품보다 낮다.", "택배로 운동 용품이 배송되는 비율은 10%가 넘는다.", "택배로 전자 제품이 배송되는 비율이 두 번째로 높다."], "answer": 2, "grammar_point": null, "explanation": "グラフでは식품(食品)が31%で最も高く、②「화장품이 배송되는 비율이 식품보다 낮다(化粧品の配送比率が食品より低い)」は화장품19%<식품31%と一致する。\n① 配送物の中で最も多いのは의류(衣類、25%)ではなく식품(31%)であるため誤り。\n② 화장품(19%)は식품(31%)より低いため一致。正解。\n③ 운동 용품(運動用品)は8%で10%を超えていないため誤り。\n④ 二番目に高いのは의류(25%)であり、전자 제품(13%)は4位のため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [9~12] 次の文またはグラフの内容と一致するものを選びなさい。(各2点)", "passage_ja": "宅配便で最も多く配送される品物は?\n食品: 31%\n衣類: 25%\n化粧品: 19%\n電子製品: 13%\n運動用品: 8%\nその他: 4%\n〈調査対象: 2023年インジュ宅配便の配送品〉", "question_text_ja": null, "choices_ja": ["宅配便で配送される品物のうち衣類が最も多い。", "宅配便で化粧品が配送される割合は食品より低い。", "宅配便で運動用品が配送される割合は10%を超える。", "宅配便で電子製品が配送される割合は2番目に高い。"], "chart": {"type": "donut", "title": "택배로 가장 많이 배송되는 물건은?", "title_ja": "宅配便で最も多く配送される品物は？", "caption": "조사 대상: 2023년 인주택배 배송 물품", "caption_ja": "調査対象: 2023年インジュ宅配便の配送品", "segments": [{"label": "식품", "label_ja": "食品", "value": 31}, {"label": "의류", "label_ja": "衣類", "value": 25}, {"label": "화장품", "label_ja": "化粧品", "value": 19}, {"label": "전자 제품", "label_ja": "電子製品", "value": 13}, {"label": "운동 용품", "label_ja": "運動用品", "value": 8}, {"label": "기타", "label_ja": "その他", "value": 4}]}}, {"id": "96-11", "round": 96, "source": "제96회 읽기 11번", "number": 11, "instruction": "※ [9~12] 다음 글 또는 그래프의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "인주로봇연구소는 작년에 이어 올해에도 겨울 방학을 맞은 인주시 초등학생들을 대상으로 교육 프로그램을 운영한다. 여기에 참여하는 학생들은 연구소에서 직접 로봇을 만들어 보고 조종하는 체험을 할 수 있다. 이 프로그램은 로봇 과학자가 되기를 희망하는 학생들에게 특히 반응이 좋다. 연구소는 내년 겨울 방학에도 이 프로그램을 진행할 예정이다.", "question_text": null, "choices": ["이 프로그램은 올해 처음 시작됐다.", "내년에는 이 프로그램이 학기 중에 진행된다.", "연구소의 과학자가 학교로 직접 가서 교육을 해 준다.", "이 프로그램은 로봇 과학자를 꿈꾸는 학생들에게 인기가 많다."], "answer": 4, "grammar_point": null, "explanation": "文章の最後で「내년 겨울 방학에도 이 프로그램을 진행할 예정이다(来年の冬休みも実施予定)」「반응이 좋다(反応が良い)」と述べられており、④「ロボット科学者を夢見る学生に人気が高い」と一致する。\n① 「작년에 이어 올해에도(昨年に続き今年も)」実施しているため、今年初めて始まったわけではなく誤り。\n② 来年も実施されるのは겨울 방학(冬休み)であり、学期中ではないため誤り。\n③ 学生が연구소(研究所)を訪れて体験する内容であり、研究者が学校へ出向くのではないため誤り。\n④ ロボット科学者を志望する学生に特に反応が良いという記述と一致。正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [9~12] 次の文またはグラフの内容と一致するものを選びなさい。(各2点)", "passage_ja": "インジュロボット研究所は昨年に続き今年も、冬休みを迎えたインジュ市の小学生を対象に教育プログラムを運営する。ここに参加する学生は研究所で直接ロボットを作ってみたり操縦したりする体験ができる。このプログラムはロボット科学者になることを希望する学生に特に評判が良い。研究所は来年の冬休みにもこのプログラムを実施する予定だ。", "question_text_ja": null, "choices_ja": ["このプログラムは今年初めて始まった。", "来年はこのプログラムが学期中に実施される。", "研究所の科学者が学校に直接出向いて教育してくれる。", "このプログラムはロボット科学者を夢見る学生に人気が高い。"]}, {"id": "96-12", "round": 96, "source": "제96회 읽기 12번", "number": 12, "instruction": "※ [9~12] 다음 글 또는 그래프의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "지난 23일, 한 차량이 산길에서 미끄러지는 사고가 발생했다. 이 사고로 차를 운전하던 김 씨가 의식을 잃자 함께 있던 김 씨의 개가 차에서 빠져나와 근처 마을로 달려갔다. 주인 없는 개가 계속 짖는 것을 이상하게 여긴 마을 사람들이 개를 따라가 김 씨를 발견했다. 사람들의 신고로 김 씨는 병원으로 옮겨져 치료 중이다.", "question_text": null, "choices": ["김 씨는 개를 근처 마을로 보냈다.", "김 씨는 등산을 하다가 사고를 당했다.", "마을 사람들이 키우던 개가 김 씨를 발견했다.", "사람들은 개를 따라가 사고가 난 것을 알게 되었다."], "answer": 4, "grammar_point": null, "explanation": "事故の経緯として「사람들의 신고로 김 씨는 병원으로 옮겨져(通報により病院へ搬送された)」とあり、④「人々は犬について行って事故があったことを知った」という内容と一致する。\n① 気を失った金さんが犬を村へ送ったのではなく、犬が自分から車を抜け出して走って行ったため誤り。\n② 金さんは登山中ではなく、車で山道を運転中に事故に遭ったため誤り。\n③ 犬は村人が飼っていた犬ではなく、金さん自身の犬であるため誤り。\n④ 犬について行った村人たちが金さんを発見し通報したという流れと一致。正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [9~12] 次の文またはグラフの内容と一致するものを選びなさい。(各2点)", "passage_ja": "去る23日、ある車両が山道で滑る事故が発生した。この事故で車を運転していたキム氏が意識を失うと、一緒にいたキム氏の犬が車から抜け出して近くの村へ走って行った。飼い主のいない犬がずっと吠え続けるのを不審に思った村人たちが犬について行きキム氏を発見した。人々の通報によりキム氏は病院に運ばれ治療を受けている。", "question_text_ja": null, "choices_ja": ["キム氏は犬を近くの村に送った。", "キム氏は登山をしていて事故に遭った。", "村人たちが飼っていた犬がキム氏を発見した。", "人々は犬について行って事故が起きたことを知った。"]}, {"id": "96-13", "round": 96, "source": "제96회 읽기 13번", "number": 13, "instruction": "※ [13~15] 다음을 순서에 맞게 배열한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "(가) 대학생 때 처음으로 해외여행을 가게 되었다.\n(나) 가족들은 그 엽서를 받고 아주 감동적이었다고 했다.\n(다) 여행지에서 가족들을 위한 선물을 사고 싶었는데 돈이 별로 없었다.\n(라) 고민하다가 그 나라 풍경이 담긴 엽서에 여행 이야기를 담아 보냈다.", "question_text": null, "choices": ["(가)-(나)-(라)-(다)", "(가)-(다)-(라)-(나)", "(다)-(나)-(가)-(라)", "(다)-(라)-(나)-(가)"], "answer": 2, "grammar_point": null, "explanation": "(가)大学生の時に初めて海外旅行に行くことになった→(다)旅先で家族へのお土産を買いたかったがお金があまりなかった→(라)悩んだ末、その国の風景が写った絵はがきに旅行の話をしたためて送った→(나)家族はその絵はがきを受け取りとても感動したと言った、という「状況設定→問題→解決策→結果」の順に並べると自然な文章になる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [13~15] 次を正しい順序に並べたものを選びなさい。(各2点)", "passage_ja": "(가) 大学生の時、初めて海外旅行に行くことになった。\n(나) 家族はその絵はがきを受け取ってとても感動したと言った。\n(다) 旅行先で家族へのお土産を買いたかったが、あまりお金がなかった。\n(라) 悩んだ末、その国の風景が写った絵はがきに旅の話をつづって送った。", "question_text_ja": null, "choices_ja": ["(가)-(나)-(라)-(다)", "(가)-(다)-(라)-(나)", "(다)-(나)-(가)-(라)", "(다)-(라)-(나)-(가)"]}, {"id": "96-14", "round": 96, "source": "제96회 읽기 14번", "number": 14, "instruction": "※ [13~15] 다음을 순서에 맞게 배열한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "(가) 고리 모양의 반죽은 기름에 골고루 튀겨져 전체가 잘 익었다.\n(나) 그런데 동그란 반죽의 가운데 부분이 익지 않는 경우가 많았다.\n(다) 도넛은 원래 밀가루를 동그랗게 반죽해 기름에 튀겨서 만들었다.\n(라) 어떤 사람이 도넛 반죽의 가운데를 파내 고리 모양으로 만들었다.", "question_text": null, "choices": ["(가)-(다)-(나)-(라)", "(가)-(라)-(다)-(나)", "(다)-(나)-(라)-(가)", "(다)-(라)-(가)-(나)"], "answer": 3, "grammar_point": null, "explanation": "(다)ドーナツはもともと小麦粉を丸く練って油で揚げて作っていた→(나)しかし丸い生地の中心部分が生焼けになることが多かった→(라)ある人がドーナツ生地の中心をくり抜き輪の形にした→(가)輪の形の生地は油で均一に揚がり全体がよく火が通った、という「起源→問題点→解決策→結果」の順に並べると自然な文章になる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [13~15] 次を正しい順序に並べたものを選びなさい。(各2点)", "passage_ja": "(가) 輪っか状の生地は油でまんべんなく揚がり、全体がよく火が通った。\n(나) ところが、丸い生地の真ん中の部分に火が通らないことが多かった。\n(다) ドーナツはもともと小麦粉を丸くこねて油で揚げて作った。\n(라) ある人がドーナツの生地の真ん中をくり抜いて輪っか状にした。", "question_text_ja": null, "choices_ja": ["(가)-(다)-(나)-(라)", "(가)-(라)-(다)-(나)", "(다)-(나)-(라)-(가)", "(다)-(라)-(가)-(나)"]}, {"id": "96-15", "round": 96, "source": "제96회 읽기 15번", "number": 15, "instruction": "※ [13~15] 다음을 순서에 맞게 배열한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "(가) 또한 고양이는 수염으로 기분을 드러내기도 한다.\n(나) 고양이는 높고 좁은 담 위에서도 흔들림 없이 걷는다.\n(다) 수염으로 바람의 방향을 느끼며 몸의 균형을 잡기 때문이다.\n(라) 두려울 때는 수염을 뒤쪽으로 당기고, 편안할 때는 아래로 내린다.", "question_text": null, "choices": ["(나)-(다)-(가)-(라)", "(나)-(라)-(가)-(다)", "(라)-(가)-(나)-(다)", "(라)-(나)-(다)-(가)"], "answer": 1, "grammar_point": null, "explanation": "(나)猫は高くて狭い塀の上でも揺らぐことなく歩く→(다)それはひげで風向きを感じ取り体のバランスを取っているからだ→(가)また猫はひげで気分を表すこともある→(라)怖い時はひげを後ろに引き、安心している時は下に下げる、という「現象提示→理由説明→追加情報→具体例」の順に並べると自然な文章になる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [13~15] 次を正しい順序に並べたものを選びなさい。(各2点)", "passage_ja": "(가) また、猫はひげで気分を表すこともある。\n(나) 猫は高くて狭い塀の上でもぐらつかずに歩く。\n(다) ひげで風向きを感じ取り、体のバランスを取るためだ。\n(라) 怖いときはひげを後ろに引き、安心しているときは下に垂らす。", "question_text_ja": null, "choices_ja": ["(나)-(다)-(가)-(라)", "(나)-(라)-(가)-(다)", "(라)-(가)-(나)-(다)", "(라)-(나)-(다)-(가)"]}, {"id": "96-16", "round": 96, "source": "제96회 읽기 16번", "number": 16, "instruction": "※ [16~18] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "영화 속 장면에서 전화번호가 나오는 경우가 있다. 이때 실제 전화번호를 사용하면 호기심에 전화하는 사람이 생겨서 이 번호를 사용하는 사람은 일상생활이 힘들어질 수 있다. 영화진흥위원회에서는 이와 같은 ( ) 영화에 나와도 상관없는 전화번호를 확보해 두고 이를 영화 제작사에 제공해 주고 있다.", "question_text": null, "choices": ["피해를 막기 위해", "사실을 화면에 담고자", "관객 요구를 반영하고자", "제작 방법을 알리기 위해"], "answer": 1, "grammar_point": null, "explanation": "実際の電話番号を映画で使うと、その番号を使う一般人に好奇心からの電話がかかり生活に支障が出るという文脈なので、映画振興委員会が電話番号を確保・提供する目的は①「被害を防ぐために」である。\n① 피해를 막기 위해(被害を防ぐために): 一般人への迷惑という「被害」を防ぐ目的と直接合致する。正解。\n② 사실을 화면에 담고자(事実を画面に収めようと): 実在の番号を使う理由の説明にはなるが、代替番号を提供する目的の説明にはならず文脈に合わない。\n③ 관객 요구를 반영하고자(観客の要求を反映しようと): 本文に観客の要求についての言及はなく文脈に合わない。\n④ 제작 방법을 알리기 위해(制作方法を知らせるために): 番号提供と製作方法の周知は無関係で文脈に合わない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [16~18] （　）に入る言葉として最も適切なものを選びなさい。(各2点)", "passage_ja": "映画のワンシーンに電話番号が登場することがある。この時、実際の電話番号を使うと好奇心から電話をかける人が現れ、その番号を使っている人は日常生活に支障が出ることがある。映画振興委員会ではこのような（　）映画に出てきても差し支えない電話番号を確保しておき、これを映画製作会社に提供している。", "question_text_ja": null, "choices_ja": ["被害を防ぐために", "事実を画面に収めようと", "観客の要望を反映しようと", "制作方法を知らせるために"]}, {"id": "96-17", "round": 96, "source": "제96회 읽기 17번", "number": 17, "instruction": "※ [16~18] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "30년 전 에너지 전문가들은 그로부터 40년 후에는 지구에 사용할 수 있는 석유가 남아 있지 않을 거라고 경고했다. 그러나 현재의 전문가들은 앞으로도 50년 이상은 계속해서 석유를 사용할 수 있을 거라고 예측한다. 이렇게 석유의 ( ) 이유는 석유를 찾는 기술이 발전했기 때문이다. 이 기술로 석유가 있는 곳을 더 많이 발견하게 된 것이다.", "question_text": null, "choices": ["품질이 더 좋아진", "가격이 상승하고 있는", "사용 가능 기간이 늘어난", "가치가 계속해서 떨어지는"], "answer": 3, "grammar_point": null, "explanation": "30年前は「40年後に石油が枯渇する」と警告されたが、現在は「今後50年以上使用できる」と予測されているという内容から、石油の③「使用可能な期間が延びた」理由が技術発展にあると述べる文脈に合う。\n① 품질이 더 좋아진(品質がより良くなった): 本文は採掘技術の発展を述べているのであり、石油自体の品質向上については言及がなく文脈に合わない。\n② 가격이 상승하고 있는(価格が上昇している): 価格についての言及はなく文脈に合わない。\n③ 사용 가능 기간이 늘어난(使用可能期間が延びた): 予測が「40年後に枯渇」から「今後50年以上使用可能」に伸びたという内容と一致。正解。\n④ 가치가 계속해서 떨어지는(価値が下がり続けている): 埋蔵量発見が増えたという内容であり、価値の下落については述べられておらず文脈に合わない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [16~18] （　）に入る言葉として最も適切なものを選びなさい。(各2点)", "passage_ja": "30年前、エネルギー専門家たちはそれから40年後には地球上で使える石油が残っていないだろうと警告した。しかし現在の専門家たちは、これからも50年以上は引き続き石油を使い続けられるだろうと予測している。このように石油の（　）理由は、石油を探す技術が発展したためだ。この技術によって石油のある場所をより多く発見できるようになったのだ。", "question_text_ja": null, "choices_ja": ["品質がより良くなった", "価格が上昇している", "使用可能な期間が延びた", "価値が下がり続けている"]}, {"id": "96-18", "round": 96, "source": "제96회 읽기 18번", "number": 18, "instruction": "※ [16~18] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "수표교는 홍수 피해에 대비하기 위해 만든 조선 시대의 다리이다. 돌로 된 수표교의 기둥에는 일정한 간격마다 표시가 되어 있어서 ( ) 쉽게 알 수 있었다. 수표교를 관리하는 담당자는 비가 오면 강물이 높아지는지를 수시로 확인하고 홍수가 날 것 같으면 사람들에게 알려 대피하도록 했다.", "question_text": null, "choices": ["강물의 높이 변화를", "강물의 속도 차이를", "다리 기둥의 간격을", "다리를 만든 재료를"], "answer": 1, "grammar_point": null, "explanation": "橋の柱に一定間隔で目盛りがあり、それによって何が分かったかを述べる文脈。直後に「강물이 높아지는지를 수시로 확인(川の水位が上がっていないか随時確認)」とあるため、①「川の水位の変化を」が正解。\n① 강물의 높이 변화를(川の水位の変化を): 目盛りで水位の上下を測るという直後の説明と一致。正解。\n② 강물의 속도 차이를(川の流速の違いを): 流速の測定についての言及はなく文脈に合わない。\n③ 다리 기둥의 간격을(橋脚の間隔を): 目盛りは間隔そのものを知るためではなく水位を測るための道具であり文脈に合わない。\n④ 다리를 만든 재료를(橋を作った材料を): 材料は既に「돌로 된(石造りの)」と説明済みで、目盛りの役割とは無関係。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [16~18] （　）に入る言葉として最も適切なものを選びなさい。(各2点)", "passage_ja": "水標橋(スピョギョ)は洪水被害に備えるために作られた朝鮮時代の橋である。石造りの水標橋の柱には一定の間隔ごとに目盛りが刻まれており、（　）簡単に知ることができた。水標橋を管理する担当者は雨が降ると川の水位が上がっていないかを随時確認し、洪水が起きそうなときは人々に知らせて避難させた。", "question_text_ja": null, "choices_ja": ["川の水位の変化を", "川の流速の違いを", "橋の柱の間隔を", "橋を作った材料を"]}, {"id": "96-19", "round": 96, "source": "제96회 읽기 19번", "number": 19, "instruction": "※ [19~20] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "19-20", "passage": "좋은 생각을 끌어내려면 질문을 어떻게 할지 잘 고민해야 한다. 어떤 회사에서 신제품을 만들고자 직원에게 질문을 한다고 치자. \"어떤 물건이 잘 팔릴까?\"라고 막연하게 질문하면 대답이 잘 나오지 않는다. 좋은 질문이 아니기 때문이다. ( ) \"지금까지의 제품에서 무엇을 개선할까?\"라고 질문하면 도움이 되는 구체적인 답이 나온다.", "question_text": "( )에 들어갈 말로 가장 알맞은 것을 고르십시오.", "choices": ["결코", "특히", "비록", "반면"], "answer": 4, "grammar_point": "반면 (一方で、対照の接続詞)", "explanation": "前文「막연하게 질문하면 대답이 잘 나오지 않는다(漠然とした質問には答えが出にくい)」と後文「구체적인 답이 나온다(具体的な質問には役立つ答えが出る)」が対照関係にあるため、④「반면(一方で)」が正解。\n① 결코(決して〜ない): 強い否定を伴う副詞で、後に否定表現が必要だが後文は肯定文のため合わない。\n② 특히(特に): 前述の内容の中で一部を強調する際に使うが、ここは対照関係であり強調の関係ではないため合わない。\n③ 비록(たとえ〜としても): 後に「-아/어도、-더라도」などの譲歩表現を伴う副詞で、この文脈の構造に合わない。\n④ 반면(一方で): 漠然とした質問と具体的な質問という対照的な内容をつなぐ接続語として最も自然。正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [19~20] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "良いアイデアを引き出すには、質問をどのようにするかをよく考えなければならない。ある会社が新製品を作ろうと社員に質問するとしよう。「どんな商品が売れるだろうか?」と漠然と質問すると、なかなか答えが出てこない。良い質問ではないからだ。（　）「これまでの製品の何を改善しようか?」と質問すると、役に立つ具体的な答えが出てくる。", "question_text_ja": "（　）に入る言葉として最も適切なものを選びなさい。", "choices_ja": ["決して", "特に", "たとえ", "一方"]}, {"id": "96-20", "round": 96, "source": "제96회 읽기 20번", "number": 20, "instruction": "※ [19~20] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "19-20", "passage": "좋은 생각을 끌어내려면 질문을 어떻게 할지 잘 고민해야 한다. 어떤 회사에서 신제품을 만들고자 직원에게 질문을 한다고 치자. \"어떤 물건이 잘 팔릴까?\"라고 막연하게 질문하면 대답이 잘 나오지 않는다. 좋은 질문이 아니기 때문이다. ( ) \"지금까지의 제품에서 무엇을 개선할까?\"라고 질문하면 도움이 되는 구체적인 답이 나온다.", "question_text": "윗글의 주제로 가장 알맞은 것을 고르십시오.", "choices": ["질문을 한 후에 생각할 시간을 줘야 한다.", "도움이 되는 답을 얻으려면 질문을 잘해야 한다.", "질문하기 전에 예상되는 답을 미리 생각해야 한다.", "추상적인 질문으로 자유로운 생각을 끌어내야 한다."], "answer": 2, "grammar_point": null, "explanation": "文章全体は「좋은 질문을 해야 도움이 되는 답을 얻을 수 있다(良い質問をしてこそ役立つ答えが得られる)」という内容なので、②が主題として最も適切。\n① 質問後に考える時間を与えるべき、という時間の話は本文にないため誤り。\n② 具体的で良い質問をしてこそ役立つ答えが得られるという文章全体の主張と一致。正解。\n③ 質問前に予想される答えを考えるべき、という内容は本文にないため誤り。\n④ 本文はむしろ막연한(抽象的な)質問ではなく具体的な質問が良いと述べており、④は本文の主張と逆であるため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [19~20] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "良いアイデアを引き出すには、質問をどのようにするかをよく考えなければならない。ある会社が新製品を作ろうと社員に質問するとしよう。「どんな商品が売れるだろうか?」と漠然と質問すると、なかなか答えが出てこない。良い質問ではないからだ。（　）「これまでの製品の何を改善しようか?」と質問すると、役に立つ具体的な答えが出てくる。", "question_text_ja": "上の文章の主題として最も適切なものを選びなさい。", "choices_ja": ["質問をした後は考える時間を与えなければならない。", "役に立つ答えを得るには質問を上手にしなければならない。", "質問する前に予想される答えをあらかじめ考えておかなければならない。", "抽象的な質問で自由な発想を引き出さなければならない。"]}, {"id": "96-21", "round": 96, "source": "제96회 읽기 21번", "number": 21, "instruction": "※ [21~22] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "21-22", "passage": "학생 수 감소로 폐교가 될 뻔한 산골 초등학교가 위기에서 벗어나 화제이다. 이 학교 선생님들은 ( ) 학교를 살릴 방법을 고민했다. 그러다 찾은 것이 '음악 특성화 학교'였다. 선생님들은 예술대학교에 협조를 요청해 학생들에게 다양한 악기를 가르칠 전문가를 구했다. 또 기업의 기부를 받아 유명 음악가와 함께하는 음악회도 개최했다. 이런 소문을 듣고 음악을 배우러 오는 학생들이 생기면서 이 학교는 폐교 위기에서 벗어났다.", "question_text": "( )에 들어갈 말로 가장 알맞은 것을 고르십시오.", "choices": ["눈을 딱 감고", "머리를 맞대고", "손에 땀을 쥐고", "목에 힘을 주고"], "answer": 2, "grammar_point": "머리를 맞대다 (額を寄せ合う=知恵を出し合う)", "explanation": "廃校の危機を乗り越えるために先生たちが「学校を救う方法を考えた」という文脈に合うのは、②「머리를 맞대고(額を寄せ合って=一緒に知恵を出し合って)」という慣用表現。\n① 눈을 딱 감고(目をつぶって): 「見て見ぬふりをする/思い切って決断する」の意で、複数人で知恵を出す文脈に合わない。\n② 머리를 맞대고(額を寄せ合って): 「一緒に集まって知恵を出し合う」の意で、先生たちが協力して方法を考えたという文脈に合致。正解。\n③ 손에 땀을 쥐고(手に汗を握って): 「ハラハラしながら」の意で、緊迫した見守りの場面に使う表現であり文脈に合わない。\n④ 목에 힘을 주고(首に力を入れて): 「威張る、偉そうにする」の意で、この文脈に合わない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [21~22] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "生徒数の減少で廃校になりかけていた山あいの小学校が危機を脱し、話題になっている。この学校の先生たちは（　）学校を救う方法を考えた。そうして見つけたのが「音楽特化校」だった。先生たちは芸術大学に協力を要請し、生徒たちに様々な楽器を教える専門家を確保した。また企業の寄付を受けて、有名音楽家と共に行う音楽会も開催した。このうわさを聞いて音楽を習いに来る生徒が現れ、この学校は廃校の危機を脱した。", "question_text_ja": "（　）に入る言葉として最も適切なものを選びなさい。", "choices_ja": ["思い切って目をつぶり", "額を寄せ合って", "手に汗を握って", "肩で風を切って"]}, {"id": "96-22", "round": 96, "source": "제96회 읽기 22번", "number": 22, "instruction": "※ [21~22] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "21-22", "passage": "학생 수 감소로 폐교가 될 뻔한 산골 초등학교가 위기에서 벗어나 화제이다. 이 학교 선생님들은 ( ) 학교를 살릴 방법을 고민했다. 그러다 찾은 것이 '음악 특성화 학교'였다. 선생님들은 예술대학교에 협조를 요청해 학생들에게 다양한 악기를 가르칠 전문가를 구했다. 또 기업의 기부를 받아 유명 음악가와 함께하는 음악회도 개최했다. 이런 소문을 듣고 음악을 배우러 오는 학생들이 생기면서 이 학교는 폐교 위기에서 벗어났다.", "question_text": "윗글의 내용과 같은 것을 고르십시오.", "choices": ["이 초등학교는 기업에 요청해 악기 전문가를 구했다.", "이 초등학교는 선생님들의 노력에도 학생 수가 줄었다.", "이 초등학교에서 개최한 음악회에 유명 음악가가 참여했다.", "이 초등학교 선생님들이 학생들에게 직접 악기를 가르쳤다."], "answer": 3, "grammar_point": null, "explanation": "「기업의 기부를 받아 유명 음악가와 함께하는 음악회도 개최했다(企業の寄付を受けて有名音楽家と共に音楽会を開催した)」という記述から、③が一致する。\n① 楽器の専門家は기업(企業)ではなく예술대학교(芸術大学)に協力を要請して確保したため誤り。企業からは寄付を受けただけである。\n② 教師たちの努力によって学校は廃校の危機を脱し生徒が集まってきたのであり、生徒数が減ったわけではないため誤り。\n③ 企業の寄付で有名音楽家と共に音楽会を開いたという記述と一致。正解。\n④ 楽器を直接教えたのは教師ではなく、芸術大学から招いた専門家であるため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [21~22] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "生徒数の減少で廃校になりかけていた山あいの小学校が危機を脱し、話題になっている。この学校の先生たちは（　）学校を救う方法を考えた。そうして見つけたのが「音楽特化校」だった。先生たちは芸術大学に協力を要請し、生徒たちに様々な楽器を教える専門家を確保した。また企業の寄付を受けて、有名音楽家と共に行う音楽会も開催した。このうわさを聞いて音楽を習いに来る生徒が現れ、この学校は廃校の危機を脱した。", "question_text_ja": "上の文章の内容と一致するものを選びなさい。", "choices_ja": ["この小学校は企業に依頼して楽器の専門家を確保した。", "この小学校は先生たちの努力にもかかわらず生徒数が減った。", "この小学校が開催した音楽会に有名音楽家が参加した。", "この小学校の先生たちが生徒に直接楽器を教えた。"]}, {"id": "96-23", "round": 96, "source": "제96회 읽기 23번", "number": 23, "instruction": "※ [23~24] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "23-24", "passage": "퇴직한 아빠는 매일 아침 운전을 해서 나를 직장까지 데려다주셨다. 출근길 대중교통이 불편했기 때문이다. 아빠는 운전하면서 잔소리를 많이 하셨다. \"신입 사원은 인사를 잘해야 해. 돈 아껴 쓰고……\" 출근할 때마다 잔소리를 듣는 것도 싫고 운전도 하고 싶어서 운전면허를 땄다. 나는 면허증을 받자마자 직접 운전해서 출근하기로 했다. 새 차를 샀다가 긁히기라도 할까 봐 당분간 아빠의 차를 빌려 쓰기로 했다. \"사방을 잘 살피면서 운전해야 한다.\" 아빠에게 나도 그 정도는 안다고 큰소리를 치고 출발했다. 그러나 운전하는 내내 다리가 후들후들 떨렸다. 옆자리에 앉아 있을 때와는 달랐다. 운전대를 꼭 붙든 채 앞만 보고 도로를 달렸다. 퇴근하고 집에 무사히 돌아왔을 땐 안도감에 눈물이 날 정도였다. 매일 나를 데려다주신 아빠에게 새삼 감사함을 느꼈다.", "question_text": "밑줄 친 부분에 나타난 '나'의 심정으로 가장 알맞은 것을 고르십시오.", "choices": ["기대되다", "긴장되다", "뿌듯하다", "창피하다"], "answer": 2, "grammar_point": null, "explanation": "初めて一人で運転する場面で「다리가 후들후들 떨렸다(足ががくがく震えた)」「운전대를 꼭 붙든 채 앞만 보고(ハンドルをしっかり握って前だけ見て)」という描写から、②「긴장되다(緊張する)」が心情として最も適切。\n① 기대되다(期待される): 楽しみにする気持ちで、震えながら緊張して運転する描写とは合わない。\n② 긴장되다(緊張する): 足が震え前だけを見て運転するという描写と一致。正解。\n③ 뿌듯하다(誇らしい、満ち足りている): 達成感を表す語で、下線部の運転中よりも無事帰宅した後の安堵・感謝の場面に近く、ここでは合わない。\n④ 창피하다(恥ずかしい): 恥の感情についての描写はなく文脈に合わない。", "underline_field": "passage", "underline_ko": "운전대를 꼭 붙든 채 앞만 보고 도로를 달렸다", "underline_ja": "ハンドルをしっかり握りしめたまま前だけを見て道を走った", "instruction_ja": "※ [23~24] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "退職した父は毎朝車を運転して私を職場まで送ってくれた。通勤時の公共交通機関が不便だったからだ。父は運転しながらよく小言を言った。「新入社員は挨拶をきちんとしなきゃいけない。お金は節約して……」出勤するたびに小言を聞かされるのも嫌だったし、自分でも運転したかったので運転免許を取った。私は免許証を受け取るとすぐに、自分で運転して出勤することにした。新車を買って傷でもつけたら嫌だったので、しばらくの間は父の車を借りて使うことにした。「四方をよく確認しながら運転しなさい。」父に、それくらいは自分でも分かっていると強気に言い放って出発した。しかし運転している間ずっと足がガクガクと震えた。助手席に座っていたときとは違った。ハンドルをしっかり握りしめたまま前だけを見て道を走った。仕事を終えて無事に家に帰り着いたときは、安堵のあまり涙が出そうなほどだった。毎日私を送ってくれていた父に、今さらながら感謝の気持ちを感じた。", "question_text_ja": "下線を引いた部分に表れた「私」の心情として最も適切なものを選びなさい。", "choices_ja": ["期待に胸が膨らむ", "緊張する", "誇らしい", "恥ずかしい"]}, {"id": "96-24", "round": 96, "source": "제96회 읽기 24번", "number": 24, "instruction": "※ [23~24] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "23-24", "passage": "퇴직한 아빠는 매일 아침 운전을 해서 나를 직장까지 데려다주셨다. 출근길 대중교통이 불편했기 때문이다. 아빠는 운전하면서 잔소리를 많이 하셨다. \"신입 사원은 인사를 잘해야 해. 돈 아껴 쓰고……\" 출근할 때마다 잔소리를 듣는 것도 싫고 운전도 하고 싶어서 운전면허를 땄다. 나는 면허증을 받자마자 직접 운전해서 출근하기로 했다. 새 차를 샀다가 긁히기라도 할까 봐 당분간 아빠의 차를 빌려 쓰기로 했다. \"사방을 잘 살피면서 운전해야 한다.\" 아빠에게 나도 그 정도는 안다고 큰소리를 치고 출발했다. 그러나 운전하는 내내 다리가 후들후들 떨렸다. 옆자리에 앉아 있을 때와는 달랐다. 운전대를 꼭 붙든 채 앞만 보고 도로를 달렸다. 퇴근하고 집에 무사히 돌아왔을 땐 안도감에 눈물이 날 정도였다. 매일 나를 데려다주신 아빠에게 새삼 감사함을 느꼈다.", "question_text": "윗글의 내용과 같은 것을 고르십시오.", "choices": ["나는 아빠의 차를 운전해서 회사에 다녀왔다.", "나는 운전면허를 따기 전에 대중교통으로 출근했다.", "나는 운전면허를 따자마자 자동차를 새로 구매했다.", "나는 아빠의 조언 덕분에 운전하는 것이 어렵지 않았다."], "answer": 1, "grammar_point": null, "explanation": "「당분간 아빠의 차를 빌려 쓰기로 했다(しばらく父の車を借りることにした)」とあり、その後実際に運転して出勤し無事帰宅した描写から、①「父の車を運転して会社に行ってきた」が一致する。\n① 父の車を借りて運転通勤したという内容と一致。正解。\n② 免許を取る前は父が車で送ってくれていたのであり(出勤時の交通手段が不便だったため)、公共交通機関を使っていたわけではないため誤り。\n③「새 차를 샀다가 긁힐까 봐(新しい車を買って傷がつくことを恐れて)」父の車を借りることにしたのであり、実際に新車を購入したわけではないため誤り。\n④ 運転中「다리가 후들후들 떨렸다(足ががくがく震えた)」とあり、緊張しながら運転したのであって、父の助言のおかげで難なく運転できたわけではないため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [23~24] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "退職した父は毎朝車を運転して私を職場まで送ってくれた。通勤時の公共交通機関が不便だったからだ。父は運転しながらよく小言を言った。「新入社員は挨拶をきちんとしなきゃいけない。お金は節約して……」出勤するたびに小言を聞かされるのも嫌だったし、自分でも運転したかったので運転免許を取った。私は免許証を受け取るとすぐに、自分で運転して出勤することにした。新車を買って傷でもつけたら嫌だったので、しばらくの間は父の車を借りて使うことにした。「四方をよく確認しながら運転しなさい。」父に、それくらいは自分でも分かっていると強気に言い放って出発した。しかし運転している間ずっと足がガクガクと震えた。助手席に座っていたときとは違った。ハンドルをしっかり握りしめたまま前だけを見て道を走った。仕事を終えて無事に家に帰り着いたときは、安堵のあまり涙が出そうなほどだった。毎日私を送ってくれていた父に、今さらながら感謝の気持ちを感じた。", "question_text_ja": "上の文章の内容と一致するものを選びなさい。", "choices_ja": ["私は父の車を運転して会社に行ってきた。", "私は運転免許を取る前は公共交通機関で出勤していた。", "私は運転免許を取るとすぐに新しく車を購入した。", "私は父のアドバイスのおかげで運転することが難しくなかった。"]}, {"id": "96-25", "round": 96, "source": "제96회 읽기 25번", "number": 25, "instruction": "※ [25~27] 다음 신문 기사의 제목을 가장 잘 설명한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "모처럼의 황금연휴, 여행사 예약 문의 '껑충'", "question_text": null, "choices": ["연휴가 짧아서 여행 상품을 찾는 예약 문의가 줄어들었다.", "값이 비싸더라도 연휴 기간에 여행을 가려는 사람이 많아졌다.", "오랜만에 오는 긴 연휴를 맞아 여행사에 예약 상담이 대폭 늘었다.", "매년 돌아오는 연휴를 앞두고 여행사마다 적극적인 홍보를 시작했다."], "answer": 3, "grammar_point": null, "explanation": "見出し「모처럼의 황금연휴(久しぶりの大型連休)」「예약 문의 껑충(予約問い合わせが急増)」は、③「久しぶりの長い連休を控え旅行会社への予約相談が大幅に増えた」ことを説明している。\n① 연휴가 짧아서(連休が短くて)予約問い合わせが減った、という内容は見出しの「껑충(急増)」と逆であり誤り。\n② 値段が高くても旅行に行きたい人が増えた、という価格についての言及は見出しになく誤り。\n③「모처럼의(久しぶりの)」大型連休を控え予約相談が急増したという見出しの内容と一致。正解。\n④「매년 돌아오는(毎年巡ってくる)」という表現は「모처럼의(久しぶりの)」と矛盾し、また積極的な広報についての言及も見出しにないため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [25~27] 次の新聞記事の見出しを最もよく説明しているものを選びなさい。(各2点)", "passage_ja": "久々の大型連休、旅行会社への予約問い合わせ『急増』", "question_text_ja": null, "choices_ja": ["連休が短く、旅行商品を探す予約問い合わせが減った。", "値段が高くても連休中に旅行に行こうとする人が増えた。", "久々に訪れる長い連休を迎え、旅行会社への予約相談が大幅に増えた。", "毎年訪れる連休を前に、各旅行会社が積極的な宣伝を始めた。"]}, {"id": "96-26", "round": 96, "source": "제96회 읽기 26번", "number": 26, "instruction": "※ [25~27] 다음 신문 기사의 제목을 가장 잘 설명한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "김민수 '올해의 선수상' 수상 유력, 야구팬들 기대 고조", "question_text": null, "choices": ["김민수가 상을 받아서 야구팬들이 매우 기뻐하고 있다.", "김민수가 야구팬들의 큰 기대에도 불구하고 상을 받지 못했다.", "김민수가 상을 받을 가능성이 많아 야구팬들의 기대가 높아지고 있다.", "김민수가 상을 받는 데 실패했지만 야구팬들에게 많은 응원을 받았다."], "answer": 3, "grammar_point": null, "explanation": "見出し「수상 유력(受賞有力)」「기대 고조(期待が高まる)」は、③「受賞の可能性が高くファンの期待が高まっている」ことを説明している。\n① 「유력(有力)」はまだ受賞が確定したわけではなく可能性が高いという意味であり、すでに受賞して喜んでいるという内容は誤り。\n② 見出しは期待が高まっているという内容であり、受賞できなかったという内容とは逆であるため誤り。\n③ 受賞の可能性が高くファンの期待が高まっているという見出しの内容と一致。正解。\n④ 受賞に失敗したという内容は見出しにある「유력(有力)」と矛盾するため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [25~27] 次の新聞記事の見出しを最もよく説明しているものを選びなさい。(各2点)", "passage_ja": "キム・ミンス『今年の選手賞』受賞有力、野球ファンの期待高まる", "question_text_ja": null, "choices_ja": ["キム・ミンスが賞を受賞し、野球ファンがとても喜んでいる。", "キム・ミンスは野球ファンの大きな期待にもかかわらず賞を受賞できなかった。", "キム・ミンスが賞を受賞する可能性が高く、野球ファンの期待が高まっている。", "キム・ミンスは受賞に失敗したが、野球ファンから多くの応援を受けた。"]}, {"id": "96-27", "round": 96, "source": "제96회 읽기 27번", "number": 27, "instruction": "※ [25~27] 다음 신문 기사의 제목을 가장 잘 설명한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "지지부진한 태풍 피해 복구, 속 터지는 인주 주민들", "question_text": null, "choices": ["태풍 피해가 매년 발생해 인주 주민들이 대책을 요구했다.", "태풍 피해를 복구하는 일에 인주 주민들의 참여가 저조하다.", "태풍 피해를 막기 위한 방안이 인주 주민들에게 호응을 얻고 있다.", "태풍 피해 복구가 잘 진행되지 않아 인주 주민들이 답답해하고 있다."], "answer": 4, "grammar_point": null, "explanation": "見出し「지지부진한 복구(遅々として進まない復旧)」「속 터지는 주민들(もどかしい住民たち)」は、④「復旧がうまく進まず住民がもどかしく思っている」ことを説明している。\n① 台風被害が毎年発生し対策を要求した、という内容は見出しになく誤り。\n② 見出しの「지지부진(遅々として進まない)」は復旧作業自体の遅れを指しており、住民の参加が低調だという意味ではないため誤り。\n③ 対策への好意的な反応についての言及は見出しになく、むしろ住民は不満を抱いているため誤り。\n④ 復旧が思うように進まず住民がもどかしく思っているという見出しの内容と一致。正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [25~27] 次の新聞記事の見出しを最もよく説明しているものを選びなさい。(各2点)", "passage_ja": "遅々として進まない台風被害の復旧、もどかしいインジュ住民たち", "question_text_ja": null, "choices_ja": ["台風被害が毎年発生し、インジュ住民が対策を要求した。", "台風被害の復旧作業へのインジュ住民の参加が低調だ。", "台風被害を防ぐための方策がインジュ住民から支持を得ている。", "台風被害の復旧が思うように進まず、インジュ住民がもどかしく思っている。"]}, {"id": "96-28", "round": 96, "source": "제96회 읽기 28번", "number": 28, "instruction": "※ [28~31] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "특정 장소를 실시간으로 비추어 주는 인터넷 방송 채널인 '지금 거기'가 최근 인기를 끌고 있다. 이 방송에서는 남산에서 내려다보는 서울 풍경, 창밖으로 보이는 뉴욕 타임스퀘어 거리 등 하나의 장소를 편집 없이 그대로 보여 준다. 화면 앞에 있는 시청자들은 현장감 있는 풍경에 빠져들어 마치 ( ) 것처럼 느끼게 된다.", "question_text": null, "choices": ["오래된 영상을 보는", "전혀 가 본 적이 없는", "연예인과 방송에 출연하는", "직접 그곳에 가서 바라보는"], "answer": 4, "grammar_point": null, "explanation": "「현장감 있는 풍경에 빠져들어(臨場感のある景色に引き込まれて)」という文脈から、視聴者はまるで④「直接その場所に行って眺めている」かのように感じる、という内容が自然。\n① 오래된 영상을 보는(古い映像を見る): 本文は「실시간으로(リアルタイムで)」「편집 없이 그대로(編集なしにそのまま)」映すと説明しており、古い映像ではないため文脈に合わない。\n② 전혀 가 본 적이 없는(全く行ったことのない): 臨場感によってまるで自分がその場にいるかのように感じる、という内容と方向性が逆で文脈に合わない。\n③ 연예인과 방송에 출연하는(芸能人と番組に出演する): 芸能人についての言及は本文になく文脈に合わない。\n④ 직접 그곳에 가서 바라보는(直接その場所に行って眺める): 臨場感に引き込まれる感覚を最もよく表しており文脈に合う。正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [28~31] （　）に入る言葉として最も適切なものを選びなさい。(各2点)", "passage_ja": "特定の場所をリアルタイムで映すインターネット放送チャンネル『今そこ』が最近人気を集めている。この放送では南山から見下ろすソウルの風景、窓の外に見えるニューヨーク・タイムズスクエアの通りなど、一つの場所を編集なしにそのまま見せる。画面の前にいる視聴者は臨場感のある景色に引き込まれ、まるで（　）ように感じるようになる。", "question_text_ja": null, "choices_ja": ["古い映像を見ている", "全く行ったことのない", "芸能人と一緒に番組に出演している", "自分でその場所に行って眺めている"]}, {"id": "96-29", "round": 96, "source": "제96회 읽기 29번", "number": 29, "instruction": "※ [28~31] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "'산조'는 한 명의 연주자가 악기 하나를 가지고 다채로운 가락과 장단을 즉흥적으로 표현하는 한국 전통 음악의 한 갈래이다. 산조의 독특한 특성은 연주자가 악보대로 연주하는 것이 아니라 무대마다 다른 독주를 선보인다는 데 있다. 현장 분위기에 맞춰 ( ) 연주하기 때문에 같은 연주자의 공연을 여러 번 보아도 그때마다 새로운 감동을 받을 수 있다.", "question_text": null, "choices": ["여러 사람이 동시에", "다양한 변화를 주면서", "새로운 악기를 더하여", "악보를 보면서 그대로"], "answer": 2, "grammar_point": null, "explanation": "「무대마다 다른 독주를 선보인다(舞台ごとに異なる演奏を披露する)」という即興性の説明から、②「다양한 변화를 주면서(様々な変化をつけながら)」が正解。\n① 여러 사람이 동시에(複数の人が同時に): 산조は「한 명의 연주자가(一人の演奏者が)」演奏するものと明記されており誤り。\n② 다양한 변화를 주면서(様々な変化をつけながら): 即興で毎回異なる演奏をするという即興性の説明と一致。正解。\n③ 새로운 악기를 더하여(新しい楽器を加えて): 楽器を増やすという内容の言及はなく、악기 하나로 연주すると本文にあるため誤り。\n④ 악보를 보면서 그대로(楽譜を見てそのまま): 산조の特徴は「악보대로 연주하는 것이 아니라(楽譜通りに演奏するのではなく)」即興的に演奏することであり、正反対の内容のため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [28~31] （　）に入る言葉として最も適切なものを選びなさい。(各2点)", "passage_ja": "「散調(サンジョ)」は、一人の演奏者が一つの楽器で多彩な旋律とリズムを即興的に表現する韓国伝統音楽の一分野である。散調の独特な特徴は、演奏者が楽譜通りに演奏するのではなく、舞台ごとに異なる独奏を披露するという点にある。その場の雰囲気に合わせて（　）演奏するため、同じ演奏者の公演を何度見ても、その都度新しい感動を受けることができる。", "question_text_ja": null, "choices_ja": ["大勢の人が同時に", "様々な変化をつけながら", "新しい楽器を加えて", "楽譜を見ながらそのまま"]}, {"id": "96-30", "round": 96, "source": "제96회 읽기 30번", "number": 30, "instruction": "※ [28~31] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "치킨을 먹을 때 기름이 손에 묻는 게 싫어서 비닐장갑을 사용하는 사람들이 많다. 그런데 비닐장갑을 끼고 치킨을 먹더라도 여전히 기름이 손에 묻는다. 이는 비닐이 기름에 친화적인 폴리에틸렌으로 만들어져 비닐장갑에 기름이 잘 스며들기 때문이다. 게다가 비닐장갑의 두께가 매우 얇아 기름이 ( ) 수 있다.", "question_text": null, "choices": ["손에 전혀 묻지 않을", "치킨의 맛을 떨어뜨릴", "비닐을 부드럽게 만들", "장갑을 더 쉽게 통과할"], "answer": 4, "grammar_point": null, "explanation": "비닐장갑の厚さが非常に薄いという文脈から、④「기름이 장갑을 더 쉽게 통과할(油が手袋をより簡単に通り抜けられる)」が自然な結論。\n① 손에 전혀 묻지 않을(手に全く付かない): 本文全体は手袋をしても油が手に付いてしまう理由を説明する内容であり、正反対のため誤り。\n② 치킨의 맛을 떨어뜨릴(チキンの味を落とす): 味についての言及は本文になく文脈に合わない。\n③ 비닐을 부드럽게 만들(ビニールを柔らかくする): 薄さと油の浸透しやすさについての説明であり、柔らかくなるという内容は本文にないため誤り。\n④ 장갑을 더 쉽게 통과할(手袋をより簡単に通り抜ける): 手袋が薄いため油が浸透しやすいという直前の説明と自然につながる。正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [28~31] （　）に入る言葉として最も適切なものを選びなさい。(各2点)", "passage_ja": "チキンを食べるとき油が手につくのが嫌でビニール手袋を使う人が多い。ところがビニール手袋をはめてチキンを食べても、やはり油が手についてしまう。これはビニールが油になじみやすいポリエチレンでできており、ビニール手袋に油がしみ込みやすいためだ。その上、ビニール手袋の厚さが非常に薄いため、油が（　）ことがある。", "question_text_ja": null, "choices_ja": ["手に全く付かない", "チキンの味を落とす", "ビニールを柔らかくする", "手袋をより簡単に通り抜ける"]}, {"id": "96-31", "round": 96, "source": "제96회 읽기 31번", "number": 31, "instruction": "※ [28~31] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "상품의 종류와 유통 방식이 다양해지면서 물건을 고르는 것도 어려워졌다. 그러다 보니 선택에 들이는 시간을 줄이면서도 실패 없는 구매를 하려는 경향이 생겼다. 그중 하나가 유명인이 추천하는 물건을 고민 없이 따라 사는 것이다. 영향력 있는 인물이 ( ) 짧은 시간 안에 최선의 선택을 할 수 있을 것이라는 믿음이 이러한 소비에 반영된 것이다.", "question_text": null, "choices": ["직접 물건을 보내 주면", "높은 가격으로 판매하면", "선택한 것을 그대로 따르면", "상품을 생산하도록 도와주면"], "answer": 3, "grammar_point": null, "explanation": "有名人が薦めるものをそのまま買う消費行動の説明なので、③「선택한 것을 그대로 따르면(選んだものをそのまま従えば)」が文脈に合う。\n① 직접 물건을 보내 주면(直接品物を送ってくれれば): 有名人が物を送るという内容の言及はなく誤り。\n② 높은 가격으로 판매하면(高い価格で販売すれば): 価格についての言及はなく、また高価格が信頼につながるという論理も本文にないため誤り。\n③ 선택한 것을 그대로 따르면(選んだものをそのまま従えば): 有名人が薦めるものを「고민 없이 따라 사는(迷わず真似して買う)」という行動の説明と一致。正解。\n④ 상품을 생산하도록 도와주면(商品の生産を手伝ってくれれば): 生産への関与についての言及はなく誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [28~31] （　）に入る言葉として最も適切なものを選びなさい。(各2点)", "passage_ja": "商品の種類と流通方式が多様化するにつれ、品物を選ぶことも難しくなった。そのため選択にかける時間を減らしつつも失敗のない購入をしようとする傾向が生まれた。そのうちの一つが、有名人が薦める品物を迷わずそのまま買うことだ。影響力のある人物が（　）短い時間で最善の選択ができるはずだという信頼が、このような消費に反映されているのだ。", "question_text_ja": null, "choices_ja": ["直接品物を送ってくれれば", "高い価格で販売すれば", "選んだものをそのまま従えば", "商品を生産するのを手伝ってくれれば"]}, {"id": "96-32", "round": 96, "source": "제96회 읽기 32번", "number": 32, "instruction": "※ [32~34] 다음을 읽고 글의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "한 연구팀이 10년간 기린을 촬영하고 분석했다. 이 연구에서는 암컷 기린이 4~5세가 되면 몸 전체의 길이에서 목이 차지하는 비율이 이전보다 더 커지는 것을 발견했다. 기린이 임신으로 영양이 많이 필요한 나이에 더 높이 있는 나뭇잎까지 먹으려고 하면서 목이 길어지는 것이다. 연구팀은 이를 바탕으로 기린의 목 길이 변화가 먹이를 찾기 위해 노력하는 것과 밀접한 관계가 있다고 주장했다.", "question_text": null, "choices": ["연구팀은 올해부터 기린을 촬영하기 시작했다.", "암컷 기린은 4~5세부터 먹이를 먹는 양을 줄인다.", "암컷 기린은 임신을 하는 시기에 목이 더 길어진다.", "연구팀은 기린의 목 길이가 먹이와 관련이 없다고 보았다."], "answer": 3, "grammar_point": null, "explanation": "「임신으로 영양이 많이 필요한 나이에… 목이 길어지는 것이다」という記述から、③「妊娠する時期に首がさらに長くなる」が一致する。\n① 研究チームは10年間観察を行ったのであり、今年から撮影を始めたわけではないため誤り。\n② 4~5歳になると栄養が多く必要になり、より高い葉を食べようとする(食べる量を減らすのではない)ため誤り。\n③ 妊娠のため栄養が多く必要な時期に首が長くなるという記述と一致。正解。\n④ 研究チームは首の長さの変化がエサを求める努力と密接な関係があると主張しており、無関係だとは述べていないため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [32~34] 次を読んで文章の内容と一致するものを選びなさい。(各2点)", "passage_ja": "ある研究チームが10年間キリンを撮影し分析した。この研究では、メスのキリンが4〜5歳になると、体全体の長さに占める首の割合がそれ以前より大きくなることが分かった。キリンが妊娠によって多くの栄養が必要になる年齢に、より高い所にある葉まで食べようとすることで首が長くなるのだ。研究チームはこれを根拠に、キリンの首の長さの変化は餌を探す努力と密接な関係があると主張した。", "question_text_ja": null, "choices_ja": ["研究チームは今年からキリンの撮影を始めた。", "メスのキリンは4〜5歳から餌を食べる量を減らす。", "メスのキリンは妊娠する時期に首がさらに長くなる。", "研究チームはキリンの首の長さは餌と関係がないと考えた。"]}, {"id": "96-33", "round": 96, "source": "제96회 읽기 33번", "number": 33, "instruction": "※ [32~34] 다음을 읽고 글의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "19세기에는 위생에 대한 사람들의 인식이 높지 않았다. 그때 병원의 보건 위생 환경을 개선하는 데 기여한 사람이 바로 간호사였던 나이팅게일이다. 그는 매일 군 병원에서 사망 환자 수와 사망 원인을 기록하여 부상으로 죽는 병사보다 위생 문제로 감염되어 사망하는 병사가 더 많다는 것을 통계로 입증했다. 그리고 이 결과를 도표로 만들어 관계자들을 설득함으로써 의료 환경을 개선해 나갔다.", "question_text": null, "choices": ["나이팅게일은 통계 자료를 근거로 관계자들을 설득했다.", "나이팅게일은 부상으로 죽는 병사가 가장 많다는 것을 밝혀냈다.", "나이팅게일의 기록에는 병원 내 감염자 수가 포함되어 있지 않았다.", "나이팅게일이 일을 시작했을 당시에는 병원의 위생 관리가 철저했다."], "answer": 1, "grammar_point": null, "explanation": "「이 결과를 도표로 만들어 관계자들을 설득함으로써(この結果を図表にして関係者を説得することで)」という記述から、①「統計資料を根拠に関係者を説得した」が一致する。\n① 死亡者数の統計を図表化して関係者を説得したという記述と一致。正解。\n② 実際には負傷より衛生問題による感染で死亡する兵士の方が多かったと立証しており、負傷による死者が最多という内容は誤り。\n③ ナイチンゲールの記録には感染による死亡者数も含まれていたため誤り。\n④ ナイチンゲールが活動を始めた19世紀当時は衛生への意識が高くなかったとあるため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [32~34] 次を読んで文章の内容と一致するものを選びなさい。(各2点)", "passage_ja": "19世紀には衛生に対する人々の意識は高くなかった。そのころ、病院の保健衛生環境の改善に貢献したのが、看護師だったナイチンゲールである。彼女は毎日、軍病院で死亡患者数と死因を記録し、負傷で死ぬ兵士より衛生上の問題で感染して死亡する兵士の方が多いことを統計で立証した。そしてこの結果を図表にまとめ関係者を説得することで、医療環境を改善していった。", "question_text_ja": null, "choices_ja": ["ナイチンゲールは統計資料を根拠に関係者を説得した。", "ナイチンゲールは負傷で死ぬ兵士が最も多いことを明らかにした。", "ナイチンゲールの記録には院内感染者数が含まれていなかった。", "ナイチンゲールが仕事を始めた当時は病院の衛生管理が徹底されていた。"]}, {"id": "96-34", "round": 96, "source": "제96회 읽기 34번", "number": 34, "instruction": "※ [32~34] 다음을 읽고 글의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "스케이트의 날은 종목의 특성에 따라 차이가 있다. 쇼트 트랙은 스케이트의 날을 살짝 왼쪽으로 기울여서 고정시킨다. 코너를 도는 선수들이 몸을 왼쪽으로 기울여도 넘어지지 않게 한 것이다. 반면 피겨 스케이트는 날의 앞쪽을 큰 톱니 모양으로 만든다. 그래서 선수들이 공중으로 뛰어오를 때 날의 앞쪽을 사용해 빙판을 찍으면 더 높이 뛸 수 있다.", "question_text": null, "choices": ["쇼트 트랙은 스케이트의 날이 톱니 모양으로 되어 있다.", "피겨 선수들은 높이 뛰어오르기 위해 날의 앞부분을 사용한다.", "피겨에서는 선수가 넘어지지 않도록 스케이트의 날 앞쪽을 둥글게 했다.", "쇼트 트랙에서는 스케이트 날을 똑바로 달아 코너를 잘 돌 수 있게 했다."], "answer": 2, "grammar_point": null, "explanation": "「선수들이 공중으로 뛰어오를 때 날의 앞쪽을 사용해…더 높이 뛸 수 있다」という記述から、②「フィギュア選手は高く跳ぶために刃の前部分を使う」が一致する。\n① 刃の先端がのこぎり状(톱니 모양)なのはショートトラックではなくフィギュアスケートであるため誤り。\n② フィギュア選手が高く跳躍する際に刃の前部分を使うという記述と一致。正解。\n③ 刃の前部分を丸くしているという記述はなく、実際にはのこぎり状にしているため誤り(丸くするのは転倒防止とは無関係)。\n④ ショートトラックは刃をまっすぐではなく、わずかに左に傾けて固定しコーナーで転ばないようにしているため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [32~34] 次を読んで文章の内容と一致するものを選びなさい。(各2点)", "passage_ja": "スケートの刃は種目の特性によって違いがある。ショートトラックはスケートの刃をわずかに左へ傾けて固定する。コーナーを回る選手が体を左に傾けても転ばないようにするためだ。一方フィギュアスケートは刃の先端部を大きなギザギザ状にする。そのため選手が空中に跳び上がる際、刃の先端部を使って氷を突けば、より高く跳べる。", "question_text_ja": null, "choices_ja": ["ショートトラックはスケートの刃がギザギザ状になっている。", "フィギュア選手は高く跳び上がるために刃の先端部分を使う。", "フィギュアでは選手が転ばないようにスケートの刃の先端を丸くした。", "ショートトラックではスケートの刃をまっすぐ取り付け、コーナーをうまく回れるようにした。"]}, {"id": "96-35", "round": 96, "source": "제96회 읽기 35번", "number": 35, "instruction": "※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "메타세쿼이아는 위로 쭉쭉 뻗은 모양이 아름다워서 가로수로 선호된다. 그런데 메타세쿼이아를 심을 때는 장소에 유의해야 한다. 메타세쿼이아는 생장이 빠른 특성이 있어서 건물이 늘어선 도로에 심어서는 안 된다. 뿌리가 빠르게 자라 주변 건물의 벽을 갈라지게 하기 때문이다. 또 키가 크고 잎이 무성해서 건물의 채광을 가리는 등 피해를 주기도 한다.", "question_text": null, "choices": ["메타세쿼이아는 생장이 느려 가로수로 적절하지 않다.", "메타세쿼이아를 도로에 심으면 도시 경관을 개선할 수 있다.", "메타세쿼이아는 적합한 장소에 심지 않으면 문제가 될 수 있다.", "메타세쿼이아가 자라는 높이는 뿌리 내리는 장소에 따라 달라진다."], "answer": 3, "grammar_point": null, "explanation": "メタセコイアは適切な場所に植えないと問題(根が壁を割る、採光を遮る等)が起きるという内容全体から、③が主題として最も適切。\n① 생장이 느려 가로수로 적절하지 않다(成長が遅く街路樹に不向き): 本文は逆に「생장이 빠른(成長が速い)」特性が問題を招くと説明しており誤り。\n② 도로에 심으면 도시 경관을 개선할 수 있다(道路に植えれば景観改善): 本文はむしろ場所を選ばないと被害が出ると警告しており誤り。\n③ 적합한 장소에 심지 않으면 문제가 될 수 있다(適した場所に植えないと問題になりうる): 根が建物の壁を割ったり採光を遮ったりする被害の説明全体をまとめており主題として最も適切。正解。\n④ 자라는 높이가 뿌리 내리는 장소에 따라 달라진다(生育する高さが根を張る場所によって変わる): 高さの変化についての言及は本文になく誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [35~38] 次を読んで文章の主題として最も適切なものを選びなさい。(各2点)", "passage_ja": "メタセコイアはまっすぐ上に伸びる姿が美しいため、街路樹として好まれる。ところがメタセコイアを植える際には場所に注意しなければならない。メタセコイアは成長が速いという特性があり、建物が立ち並ぶ通りに植えてはいけない。根が速く伸びて周辺の建物の壁にひびを入れてしまうからだ。また背が高く葉が茂るため、建物の採光を遮るなどの被害を与えることもある。", "question_text_ja": null, "choices_ja": ["メタセコイアは成長が遅く街路樹に適さない。", "メタセコイアを通りに植えれば都市の景観を改善できる。", "メタセコイアは適した場所に植えないと問題になることがある。", "メタセコイアの育つ高さは根を張る場所によって変わる。"]}, {"id": "96-36", "round": 96, "source": "제96회 읽기 36번", "number": 36, "instruction": "※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "미세 먼지 문제를 해결하기 위한 인공 강우 실험이 활발히 이뤄지고 있다. 인공적으로 비를 내리게 해서 대기 중의 미세 먼지 수치를 낮춘다는 계획이다. 그러나 현재의 인공 강우 기술은 구름이 있는 지역에서만 활용할 수 있고 만들 수 있는 비의 양도 많지 않다. 이러한 점에서 인공 강우 기술은 미세 먼지 문제를 해결할 수 있는 근본적인 대책이라고 보기는 어렵다.", "question_text": null, "choices": ["인공 강우 기술이 상용화되도록 실험을 지속해야 한다.", "미세 먼지를 줄이기 위해서는 국가 간 협력이 필수적이다.", "미세 먼지 문제를 해결하기 위해서는 재정적인 지원이 중요하다.", "인공 강우 기술은 미세 먼지를 줄이는 해결책으로는 한계가 있다."], "answer": 4, "grammar_point": null, "explanation": "人工降雨技術には限界があり「근본적인 대책이라고 보기는 어렵다(根本的な対策とは言い難い)」という結論から、④が主題として最も適切。\n① 상용화되도록 실험을 지속해야 한다(実用化のため実験を続けるべき): 本文はむしろ技術の限界を指摘する内容であり、実験継続の主張はしていないため誤り。\n② 국가 간 협력이 필수적이다(国家間協力が必須): 国際協力についての言及は本文になく誤り。\n③ 재정적인 지원이 중요하다(財政的支援が重要): 財政支援についての言及は本文になく誤り。\n④ 인공 강우 기술은 미세 먼지를 줄이는 해결책으로는 한계가 있다(人工降雨技術は微細粉塵を減らす解決策としては限界がある): 「구름이 있는 지역에서만 활용 가능」「비의 양도 많지 않다」という限界の説明と「근본적인 대책이라고 보기는 어렵다」という結論をまとめており主題として最も適切。正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [35~38] 次を読んで文章の主題として最も適切なものを選びなさい。(各2点)", "passage_ja": "微小粒子状物質(PM)問題を解決するための人工降雨実験が盛んに行われている。人工的に雨を降らせて大気中の微小粒子状物質の数値を下げようという計画だ。しかし現在の人工降雨技術は雲のある地域でしか活用できず、作り出せる雨の量も多くない。この点で人工降雨技術は、微小粒子状物質問題を解決できる根本的な対策とは言い難い。", "question_text_ja": null, "choices_ja": ["人工降雨技術が実用化されるよう実験を続けるべきだ。", "微小粒子状物質を減らすためには国家間の協力が不可欠だ。", "微小粒子状物質問題を解決するためには財政的な支援が重要だ。", "人工降雨技術は微小粒子状物質を減らす解決策としては限界がある。"]}, {"id": "96-37", "round": 96, "source": "제96회 읽기 37번", "number": 37, "instruction": "※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "건강세는 설탕이나 가공 식품 등 건강에 해로운 식품에 부과하는 세금이다. 건강세를 걷으면 비만, 당뇨와 같은 질병을 유발하는 식품의 가격이 올라 소비가 억제된다. 이는 성인병 환자의 감소로 이어질 수 있다. 또한 걷은 세금으로 국민 건강 증진을 위한 재원을 확보하는 것도 기대할 수 있다. 물론 건강세가 소비자의 부담을 높인다는 비판도 있다. 하지만 건강세로 얻게 될 효과가 분명한 이상, 도입을 긍정적으로 검토해야 할 때다.", "question_text": null, "choices": ["건강세는 소비자의 부담을 최소화하는 선에서 부과되어야 한다.", "건강세를 도입하기 전에 국민의 의견을 파악하는 것이 중요하다.", "건강세는 국민의 건강 증진에 도움이 되므로 도입할 필요가 있다.", "건강세를 부과할 식품을 선정할 때는 명확한 기준이 있어야 한다."], "answer": 3, "grammar_point": null, "explanation": "健康税の効果を列挙した上で「도입을 긍정적으로 검토해야 할 때다(導入を前向きに検討すべき時だ)」と結ぶ文章なので、③が主題として最も適切。\n① 소비자의 부담을 최소화하는 선에서 부과되어야(消費者負担を最小化する線で課すべき): 負担軽減の条件についての主張は本文にないため誤り。\n② 도입 전에 국민 의견을 파악하는 것이 중요(導入前に国民の意見把握が重要): 世論調査についての言及は本文になく誤り。\n③ 건강세는 국민 건강 증진에 도움이 되므로 도입할 필요가 있다(健康税は国民の健康増進に役立つため導入する必要がある): 疾病減少・財源確保という効果を挙げた上で導入を前向きに検討すべきと結ぶ文章全体の主張と一致。正解。\n④ 부과할 식품 선정 시 명확한 기준이 필요(課税対象食品選定に明確な基準が必要): 選定基準についての言及は本文になく誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [35~38] 次を読んで文章の主題として最も適切なものを選びなさい。(各2点)", "passage_ja": "健康税は砂糖や加工食品など健康に有害な食品に課す税金である。健康税を徴収すれば、肥満や糖尿病といった病気を引き起こす食品の価格が上がり、消費が抑制される。これは成人病患者の減少につながりうる。また、集めた税金で国民の健康増進のための財源を確保することも期待できる。もちろん健康税が消費者の負担を高めるという批判もある。しかし健康税によって得られる効果が明らかである以上、導入を前向きに検討すべき時である。", "question_text_ja": null, "choices_ja": ["健康税は消費者の負担を最小限に抑える範囲で課されるべきだ。", "健康税を導入する前に国民の意見を把握することが重要だ。", "健康税は国民の健康増進に役立つため導入する必要がある。", "健康税を課す食品を選定する際には明確な基準が必要だ。"]}, {"id": "96-38", "round": 96, "source": "제96회 읽기 38번", "number": 38, "instruction": "※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "국회는 다양한 세대의 국회 의원들로 구성되어야 한다. 특히 청년 세대들은 새로운 기술이나 가치관을 빠르게 받아들여 사회 변화에 부합하는 정책을 제안할 수 있다. 또 취업 등 청년 정책에 적극적으로 목소리를 낼 수 있는 것도 청년 자신이다. 그런데 정치적 기반이 부족한 청년이 선거를 통해 국회에 진출하기란 쉽지 않다. 따라서 청년 국회 의원의 비율을 확보해 주는 등 청년들의 정치 활동을 보장할 필요가 있다.", "question_text": null, "choices": ["청년들이 국회에 활발하게 진출하도록 해야 한다.", "청년 세대의 문제에 대해 정치권의 관심이 필요하다.", "청년들이 제안하는 정책을 채택하는 비율을 높여야 한다.", "청년 정치인은 정치적 기반을 갖추기 위해 노력해야 한다."], "answer": 1, "grammar_point": null, "explanation": "青年議員の必要性を説き「청년들의 정치 활동을 보장할 필요가 있다(青年の政治活動を保障する必要がある)」と結ぶ文章なので、①が主題として最も適切。\n① 청년들이 국회에 활발하게 진출하도록 해야 한다(青年が国会に積極的に進出できるようにすべき): 政治的基盤が弱い青年の国会進出を保障すべきという文章全体の結論と一致。正解。\n② 청년 세대 문제에 정치권의 관심이 필요(青年世代の問題に政治界の関心が必要): 政治界の関心という一般論ではなく、本文はより具体的に青年議員自身の国会進出の保障を主張しているため、主題としてはややずれる。\n③ 청년들이 제안하는 정책 채택 비율을 높여야(青年が提案する政策の採択比率を高めるべき): 政策採択比率についての具体的な主張は本文になく誤り。\n④ 청년 정치인은 정치적 기반을 갖추기 위해 노력해야(青年政治家は政治的基盤を整えるため努力すべき): 本文はむしろ基盤が乏しい青年を制度的に支援すべきと主張しており、青年自身の努力を求める内容ではないため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [35~38] 次を読んで文章の主題として最も適切なものを選びなさい。(各2点)", "passage_ja": "国会は多様な世代の国会議員で構成されるべきである。特に青年世代は新しい技術や価値観を素早く受け入れ、社会の変化に即した政策を提案することができる。また、就職などの青年政策について積極的に声を上げられるのも青年自身である。しかし政治的基盤が乏しい青年が選挙を通じて国会に進出するのは容易ではない。したがって、青年国会議員の割合を確保するなど、青年の政治活動を保障する必要がある。", "question_text_ja": null, "choices_ja": ["青年が国会に活発に進出できるようにすべきだ。", "青年世代の問題について政界の関心が必要だ。", "青年が提案する政策を採用する割合を高めるべきだ。", "青年政治家は政治的基盤を整えるために努力すべきだ。"]}, {"id": "96-39", "round": 96, "source": "제96회 읽기 39번", "number": 39, "instruction": "※ [39~41] 주어진 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "고대 이집트에서는 물에 푼 섬유질을 틀에 올려 건조하는 방식으로 종이를 만들었다. ( ㉠ ) 이후 제지업자들이 틀에 고유의 문양을 새겨 자신만의 워터 마크를 남기기 시작했다. ( ㉡ ) 이것이 이어져 저작권을 표시하거나 위조를 막기 위해 문서나 지폐 등에 워터 마크를 넣게 되었다. ( ㉢ ) 지금도 이 워터 마크는 사진이나 영상 등의 저작권을 보호하는 용도로 널리 활용되고 있다. ( ㉣ )", "question_text": "섬유질이 마르는 과정에서 자연스레 틀의 자국이 남았는데, 이를 워터 마크라고 불렀다.", "choices": ["㉠", "㉡", "㉢", "㉣"], "answer": 1, "grammar_point": null, "explanation": "挿入文「섬유질이 마르는 과정에서 자연스레 틀의 자국이 남았는데, 이를 워터 마크라고 불렀다(繊維が乾く過程で自然に型の跡が残り、これをウォーターマークと呼んだ)」は、古代エジプトの製紙法の説明(㉠の直前)の直後に置くと、その後の「이후 제지업자들이…자신만의 워터 마크를 남기기 시작했다(以後、業者が独自の文様を刻み始めた)」という文へ自然につながる。①が正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [39~41] 与えられた文が入る位置として最も適切なものを選びなさい。(各2点)", "passage_ja": "古代エジプトでは、水に溶いた繊維質を型に載せて乾燥させる方法で紙を作った。（㉠）その後、製紙業者たちが型に独自の文様を刻み、自分だけのウォーターマークを残し始めた。（㉡）これが受け継がれ、著作権を表示したり偽造を防いだりするために文書や紙幣などにウォーターマークを入れるようになった。（㉢）今でもこのウォーターマークは、写真や映像などの著作権を保護する用途として広く活用されている。（㉣）", "question_text_ja": "繊維質が乾く過程で自然に型の跡が残り、これをウォーターマークと呼んだ。", "choices_ja": ["㉠", "㉡", "㉢", "㉣"]}, {"id": "96-40", "round": 96, "source": "제96회 읽기 40번", "number": 40, "instruction": "※ [39~41] 주어진 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "콘크리트를 만들기 위해서는 모래나 자갈 같은 골재가 필요하다. ( ㉠ ) 천연 모래와 자갈이 풍부한 바다에서는 질 좋은 골재를 쉽게 얻을 수 있다. ( ㉡ ) 그러다 보니 과다한 골재 채취로 바닷속 지형이 바뀌는 경우가 많다. ( ㉢ ) 이에 채취량을 제한하고 해당 구역의 복구를 의무화하는 등의 규제를 엄격히 시행하여 해양 생태계를 보호하려는 노력이 이어지고 있다. ( ㉣ )", "question_text": "해양 생물이 서식하던 바닷속 모래 언덕이나 골짜기가 파괴되는 것이다.", "choices": ["㉠", "㉡", "㉢", "㉣"], "answer": 3, "grammar_point": null, "explanation": "挿入文「해양 생물이 서식하던 바닷속 모래 언덕이나 골짜기가 파괴되는 것이다(海洋生物が生息していた海底の砂丘や谷が破壊されるということだ)」は、骨材採取で海底地形が変わるという文(㉢の直前)の直後に置くと、その後の「이에…해양 생태계를 보호하려는 노력」という規制の話へ自然につながる。③が正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [39~41] 与えられた文が入る位置として最も適切なものを選びなさい。(各2点)", "passage_ja": "コンクリートを作るためには砂や砂利のような骨材が必要だ。（㉠）天然の砂や砂利が豊富な海では、質の良い骨材を容易に得ることができる。（㉡）そのため、過剰な骨材採取によって海底の地形が変わることが多い。（㉢）これを受け、採取量を制限し該当区域の復旧を義務化するなどの規制を厳格に実施し、海洋生態系を保護しようとする努力が続けられている。（㉣）", "question_text_ja": "海洋生物が生息していた海底の砂丘や谷が破壊されるのだ。", "choices_ja": ["㉠", "㉡", "㉢", "㉣"]}, {"id": "96-41", "round": 96, "source": "제96회 읽기 41번", "number": 41, "instruction": "※ [39~41] 주어진 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "수많은 독자의 사랑을 받아 온 소설 『이상한 편의점』이 해외에서도 호평받고 있다. ( ㉠ ) 이 책은 우연한 기회로 한 편의점에서 일하게 된 노숙자 상철과 편의점을 찾은 손님들의 일화를 담고 있다. ( ㉡ ) 이 책이 한국을 넘어 해외 독자들의 마음까지 울리는 이유가 바로 이 따뜻함에 있다. ( ㉢ ) 지친 삶에 응원이 필요한 모든 이에게 이 책을 권한다. ( ㉣ )", "question_text": "상철은 저마다의 사연을 안고 편의점을 찾은 손님들에게 따스한 위로를 건넨다.", "choices": ["㉠", "㉡", "㉢", "㉣"], "answer": 2, "grammar_point": null, "explanation": "挿入文「상철은 저마다의 사연을 안고 편의점을 찾은 손님들에게 따스한 위로를 건넨다(相哲はそれぞれの事情を抱えてコンビニを訪れる客に温かい慰めを与える)」は、本の紹介(㉡の直前)の直後に置くと、その後の「이 책이…해외 독자들의 마음까지 울리는 이유가 바로 이 따뜻함에 있다(この本が海外読者の心まで打つ理由はまさにこの温かさにある)」という文へ自然につながる。②が正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [39~41] 与えられた文が入る位置として最も適切なものを選びなさい。(各2点)", "passage_ja": "数多くの読者に愛されてきた小説『ふしぎなコンビニ』が海外でも好評を博している。（㉠）この本は、ひょんなきっかけであるコンビニで働くことになったホームレスのサンチョルと、コンビニを訪れる客たちのエピソードを収めている。（㉡）この本が韓国を越えて海外の読者の心まで揺さぶる理由は、まさにこの温かさにある。（㉢）疲れた日々に応援が必要なすべての人にこの本をお薦めする。（㉣）", "question_text_ja": "サンチョルは、それぞれの事情を抱えてコンビニを訪れる客たちに温かい慰めを差し伸べる。", "choices_ja": ["㉠", "㉡", "㉢", "㉣"]}, {"id": "96-44", "round": 96, "source": "제96회 읽기 44번", "number": 44, "instruction": "※ [44~45] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "44-45", "passage": "그라피티는 길거리 여기저기 벽면에 낙서처럼 그리거나 스프레이 페인트를 뿌려서 그리는 그림을 말한다. 지하철, 공공장소의 벽면 등에 주로 그려진 그라피티는 사회 비판적인 메시지를 표현하는 경우가 많았다. 권력에 대한 ( ) 소수와 약자의 목소리를 담은 것이다. 이 때문에 그라피티는 주류 문화에서 벗어나 있는 것으로 여겨졌다. 그러나 오늘날 그라피티는 더 이상 변방의 문화에 머물러 있지 않다. 친숙함을 무기로 일상생활 속에 스며들어 그라피티에 대한 사람들의 인식을 바꾸어 놓았기 때문이다. 이에 사람들은 그간 폄하당해 왔던 그라피티의 예술적 가치에도 주목하기 시작했다. 이제 그라피티는 척박한 도시 환경을 다채롭게 장식하며 삶에 예술적 요소를 더하는 것으로 현대 미술에서 제자리를 확고히 하고 있다.", "question_text": "( )에 들어갈 말로 가장 알맞은 것을 고르십시오.", "choices": ["불신을 없애며", "저항 정신을 드러내며", "태도를 수동적으로 취하며", "우호적 반응을 이끌어 내며"], "answer": 2, "grammar_point": null, "explanation": "グラフィティは社会批判的なメッセージを込めていたという文脈から、②「저항 정신을 드러내며(抵抗精神を表しながら)」が正解。\n① 불신을 없애며(不信をなくしながら): 権力への不信をなくすのではなく、むしろ批判的なメッセージを表現する行為であり文脈に合わない。\n② 저항 정신을 드러내며(抵抗精神を表しながら): 権力に対する社会批判的なメッセージという直前の説明と一致。正解。\n③ 태도를 수동적으로 취하며(態度を受動的に取りながら): グラフィティは少数者・弱者が声を上げる能動的な表現行為であり、受動的とは正反対のため誤り。\n④ 우호적 반응을 이끌어 내며(友好的な反応を引き出しながら): 権力からの友好的な反応を得るためではなく、批判の声を表すためのものであり文脈に合わない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [44~45] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "グラフィティとは、街のあちこちの壁面に落書きのように描いたり、スプレー塗料を吹き付けて描いたりする絵のことをいう。地下鉄や公共の場の壁面などに主に描かれるグラフィティは、社会批判的なメッセージを表現する場合が多かった。権力に対する（　）少数者や弱者の声を込めたものである。このためグラフィティは主流文化から外れたものとみなされてきた。しかし今日、グラフィティはもはや周縁の文化にとどまってはいない。親しみやすさを武器に日常生活の中に浸透し、グラフィティに対する人々の認識を変えてしまったからだ。これにより人々は、これまで低く評価されてきたグラフィティの芸術的価値にも注目し始めた。今やグラフィティは、荒涼とした都市環境を多彩に彩り、生活に芸術的な要素を加えるものとして、現代美術における確固たる地位を築いている。", "question_text_ja": "（　）に入る言葉として最も適切なものを選びなさい。", "choices_ja": ["不信をなくしながら", "抵抗精神を表しながら", "受動的な態度を取りながら", "友好的な反応を引き出しながら"]}, {"id": "96-45", "round": 96, "source": "제96회 읽기 45번", "number": 45, "instruction": "※ [44~45] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "44-45", "passage": "그라피티는 길거리 여기저기 벽면에 낙서처럼 그리거나 스프레이 페인트를 뿌려서 그리는 그림을 말한다. 지하철, 공공장소의 벽면 등에 주로 그려진 그라피티는 사회 비판적인 메시지를 표현하는 경우가 많았다. 권력에 대한 ( ) 소수와 약자의 목소리를 담은 것이다. 이 때문에 그라피티는 주류 문화에서 벗어나 있는 것으로 여겨졌다. 그러나 오늘날 그라피티는 더 이상 변방의 문화에 머물러 있지 않다. 친숙함을 무기로 일상생활 속에 스며들어 그라피티에 대한 사람들의 인식을 바꾸어 놓았기 때문이다. 이에 사람들은 그간 폄하당해 왔던 그라피티의 예술적 가치에도 주목하기 시작했다. 이제 그라피티는 척박한 도시 환경을 다채롭게 장식하며 삶에 예술적 요소를 더하는 것으로 현대 미술에서 제자리를 확고히 하고 있다.", "question_text": "윗글의 주제로 가장 알맞은 것을 고르십시오.", "choices": ["그라피티는 도시 환경을 훼손하는 문제점을 가지고 있다.", "그라피티는 길거리 낙서로서의 한계를 뛰어넘지 못하고 있다.", "과거의 그라피티는 주류 문화의 중심에서 대중의 사랑을 받았다.", "오늘날의 그라피티는 과거와 달리 예술적 가치를 인정받고 있다."], "answer": 4, "grammar_point": null, "explanation": "文章全体は「かつて周縁文化とされたグラフィティが、今日では芸術的価値を認められている」という内容なので、④が主題として最も適切。\n① 도시 환경을 훼손하는 문제점을 가지고 있다(都市環境を損なう問題点がある): 本文はむしろ「척박한 도시 환경을 다채롭게 장식(荒れた都市環境を彩る)」とプラスに評価しており誤り。\n② 길거리 낙서로서의 한계를 뛰어넘지 못하고 있다(路上落書きとしての限界を超えられていない): 本文は「주류 문화에서 벗어나 있는 것으로 여겨졌다」が「오늘날은…현대 미술에서 제자리를 확고히」と変化を述べており、限界を超えられていないという内容とは逆のため誤り。\n③ 과거의 그라피티는 주류 문화의 중심에서 대중의 사랑을 받았다(過去のグラフィティは主流文化の中心で大衆の愛を受けた): 過去は「주류 문화에서 벗어나 있는 것으로 여겨졌다(主流文化から外れたものとされた)」とあり、正反対のため誤り。\n④ 오늘날의 그라피티는 과거와 달리 예술적 가치를 인정받고 있다(今日のグラフィティは過去と違い芸術的価値を認められている): 周縁文化とされていたグラフィティが現代美術で地位を確立したという文章全体の流れと一致。正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [44~45] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "グラフィティとは、街のあちこちの壁面に落書きのように描いたり、スプレー塗料を吹き付けて描いたりする絵のことをいう。地下鉄や公共の場の壁面などに主に描かれるグラフィティは、社会批判的なメッセージを表現する場合が多かった。権力に対する（　）少数者や弱者の声を込めたものである。このためグラフィティは主流文化から外れたものとみなされてきた。しかし今日、グラフィティはもはや周縁の文化にとどまってはいない。親しみやすさを武器に日常生活の中に浸透し、グラフィティに対する人々の認識を変えてしまったからだ。これにより人々は、これまで低く評価されてきたグラフィティの芸術的価値にも注目し始めた。今やグラフィティは、荒涼とした都市環境を多彩に彩り、生活に芸術的な要素を加えるものとして、現代美術における確固たる地位を築いている。", "question_text_ja": "上の文章の主題として最も適切なものを選びなさい。", "choices_ja": ["グラフィティは都市環境を損なうという問題点を持っている。", "グラフィティは街の落書きとしての限界を超えられずにいる。", "過去のグラフィティは主流文化の中心で大衆の愛を受けていた。", "今日のグラフィティは過去とは異なり芸術的価値を認められている。"]}, {"id": "96-46", "round": 96, "source": "제96회 읽기 46번", "number": 46, "instruction": "※ [46~47] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "46-47", "passage": "현행 문화재 보호법에서는 역사적, 예술적으로 가치가 높은 음악, 무용, 공예 기능 등을 국가 무형 문화재로 규정하고 있다. 이에 따라 여러 세대에 걸쳐 전승되어 온 무형의 문화유산 중 원형 그대로 계승될 만한 가치가 있는 것을 국가 무형 문화재로 지정한다. 이 무형 문화재는 형체가 없으므로 기능을 보유한 사람을 인간문화재로 지정해 이들을 통해 문화재가 보존되도록 한다. 그런데 이 무형 문화재를 전수받으려는 사람이 줄고 있어 문화재 보존에 비상등이 켜졌다. 오랜 시간 어렵게 기능을 전수받더라도 무조건 인간문화재로 지정되는 것도 아니고 기능을 연마하는 동안에는 국가의 경제적 지원도 없기 때문이다. 전통문화는 그 민족의 자긍심과도 밀접하게 관련되어 있는 것인데 이렇게 가다가는 무형 문화재의 명맥이 끊이는 일이 생길 수 있을 것이다.", "question_text": "윗글에 나타난 필자의 태도로 가장 알맞은 것을 고르십시오.", "choices": ["인간문화재가 앞으로 더 많이 배출될 것을 기대하고 있다.", "국가 무형 문화재의 전수가 단절되어 가는 것을 우려하고 있다.", "인간문화재가 되기 위해 노력하는 사람의 자세에 감탄하고 있다.", "국가 무형 문화재의 선정 절차를 투명하게 할 것을 요구하고 있다."], "answer": 2, "grammar_point": null, "explanation": "無形文化財の伝承者が減っていることを「비상등이 켜졌다(危険信号が灯った)」と表現し、経済支援の欠如を指摘していることから、②「伝承が途絶えつつあることを憂慮している」が筆者の態度として最も適切。\n① 인간문화재가 앞으로 더 많이 배출될 것을 기대(人間文化財が今後より多く輩出されることを期待): 本文はむしろ伝承者が減っていることへの懸念を述べており、期待とは逆の論調のため誤り。\n② 국가 무형 문화재의 전수가 단절되어 가는 것을 우려(国家無形文化財の伝承が途絶えつつあることを憂慮): 「비상등이 켜졌다」「명맥이 끊이는 일이 생길 수 있다」という警告的な表現と一致。正解。\n③ 인간문화재가 되기 위해 노력하는 사람의 자세에 감탄(人間文化財になるため努力する人の姿勢に感嘆): 感嘆や賞賛の表現ではなく、制度上の問題点を指摘する批判的な論調であるため誤り。\n④ 국가 무형 문화재의 선정 절차를 투명하게 할 것을 요구(選定手続きの透明化を要求): 手続きの透明性についての言及は本文になく誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [46~47] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "現行の文化財保護法では、歴史的、芸術的に価値の高い音楽、舞踊、工芸技能などを国家無形文化財として規定している。これに従い、幾世代にもわたって伝承されてきた無形の文化遺産のうち、原形のまま継承される価値があるものを国家無形文化財に指定する。この無形文化財は形がないため、その技能を保有する人を人間文化財に指定し、彼らを通じて文化財が保存されるようにしている。ところが、この無形文化財を伝授されようとする人が減っており、文化財保存に警報が灯った。長い時間をかけて苦労して技能を伝授されても必ずしも人間文化財に指定されるわけではなく、技能を磨く間は国からの経済的支援もないためだ。伝統文化はその民族の誇りとも密接に関わっているものであるが、このままでは無形文化財の命脈が絶たれる事態が生じかねない。", "question_text_ja": "上の文章に表れた筆者の態度として最も適切なものを選びなさい。", "choices_ja": ["人間文化財が今後さらに多く輩出されることを期待している。", "国家無形文化財の伝授が途絶えつつあることを憂慮している。", "人間文化財になろうと努力する人の姿勢に感嘆している。", "国家無形文化財の選定手続きを透明にすることを求めている。"]}, {"id": "96-47", "round": 96, "source": "제96회 읽기 47번", "number": 47, "instruction": "※ [46~47] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "46-47", "passage": "현행 문화재 보호법에서는 역사적, 예술적으로 가치가 높은 음악, 무용, 공예 기능 등을 국가 무형 문화재로 규정하고 있다. 이에 따라 여러 세대에 걸쳐 전승되어 온 무형의 문화유산 중 원형 그대로 계승될 만한 가치가 있는 것을 국가 무형 문화재로 지정한다. 이 무형 문화재는 형체가 없으므로 기능을 보유한 사람을 인간문화재로 지정해 이들을 통해 문화재가 보존되도록 한다. 그런데 이 무형 문화재를 전수받으려는 사람이 줄고 있어 문화재 보존에 비상등이 켜졌다. 오랜 시간 어렵게 기능을 전수받더라도 무조건 인간문화재로 지정되는 것도 아니고 기능을 연마하는 동안에는 국가의 경제적 지원도 없기 때문이다. 전통문화는 그 민족의 자긍심과도 밀접하게 관련되어 있는 것인데 이렇게 가다가는 무형 문화재의 명맥이 끊이는 일이 생길 수 있을 것이다.", "question_text": "윗글의 내용과 같은 것을 고르십시오.", "choices": ["국가 무형 문화재에 대한 법적 근거가 존재하지 않는다.", "국가 무형 문화재는 그 기능을 보유한 인간문화재를 통해 전수된다.", "국가 무형 문화재 기능을 전수받는 동안 경제적 지원을 받을 수 있다.", "국가 무형 문화재로 인정받으려면 원형을 시대에 맞게 변형해야 한다."], "answer": 2, "grammar_point": null, "explanation": "「기능을 보유한 사람을 인간문화재로 지정해 이들을 통해 문화재가 보존되도록 한다」という記述から、②が一致する。\n① 現行の文化財保護法で国家無形文化財を規定しているため、法的根拠がないという内容は誤り。\n② 技能保有者を人間文化財に指定し、その人を通じて文化財を保存するという記述と一致。正解。\n③ 技能を磨く間は国の経済的支援がないと明記されているため誤り。\n④ 原形のまま継承する価値があるものを指定するのであり、時代に合わせて変形するとは述べられていないため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [46~47] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "現行の文化財保護法では、歴史的、芸術的に価値の高い音楽、舞踊、工芸技能などを国家無形文化財として規定している。これに従い、幾世代にもわたって伝承されてきた無形の文化遺産のうち、原形のまま継承される価値があるものを国家無形文化財に指定する。この無形文化財は形がないため、その技能を保有する人を人間文化財に指定し、彼らを通じて文化財が保存されるようにしている。ところが、この無形文化財を伝授されようとする人が減っており、文化財保存に警報が灯った。長い時間をかけて苦労して技能を伝授されても必ずしも人間文化財に指定されるわけではなく、技能を磨く間は国からの経済的支援もないためだ。伝統文化はその民族の誇りとも密接に関わっているものであるが、このままでは無形文化財の命脈が絶たれる事態が生じかねない。", "question_text_ja": "上の文章の内容と一致するものを選びなさい。", "choices_ja": ["国家無形文化財に関する法的根拠は存在しない。", "国家無形文化財は、その技能を保有する人間文化財を通じて伝授される。", "国家無形文化財の技能を伝授される間、経済的支援を受けられる。", "国家無形文化財として認められるためには原形を時代に合わせて変形しなければならない。"]}, {"id": "96-48", "round": 96, "source": "제96회 읽기 48번", "number": 48, "instruction": "※ [48~50] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "48-50", "passage": "도심의 교통 혼잡 문제가 심화되면서 새로운 건축물을 짓는 경우 사전에 교통 영향 평가를 받도록 하고 있다. 해당 건축물이 주변 교통 상황에 미칠 부정적 파급 효과를 예측해 이를 완화할 수 있는 방법을 미리 찾는 것이다. 이 평가 결과를 반영해 건축물과 지하철, 버스 등 대중교통 수단의 연계성을 높여 대중교통 이용을 유도함으로써 ( ) 것이 대표적인 사례이다. 또한 교통 혼잡을 유발하는 시설의 소유자에게 교통 유발 부담금을 부과하는 제도도 시행하고 있다. 그러나 이와 같은 방법만으로는 그 효과가 제한적이라는 평가가 대부분이다. 유입 인구의 증가로 인해 발생하는 교통 정체를 막는 데는 한계가 있다는 것이다. 따라서 보다 전방위적으로 여러 정책을 시행함으로써 도심 교통 문제 해결에 나설 필요가 있다. 문제 해결을 위한 실질적인 노력을 하는 시설의 소유자에게 여러 혜택을 주고 도심의 도로망을 정비하는 등의 여러 방안을 병행한다면 도심의 교통 환경을 점차 개선해 나갈 수 있을 것이다.", "question_text": "윗글을 쓴 목적으로 가장 알맞은 것을 고르십시오.", "choices": ["교통 영향 평가의 부정적 효과를 강조하기 위해서", "교통 유발 부담금 제도를 도입한 취지를 알리기 위해서", "교통 문제 해결을 위한 방안의 다각화를 주장하기 위해서", "교통 상황을 개선한 경우 받게 되는 혜택을 소개하기 위해서"], "answer": 3, "grammar_point": null, "explanation": "交通影響評価だけでは効果が限定的だとした上で「보다 전방위적으로 여러 정책을 시행함으로써(より全方位的に複数の政策を実施することで)」と結んでいるため、③が文章の目的として最も適切。\n① 교통 영향 평가의 부정적 효과를 강조(交通影響評価の否定的効果を強調): 交通影響評価そのものを否定する内容ではなく、単独では限界があると指摘しているだけのため誤り。\n② 교통 유발 부담금 제도를 도입한 취지를 알리기(交通誘発負担金制度導入の趣旨を伝える): 부담금 제도は既存の対策の一例として言及されているだけで、この制度の趣旨説明が文章の主目的ではないため誤り。\n③ 교통 문제 해결을 위한 방안의 다각화를 주장(交通問題解決のための方案の多角化を主張): 既存対策の限界を指摘した上で、より多様な政策を並行すべきと結論づける文章全体の目的と一致。正解。\n④ 교통 상황을 개선한 경우 받게 되는 혜택을 소개(交通状況を改善した場合に受けられる恩恵を紹介): 恩恵の付与は今後の提案の一部として触れられているにすぎず、文章全体の目的ではないため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [48~50] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "都心の交通混雑問題が深刻化するなか、新たな建築物を建てる場合には事前に交通影響評価を受けるようにしている。当該建築物が周辺の交通状況に及ぼす負の波及効果を予測し、これを緩和できる方法をあらかじめ見つけるのだ。この評価結果を反映し、建築物と地下鉄、バスなど公共交通機関との連携性を高めて公共交通の利用を促すことで（　）ことが代表的な事例である。また交通混雑を引き起こす施設の所有者に交通誘発負担金を課す制度も実施されている。しかしこのような方法だけではその効果は限定的だという評価がほとんどだ。流入人口の増加によって生じる交通渋滞を防ぐには限界があるということだ。したがって、より全方位的に複数の政策を実施することで都心の交通問題解決に取り組む必要がある。問題解決のために実質的な努力をする施設の所有者に様々な恩恵を与え、都心の道路網を整備するなど複数の方策を並行して行えば、都心の交通環境を徐々に改善していくことができるだろう。", "question_text_ja": "上の文章を書いた目的として最も適切なものを選びなさい。", "choices_ja": ["交通影響評価の否定的な効果を強調するため", "交通誘発負担金制度を導入した趣旨を知らせるため", "交通問題解決のための方策の多角化を主張するため", "交通状況を改善した場合に受けられる恩恵を紹介するため"]}, {"id": "96-49", "round": 96, "source": "제96회 읽기 49번", "number": 49, "instruction": "※ [48~50] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "48-50", "passage": "도심의 교통 혼잡 문제가 심화되면서 새로운 건축물을 짓는 경우 사전에 교통 영향 평가를 받도록 하고 있다. 해당 건축물이 주변 교통 상황에 미칠 부정적 파급 효과를 예측해 이를 완화할 수 있는 방법을 미리 찾는 것이다. 이 평가 결과를 반영해 건축물과 지하철, 버스 등 대중교통 수단의 연계성을 높여 대중교통 이용을 유도함으로써 ( ) 것이 대표적인 사례이다. 또한 교통 혼잡을 유발하는 시설의 소유자에게 교통 유발 부담금을 부과하는 제도도 시행하고 있다. 그러나 이와 같은 방법만으로는 그 효과가 제한적이라는 평가가 대부분이다. 유입 인구의 증가로 인해 발생하는 교통 정체를 막는 데는 한계가 있다는 것이다. 따라서 보다 전방위적으로 여러 정책을 시행함으로써 도심 교통 문제 해결에 나설 필요가 있다. 문제 해결을 위한 실질적인 노력을 하는 시설의 소유자에게 여러 혜택을 주고 도심의 도로망을 정비하는 등의 여러 방안을 병행한다면 도심의 교통 환경을 점차 개선해 나갈 수 있을 것이다.", "question_text": "( )에 들어갈 말로 가장 알맞은 것을 고르십시오.", "choices": ["건축 기간이 연장된", "교통 정체가 유발된", "주차장 규모를 확대한", "주변 교통량을 감축한"], "answer": 4, "grammar_point": null, "explanation": "「대중교통 이용을 유도함으로써( )것이 대표적인 사례이다(公共交通機関の利用を誘導することで( )ことが代表的な事例だ)」という文脈から、④「周辺の交通量を削減する」が正解。\n① 건축 기간이 연장된(建築期間が延長された): 建築期間についての言及はなく文脈に合わない。\n② 교통 정체가 유발된(交通渋滞が誘発された): 交通影響評価は渋滞を緩和するための制度であり、渋滞を誘発するという内容は本文の趣旨と正反対のため誤り。\n③ 주차장 규모를 확대한(駐車場規模を拡大した): 駐車場拡大についての言及はなく、むしろ公共交通利用を促す趣旨のため文脈に合わない。\n④ 주변 교통량을 감축한(周辺交通量を削減した): 公共交通機関の利用を誘導して周辺の交通量を減らすという、交通影響評価の目的と一致。正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [48~50] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "都心の交通混雑問題が深刻化するなか、新たな建築物を建てる場合には事前に交通影響評価を受けるようにしている。当該建築物が周辺の交通状況に及ぼす負の波及効果を予測し、これを緩和できる方法をあらかじめ見つけるのだ。この評価結果を反映し、建築物と地下鉄、バスなど公共交通機関との連携性を高めて公共交通の利用を促すことで（　）ことが代表的な事例である。また交通混雑を引き起こす施設の所有者に交通誘発負担金を課す制度も実施されている。しかしこのような方法だけではその効果は限定的だという評価がほとんどだ。流入人口の増加によって生じる交通渋滞を防ぐには限界があるということだ。したがって、より全方位的に複数の政策を実施することで都心の交通問題解決に取り組む必要がある。問題解決のために実質的な努力をする施設の所有者に様々な恩恵を与え、都心の道路網を整備するなど複数の方策を並行して行えば、都心の交通環境を徐々に改善していくことができるだろう。", "question_text_ja": "（　）に入る言葉として最も適切なものを選びなさい。", "choices_ja": ["建築期間が延長された", "交通渋滞が引き起こされた", "駐車場の規模を拡大した", "周辺の交通量を削減した"]}, {"id": "96-50", "round": 96, "source": "제96회 읽기 50번", "number": 50, "instruction": "※ [48~50] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "48-50", "passage": "도심의 교통 혼잡 문제가 심화되면서 새로운 건축물을 짓는 경우 사전에 교통 영향 평가를 받도록 하고 있다. 해당 건축물이 주변 교통 상황에 미칠 부정적 파급 효과를 예측해 이를 완화할 수 있는 방법을 미리 찾는 것이다. 이 평가 결과를 반영해 건축물과 지하철, 버스 등 대중교통 수단의 연계성을 높여 대중교통 이용을 유도함으로써 ( ) 것이 대표적인 사례이다. 또한 교통 혼잡을 유발하는 시설의 소유자에게 교통 유발 부담금을 부과하는 제도도 시행하고 있다. 그러나 이와 같은 방법만으로는 그 효과가 제한적이라는 평가가 대부분이다. 유입 인구의 증가로 인해 발생하는 교통 정체를 막는 데는 한계가 있다는 것이다. 따라서 보다 전방위적으로 여러 정책을 시행함으로써 도심 교통 문제 해결에 나설 필요가 있다. 문제 해결을 위한 실질적인 노력을 하는 시설의 소유자에게 여러 혜택을 주고 도심의 도로망을 정비하는 등의 여러 방안을 병행한다면 도심의 교통 환경을 점차 개선해 나갈 수 있을 것이다.", "question_text": "윗글의 내용과 같은 것을 고르십시오.", "choices": ["교통 영향 평가는 도심에 건축물을 짓고 난 후에 시행한다.", "교통 영향 평가는 도심에 유입되는 인구를 늘리기 위해 실시한다.", "교통 혼잡 해결을 위해 노력하는 건축물의 소유자는 혜택을 받고 있다.", "교통 혼잡을 일으키는 시설의 소유자는 그에 따른 부담금을 내야 한다."], "answer": 4, "grammar_point": null, "explanation": "「교통 혼잡을 유발하는 시설의 소유자에게 교통 유발 부담금을 부과하는 제도도 시행하고 있다」という記述から、④が一致する。\n① 교통 영향 평가は建築物を建てる前(사전)に受けるものであり、建てた後に実施するのではないため誤り。\n② 교통 영향 평가は流入人口を増やすためではなく、周辺交通への悪影響を予測し緩和するために実施するため誤り。\n③ 努力する施設所有者への恩恵付与は「今後実施すべき提案」として述べられており、すでに恩恵を受けているとは述べられていないため誤り。\n④ 交通渋滞を誘発する施設の所有者には교통 유발 부담금(交通誘発負担金)を課す制度がすでに施行されているという記述と一致。正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [48~50] 次を読んで質問に答えなさい。(各2点)", "passage_ja": "都心の交通混雑問題が深刻化するなか、新たな建築物を建てる場合には事前に交通影響評価を受けるようにしている。当該建築物が周辺の交通状況に及ぼす負の波及効果を予測し、これを緩和できる方法をあらかじめ見つけるのだ。この評価結果を反映し、建築物と地下鉄、バスなど公共交通機関との連携性を高めて公共交通の利用を促すことで（　）ことが代表的な事例である。また交通混雑を引き起こす施設の所有者に交通誘発負担金を課す制度も実施されている。しかしこのような方法だけではその効果は限定的だという評価がほとんどだ。流入人口の増加によって生じる交通渋滞を防ぐには限界があるということだ。したがって、より全方位的に複数の政策を実施することで都心の交通問題解決に取り組む必要がある。問題解決のために実質的な努力をする施設の所有者に様々な恩恵を与え、都心の道路網を整備するなど複数の方策を並行して行えば、都心の交通環境を徐々に改善していくことができるだろう。", "question_text_ja": "上の文章の内容と一致するものを選びなさい。", "choices_ja": ["交通影響評価は都心に建築物を建てた後に実施する。", "交通影響評価は都心に流入する人口を増やすために実施する。", "交通混雑の解決に努める建築物の所有者は恩恵を受けている。", "交通混雑を引き起こす施設の所有者はそれに応じた負担金を納めなければならない。"]}, {"id": "91-1", "round": 91, "source": "제91회 읽기 1번", "number": 1, "instruction": "※ [1~2] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": null, "question_text": "나는 오래전에 설악산을 ( ).", "choices": ["등산하고 싶다", "등산해도 된다", "등산할 것 같다", "등산한 적이 있다"], "answer": 4, "grammar_point": "-(으)ㄴ 적이 있다 (〜したことがある)", "explanation": "「오래전에(ずっと前に)」という過去の一回の経験を述べる文脈。\n① -고 싶다: 〜したい(希望)。過去の経験ではなく現在の願望を表すので合わない。\n② -아/어도 되다: 〜してもよい(許可)。許可を表す表現で文脈に合わない。\n③ -(으)ㄹ 것 같다: 〜しそうだ(推測)。未来や現在の推測を表し、過去の事実には使わない。\n④ -(으)ㄴ 적이 있다: 〜したことがある(経験)。過去の経験を表す文法で正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [1~2] （　）に入る最も適切な言葉を選びなさい。（各2点）", "passage_ja": null, "question_text_ja": "私はずっと前にソラク山に（　）。", "choices_ja": ["登りたい", "登ってもいい", "登るだろう", "登ったことがある"]}, {"id": "91-2", "round": 91, "source": "제91회 읽기 2번", "number": 2, "instruction": "※ [1~2] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": null, "question_text": "새집으로 ( ) 가구를 새로 샀다.", "choices": ["이사한 지", "이사하거든", "이사하려면", "이사하고 나서"], "answer": 4, "grammar_point": "-고 나서 (〜してから)", "explanation": "「새집으로…가구를 새로 샀다」という動作の順序を表す文脈。\n① -(으)ㄴ 지: 〜してから(経過時間)。後ろに「〇年になる」のような経過期間を表す語が続く形で、ここでは文脈に合わない。\n② -거든: 〜したら、〜するなら(条件・前提)。まだ起きていないことへの条件を表し、すでに終わった動作の説明には合わない。\n③ -(으)려면: 〜しようとすれば(意図・仮定)。まだ引っ越していない前提の表現で、文脈(すでに家具を買った)に合わない。\n④ -고 나서: 〜してから(動作の完了→次の動作)。「引っ越してから家具を買った」という順序に合い正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [1~2] （　）に入る最も適切な言葉を選びなさい。（各2点）", "passage_ja": null, "question_text_ja": "新居に（　）、家具を新しく買った。", "choices_ja": ["引っ越して以来", "引っ越したら", "引っ越すつもりなら", "引っ越してから"]}, {"id": "91-3", "round": 91, "source": "제91회 읽기 3번", "number": 3, "instruction": "※ [3~4] 밑줄 친 부분과 의미가 가장 비슷한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": null, "question_text": "어려운 이웃을 돕고자 매년 봉사 활동에 참여하고 있다.", "choices": ["돕기 위해서", "돕는 대신에", "돕기 무섭게", "돕는 바람에"], "answer": 1, "grammar_point": "-고자 ≈ -기 위해서 (〜しようと/するために)", "explanation": "「돕고자(助けようと)」という目的を表す表現に近いものを選ぶ問題。\n① 돕기 위해서: 助けるために(目的)。「-고자」と同じく目的を表すため置き換え可能で正解。\n② 돕는 대신에: 助ける代わりに(代替)。目的ではなく代替・引き換えを表すため合わない。\n③ 돕기 무섭게: 助けるやいなや(直後の動作)。時間的な即時性を表す表現で目的の意味にならない。\n④ 돕는 바람에: 助けたせいで(原因・理由)。多くは否定的な結果の原因を表す表現で、目的の意味にはならない。", "underline_field": "question_text", "underline_ko": "돕고자", "underline_ja": "助けようと", "instruction_ja": "※ [3~4] 下線を引いた部分と意味が最も似ているものを選びなさい。（各2点）", "passage_ja": null, "question_text_ja": "生活に困っている隣人を助けようと、毎年ボランティア活動に参加している。", "choices_ja": ["助けるために", "助ける代わりに", "助けるやいなや", "助けたせいで"]}, {"id": "91-4", "round": 91, "source": "제91회 읽기 4번", "number": 4, "instruction": "※ [3~4] 밑줄 친 부분과 의미가 가장 비슷한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": null, "question_text": "지난 3년 동안 영화를 한 편 봤으니 거의 안 본 셈이다.", "choices": ["본 척했다", "보기 나름이다", "볼 수밖에 없었다", "본 거나 마찬가지이다"], "answer": 4, "grammar_point": "-는 셈이다 ≈
