 -는 거나 마찬가지이다 (〜も同然だ)", "explanation": "「거의 안 본 셈이다(ほとんど見ていないも同然だ)」は、実質的にそうであることを表す表現。\n① 본 척했다: 見たふりをした(偽装)。実際は見ていないのに見たように装う意味で文脈に合わない。\n② 보기 나름이다: 見方次第だ(判断による違い)。実質的な評価を表す「-는 셈이다」とは意味が異なる。\n③ 볼 수밖에 없었다: 見るしかなかった(不可避)。状況の不可避性を表し、「実質的にそうだ」という意味とは異なる。\n④ 본 거나 마찬가지이다: 見たも同然だ(同然)。「거의 안 본 셈이다」と同じく実質的評価を表すため正解。", "underline_field": "question_text", "underline_ko": "거의 안 본 셈이다", "underline_ja": "ほとんど見ていないようなものだ", "instruction_ja": "※ [3~4] 下線を引いた部分と意味が最も似ているものを選びなさい。（各2点）", "passage_ja": null, "question_text_ja": "この3年間で映画を1本しか見ていないのだから、ほとんど見ていないようなものだ。", "choices_ja": ["見たふりをした", "見方次第だ", "見るしかなかった", "見たも同然だ"]}, {"id": "91-5", "round": 91, "source": "제91회 읽기 5번", "number": 5, "instruction": "※ [5~8] 다음은 무엇에 대한 글인지 고르십시오. (각 2점)", "passage_group": null, "passage": "입속 치아 사이사이를 깨끗이!\n부드럽게 잘 닦여요~", "question_text": null, "choices": ["비누", "칫솔", "안경", "수건"], "answer": 2, "grammar_point": null, "explanation": "「입속 치아 사이사이를 깨끗이(口の中、歯と歯の間まで清潔に)」「부드럽게 잘 닦여요(やさしくしっかり磨けます)」という表現から칫솔(歯ブラシ)の広告だと分かる。①비누(石けん)は体を洗う物、③안경(めがね)は視力矯正具、④수건(タオル)は体を拭く物で、いずれも歯を磨くという内容には合わない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [5~8] 次は何についての文か選びなさい。（各2点）", "passage_ja": "口の中、歯と歯の間まで清潔に！\nやさしくしっかり磨けます〜", "question_text_ja": null, "choices_ja": ["石けん", "歯ブラシ", "めがね", "タオル"]}, {"id": "91-6", "round": 91, "source": "제91회 읽기 6번", "number": 6, "instruction": "※ [5~8] 다음은 무엇에 대한 글인지 고르십시오. (각 2점)", "passage_group": null, "passage": "아이들의 예쁜 꿈과 희망을 키워 주는 곳\n부모의 마음으로 보살핍니다.", "question_text": null, "choices": ["은행", "서점", "유치원", "우체국"], "answer": 3, "grammar_point": null, "explanation": "「아이들의 예쁜 꿈과 희망을 키워 주는 곳(子どもたちの夢と希望を育む場所)」「부모의 마음으로 보살핍니다(親の心で見守ります)」という表現から유치원(幼稚園)の広告だと分かる。①은행(銀行)、②서점(書店)、④우체국(郵便局)はいずれも子どもを育てるという内容とは関係がない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [5~8] 次は何についての文か選びなさい。（各2点）", "passage_ja": "子どもたちのすてきな夢と希望を育む場所\n親の心で見守ります。", "question_text_ja": null, "choices_ja": ["銀行", "書店", "幼稚園", "郵便局"]}, {"id": "91-7", "round": 91, "source": "제91회 읽기 7번", "number": 7, "instruction": "※ [5~8] 다음은 무엇에 대한 글인지 고르십시오. (각 2점)", "passage_group": null, "passage": "계단으로 다니기! 하루 30분 운동하기!\n우리 몸을 위해 실천하세요.", "question_text": null, "choices": ["건강 관리", "안전 운전", "전화 예절", "절약 습관"], "answer": 1, "grammar_point": null, "explanation": "「계단으로 다니기, 하루 30분 운동하기(階段を使おう、1日30分運動しよう)」という表現から건강 관리(健康管理)を呼びかける標語だと分かる。②안전 운전(安全運転)、③전화 예절(電話のマナー)、④절약 습관(節約習慣)はいずれも運動や体づくりの話とは関係がない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [5~8] 次は何についての文か選びなさい。（各2点）", "passage_ja": "階段を使おう！1日30分運動しよう！\n私たちの体のために実践しましょう。", "question_text_ja": null, "choices_ja": ["健康管理", "安全運転", "電話のマナー", "節約習慣"]}, {"id": "91-8", "round": 91, "source": "제91회 읽기 8번", "number": 8, "instruction": "※ [5~8] 다음은 무엇에 대한 글인지 고르십시오. (각 2점)", "passage_group": null, "passage": "☑ 공연장 내에서는 사진 촬영을 금지합니다.\n☑ 휴대 전화는 전원을 끄거나 진동으로 해 주십시오.", "question_text": null, "choices": ["관람 규칙", "제품 소개", "사용 방법", "예약 문의"], "answer": 1, "grammar_point": null, "explanation": "「사진 촬영을 금지합니다」「휴대 전화는…진동으로」という注意書きから、公演会場での관람 규칙(観覧規則)の案内だと分かる。②제품 소개(製品紹介)、③사용 방법(使用方法)、④예약 문의(予約に関する問い合わせ)はいずれも公演観覧時の注意事項という内容とは異なる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [5~8] 次は何についての文か選びなさい。（各2点）", "passage_ja": "☑ 公演会場内での写真撮影は禁止します。\n☑ 携帯電話の電源はお切りいただくか、マナーモードに設定してください。", "question_text_ja": null, "choices_ja": ["観覧のルール", "製品紹介", "使用方法", "予約に関する問い合わせ"]}, {"id": "91-9", "round": 91, "source": "제91회 읽기 9번", "number": 9, "instruction": "※ [9~12] 다음 글 또는 그래프의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "인주시 야경 관광버스 운행 안내\n10월의 아름다운 밤을 즐겨 보세요.\n관광 장소: 인주역 광장 출발→인주산 전망대→별빛공원\n출발 시간: 매일 18:00\n이용 요금: 성인 10,000원 / 학생 5,000원 (7세 이하 무료)\n예약 방법: 출발 하루 전까지 홈페이지(www.inju-tour.com)에서 신청", "question_text": null, "choices": ["성인과 학생의 버스 요금이 같다.", "이 버스는 별빛공원에서 출발한다.", "매일 오전에 이 버스를 탈 수 있다.", "이 버스를 타려면 미리 신청해야 한다."], "answer": 4, "grammar_point": null, "explanation": "①成人10,000ウォン・学生5,000ウォンとあり料金は異なるため誤り。②出発地は인주역 광장(インジュ駅広場)で、별빛공원(ビョルビッ公園)はコースの終着点なので誤り。③出発時間は毎日18:00(夕方)であり午前ではないため誤り。④「출발 하루 전까지…신청」という記述から、事前申し込みが必要だという④が本文と一致し正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [9~12] 次の文またはグラフの内容と一致するものを選びなさい。（各2点）", "passage_ja": "インジュ市 夜景観光バス 運行案内\n10月の美しい夜をお楽しみください。\n観光コース：インジュ駅広場発 → インジュ山展望台 → ビョルビッ公園（星明かり公園）\n出発時間：毎日18:00\n利用料金：大人10,000ウォン／学生5,000ウォン（7歳以下無料）\n予約方法：出発の前日までにホームページ（www.inju-tour.com）で申し込み", "question_text_ja": null, "choices_ja": ["大人と学生のバス料金は同じである。", "このバスはビョルビッ公園から出発する。", "毎日午前中にこのバスに乗ることができる。", "このバスに乗るには事前に申し込まなければならない。"]}, {"id": "91-10", "round": 91, "source": "제91회 읽기 10번", "number": 10, "instruction": "※ [9~12] 다음 글 또는 그래프의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "인주시 직장인, 출퇴근 시 이동 수단은?\n자가용: 2012년 31%, 2022년 39%\n버스: 2012년 28%, 2022년 21%\n지하철: 2012년 24%, 2022년 27%\n걸어서: 2012년 11%, 2022년 5%\n기타: 2012년 6%, 2022년 8%\n(조사 대상: 직장인 1,000명)", "question_text": null, "choices": ["자가용으로 출퇴근한다고 응답한 직장인들의 비율이 줄었다.", "걸어서 출퇴근하는 직장인은 2012년보다 2022년이 더 적었다.", "2022년에는 지하철을 타고 출퇴근하는 직장인이 가장 많았다.", "2012년에 직장인들은 출퇴근할 때 버스를 제일 많이 이용했다."], "answer": 2, "grammar_point": null, "explanation": "①自家用車の割合は2012年31%→2022年39%で増加しており誤り。②徒歩通勤は2012年11%→2022年5%で減少しており、これが本文(グラフ)と一致し正解。③2022年の最多は地下鉄27%ではなく自家用車39%のため誤り。④2012年の最多はバス28%ではなく自家用車31%のため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [9~12] 次の文またはグラフの内容と一致するものを選びなさい。（各2点）", "passage_ja": "インジュ市の会社員、通勤時の移動手段は？\n自家用車：2012年31％、2022年39％\nバス：2012年28％、2022年21％\n地下鉄：2012年24％、2022年27％\n徒歩：2012年11％、2022年5％\nその他：2012年6％、2022年8％\n（調査対象：会社員1,000人）", "question_text_ja": null, "choices_ja": ["自家用車で通勤すると答えた会社員の割合は減った。", "徒歩で通勤する会社員は、2012年より2022年のほうが少なかった。", "2022年には地下鉄で通勤する会社員が最も多かった。", "2012年に会社員は通勤の際、バスを最もよく利用していた。"], "chart": {"type": "bar-groups", "title": "인주시 직장인, 출퇴근 시 이동 수단은?", "title_ja": "インジュ市の会社員、通勤時の移動手段は？", "caption": "조사 대상: 직장인 1,000명", "caption_ja": "調査対象: 会社員1,000人", "unit": "%", "series_labels": ["2012년", "2022년"], "series_labels_ja": ["2012年", "2022年"], "categories": [{"label": "자가용", "label_ja": "自家用車", "values": [31, 39]}, {"label": "버스", "label_ja": "バス", "values": [28, 21]}, {"label": "지하철", "label_ja": "地下鉄", "values": [24, 27]}, {"label": "걸어서", "label_ja": "徒歩", "values": [11, 5]}, {"label": "기타", "label_ja": "その他", "values": [6, 8]}]}}, {"id": "91-11", "round": 91, "source": "제91회 읽기 11번", "number": 11, "instruction": "※ [9~12] 다음 글 또는 그래프의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "인주시가 작년에 이어 올해도 10월 한 달간 '찾아가는 자전거 수리 센터'를 운영한다. 평일에는 여러 지역을 직접 방문해 고쳐 주고 주말에는 인주공원에서 수리 서비스를 제공한다. 전문 수리 기사가 자전거를 무료로 고쳐 주고 부품 교체가 필요한 경우에는 저렴한 가격으로 바꿔 준다. 시는 시민들의 자전거 타기 생활화를 위해 이 수리 센터를 운영하는 것이라고 밝혔다.", "question_text": null, "choices": ["이 서비스는 일 년 내내 운영된다.", "올해 처음으로 이 센터가 운영되기 시작했다.", "주말에는 인주공원에서 수리를 받을 수 있다.", "이 수리 센터에서는 무료로 부품을 교체해 준다."], "answer": 3, "grammar_point": null, "explanation": "①10月の1か月間だけの運営であり一年中ではないため誤り。②「작년에 이어 올해도(昨年に続き今年も)」とあり、今年初めての運営ではないため誤り。③「주말에는 인주공원에서 수리 서비스를 제공한다」という記述と一致し正解。④部品交換は無料ではなく「저렴한 가격으로(安価な価格で)」行うため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [9~12] 次の文またはグラフの内容と一致するものを選びなさい。（各2点）", "passage_ja": "インジュ市は昨年に続き今年も10月の1か月間、「出張自転車修理センター」を運営する。平日はさまざまな地域を直接訪問して修理し、週末はインジュ公園で修理サービスを提供する。専門の修理技師が自転車を無料で修理し、部品交換が必要な場合は安価な価格で交換してくれる。市は市民の自転車利用を日常化させるためにこの修理センターを運営すると明らかにした。", "question_text_ja": null, "choices_ja": ["このサービスは一年中運営される。", "このセンターは今年初めて運営が始まった。", "週末はインジュ公園で修理を受けることができる。", "この修理センターでは部品を無料で交換してくれる。"]}, {"id": "91-12", "round": 91, "source": "제91회 읽기 12번", "number": 12, "instruction": "※ [9~12] 다음 글 또는 그래프의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "피자 가게를 운영하는 김민수 씨의 사연이 잔잔한 감동을 주고 있다. 최근 김 씨는 피자를 배달하러 가다가 오토바이가 빗길에 미끄러지는 사고를 당했다. 다행히 사람이 다치는 피해는 없었지만 피자가 망가져서 배달에 문제가 생겼다. 배달이 늦어지는 것에 대해 김 씨가 고객에게 연락하자 고객은 \"천천히 오셔도 돼요. 몸은 괜찮나요?\"라며 따뜻한 말부터 전했다고 한다.", "question_text": null, "choices": ["고객은 주문한 피자를 취소하겠다고 말했다.", "사고가 생겨서 배달 중이던 피자가 망가졌다.", "오토바이가 빗길에 미끄러져서 김 씨가 다쳤다.", "김 씨는 피자를 시킨 고객에게 연락하다 사고가 났다."], "answer": 2, "grammar_point": null, "explanation": "①客はキャンセルを申し出ておらず、むしろ「몸은 괜찮나요」と気遣う言葉をかけているため誤り。②「오토바이가…미끄러지는 사고」「피자가 망가져서」という記述と一致し正解。③「다행히 사람이 다치는 피해는 없었다」とあり、キムさんはけがをしていないため誤り。④事故が先に起き、その後に配達の遅れを客へ連絡したという順序なので、「연락하다 사고가 났다」は誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [9~12] 次の文またはグラフの内容と一致するものを選びなさい。（各2点）", "passage_ja": "ピザ店を営むキム・ミンスさんのエピソードが静かな感動を呼んでいる。最近キムさんは、ピザを配達に行く途中、雨で濡れた道でバイクが滑る事故に遭った。幸いけが人は出なかったが、ピザが台無しになり配達に支障が出た。配達が遅れることについてキムさんが客に連絡すると、客は「ゆっくり来てくださって大丈夫です。お体は大丈夫ですか？」と、まず温かい言葉をかけてくれたという。", "question_text_ja": null, "choices_ja": ["客は注文したピザをキャンセルすると言った。", "事故が起きて、配達中だったピザが台無しになった。", "バイクが雨道で滑ってキムさんがけがをした。", "キムさんはピザを注文した客に連絡している最中に事故が起きた。"]}, {"id": "91-13", "round": 91, "source": "제91회 읽기 13번", "number": 13, "instruction": "※ [13~15] 다음을 순서에 맞게 배열한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "(가) 짧게는 하루, 길게는 한 달 정도 반짝 운영하는 임시 매장이다.\n(나) 사람이 붐비는 장소에서 짧은 기간 동안 운영하는 매장이 유행이다.\n(다) 기업은 이 임시 매장을 이용해 주로 특정 제품을 팔거나 홍보를 한다.\n(라) 또 기업 이미지를 친숙하게 만들기 위해 재미있는 행사를 열기도 한다.", "question_text": null, "choices": ["(가) – (다) – (라) – (나)", "(나) – (가) – (다) – (라)", "(가) – (라) – (나) – (다)", "(나) – (라) – (다) – (가)"], "answer": 2, "grammar_point": null, "explanation": "(나)期間限定で営業する店舗が流行しているという現象の提示 → (가)その定義(短くて1日、長くて1か月) → (다)企業がこの店舗を利用する主な目的(製品の販売・宣伝) → (라)さらに加わる目的(企業イメージを親しみやすくする) という「現象→定義→目的→補足目的」の順に並べると自然な文章になる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [13~15] 次を順序どおりに並べたものを選びなさい。（各2点）", "passage_ja": "（가）短くて1日、長くて1か月ほどの期間限定で運営する臨時店舗である。\n（나）人が混み合う場所で短期間だけ営業する店舗が流行している。\n（다）企業はこの臨時店舗を利用して主に特定の製品を販売したり宣伝したりする。\n（라）また、企業イメージを親しみやすくするために、面白いイベントを開くこともある。", "question_text_ja": null, "choices_ja": ["（가）－（다）－（라）－（나）", "（나）－（가）－（다）－（라）", "（가）－（라）－（나）－（다）", "（나）－（라）－（다）－（가）"]}, {"id": "91-14", "round": 91, "source": "제91회 읽기 14번", "number": 14, "instruction": "※ [13~15] 다음을 순서에 맞게 배열한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "(가) 그런데 전화를 끊고 뒤늦게 미안한 마음이 들었다.\n(나) 친구는 나의 합격 소식을 듣고 자신의 일처럼 기뻐했다.\n(다) 얼마 전 나는 회사 합격 소식을 듣고 친한 친구에게 전화했다.\n(라) 아직 취업 못 한 친구를 내가 배려하지 못했다는 생각 때문이었다.", "question_text": null, "choices": ["(나) – (다) – (라) – (가)", "(나) – (라) – (가) – (다)", "(다) – (나) – (가) – (라)", "(다) – (나) – (라) – (가)"], "answer": 3, "grammar_point": null, "explanation": "(다)状況設定(会社合格の知らせを聞いて親しい友人に電話をかける) → (나)友人の反応(自分のことのように喜ぶ) → (가)場面転換(電話を切ってから申し訳ない気持ちになる) → (라)その理由(まだ就職できていない友人への配慮が足りなかった) という時系列と心情の流れに沿って並べると自然な文章になる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [13~15] 次を順序どおりに並べたものを選びなさい。（各2点）", "passage_ja": "（가）ところが、電話を切ってから遅ればせながら申し訳ない気持ちになった。\n（나）友人は私の合格の知らせを聞いて、自分のことのように喜んでくれた。\n（다）少し前、私は会社の合格通知を聞いて親しい友人に電話をかけた。\n（라）まだ就職できていない友人への配慮が足りなかったと思ったからだった。", "question_text_ja": null, "choices_ja": ["（나）－（다）－（라）－（가）", "（나）－（라）－（가）－（다）", "（다）－（나）－（가）－（라）", "（다）－（나）－（라）－（가）"]}, {"id": "91-15", "round": 91, "source": "제91회 읽기 15번", "number": 15, "instruction": "※ [13~15] 다음을 순서에 맞게 배열한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "(가) 빵이나 고기를 구울 때 갈색으로 바뀌는 것이 그 예이다.\n(나) 갈색으로 바뀌면서 빵이나 고기의 맛도 더 깊어지고 풍부해진다.\n(다) 식품에 들어 있는 당과 단백질이 열을 만나면 색깔이 바뀌게 된다.\n(라) 만약 열이 너무 가해져서 검게 타게 되면 그런 맛을 낼 수가 없다.", "question_text": null, "choices": ["(가) – (나) – (라) – (다)", "(다) – (가) – (나) – (라)", "(가) – (다) – (라) – (나)", "(다) – (라) – (나) – (가)"], "answer": 2, "grammar_point": null, "explanation": "(다)原理の提示(食品中の糖とタンパク質が熱に触れると変色する) → (가)具体例(パンや肉を焼くと茶色になる) → (나)その効果(茶色に変わるほど味が深く豊かになる) → (라)限界・注意点(焦げすぎるとその味は出せない) という「原理→例→効果→限界」の順に並べると自然な文章になる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [13~15] 次を順序どおりに並べたものを選びなさい。（各2点）", "passage_ja": "（가）パンや肉を焼くと茶色に変わるのがその例である。\n（나）茶色に変わるにつれて、パンや肉の味もより深く豊かになる。\n（다）食品に含まれる糖とタンパク質が熱に触れると色が変わる。\n（라）もし熱を加えすぎて黒く焦げてしまうと、そのような味は出せなくなる。", "question_text_ja": null, "choices_ja": ["（가）－（나）－（라）－（다）", "（다）－（가）－（나）－（라）", "（가）－（다）－（라）－（나）", "（다）－（라）－（나）－（가）"]}, {"id": "91-16", "round": 91, "source": "제91회 읽기 16번", "number": 16, "instruction": "※ [16~18] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "타조는 멀리서 적이 다가와도 머리를 모래에 파묻고 있다. 그래서 위험이나 위기를 모르는 척 피하는 사람을 타조에 비유하곤 한다. 그런데 사실 타조는 ( ) 위해 이런 행동을 한다. 시각보다 청각이 발달한 타조는 땅에서 울리는 발소리를 듣고 적이 오는지를 파악하려는 것이다.", "question_text": null, "choices": ["적의 움직임을 알기", "먹이를 빨리 구하기", "머리를 깨끗이 씻기", "다른 타조를 공격하기"], "answer": 1, "grammar_point": null, "explanation": "文脈：ダチョウは聴覚で足音を聞き敵の接近を察知するために頭を砂に埋める、という説明。\n① 적의 움직임을 알기(敵の動きを知るため): 直後の「발소리를 듣고 적이 오는지를 파악하려는 것」と一致し正解。\n② 먹이를 빨리 구하기(早くえさを手に入れるため): 頭を埋める行動と餌探しを結びつける記述は本文になく無関係。\n③ 머리를 깨끗이 씻기(頭をきれいに洗うため): 衛生目的についての記述はなく無関係。\n④ 다른 타조를 공격하기(他のダチョウを攻撃するため): 攻撃行動についての記述はなく無関係。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [16~18] （　）に入る最も適切な言葉を選びなさい。（各2点）", "passage_ja": "ダチョウは、遠くから敵が近づいてきても頭を砂に埋めている。そのため、危険や危機を知らないふりをして避ける人をダチョウにたとえることがある。しかし実はダチョウは（　）ためにこのような行動をとる。視覚より聴覚が発達しているダチョウは、地面に響く足音を聞いて敵が来ているかどうかを察知しようとしているのである。", "question_text_ja": null, "choices_ja": ["敵の動きを知る", "早くえさを手に入れる", "頭をきれいに洗う", "他のダチョウを攻撃する"]}, {"id": "91-17", "round": 91, "source": "제91회 읽기 17번", "number": 17, "instruction": "※ [16~18] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "섬유 유연제는 섬유에 막을 씌워 옷감을 부드럽게 하고 향기도 남긴다. 그래서 세탁할 때 유연제를 넣는 사람들이 많다. 그런데 수건처럼 물기를 빠르게 흡수해야 하는 소재에는 유연제를 넣는 것이 좋은 것만은 아니다. 유연제가 만든 막이 오히려 섬유의 ( ) 때문이다.", "question_text": null, "choices": ["향기를 없애기", "색깔을 변형시키기", "흡수력을 떨어뜨리기", "촉감을 거칠게 만들기"], "answer": 3, "grammar_point": null, "explanation": "文脈：柔軟剤の膜が、タオルのような吸水性素材には良くない理由を選ぶ。\n① 향기를 없애기(香りをなくしてしまう): 柔軟剤はむしろ香りを残す効果があるため矛盾する。\n② 색깔을 변형시키기(色を変質させてしまう): 色の変化についての記述は本文になく無関係。\n③ 흡수력을 떨어뜨리기(吸収力を落としてしまう): 膜が水分の吸収を妨げるという趣旨に合致し正解。\n④ 촉감을 거칠게 만들기(触り心地をごわごわにしてしまう): 柔軟剤はむしろ生地を柔らかくする効果があるため矛盾する。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [16~18] （　）に入る最も適切な言葉を選びなさい。（各2点）", "passage_ja": "柔軟剤は繊維に膜を張って生地を柔らかくし、香りも残してくれる。そのため洗濯の際に柔軟剤を入れる人が多い。しかし、タオルのように水分を素早く吸収する必要がある素材には、柔軟剤を入れるのが必ずしも良いとは言えない。柔軟剤が作る膜が、かえって繊維の（　）ためである。", "question_text_ja": null, "choices_ja": ["香りをなくしてしまう", "色を変質させてしまう", "吸収力を落としてしまう", "触り心地をごわごわにしてしまう"]}, {"id": "91-18", "round": 91, "source": "제91회 읽기 18번", "number": 18, "instruction": "※ [16~18] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "디지털 기기에 대한 의존도가 높아지면서 사람들이 무언가 직접 기억해야 할 일은 줄었다. 그래서 이전보다 ( ) 생각할 수 있다. 그런데 뇌를 사용하는 방식이 이전과 달라졌을 뿐 사용량이 줄어든 것이 아니다. 과거에는 단순히 정보를 기억하는 데 뇌를 썼다면 이제는 과거보다 압도적으로 많아진 정보를 처리하는 데 사용하고 있는 것이다.", "question_text": null, "choices": ["뇌를 덜 사용한다고", "기억력이 좋아졌다고", "저장해야 할 정보가 많다고", "디지털 기기를 많이 쓴다고"], "answer": 1, "grammar_point": null, "explanation": "文脈：一見「以前より(　)」と思われがちだが、実際は脳の使用量は減っていないという逆接の構造。\n① 뇌를 덜 사용한다고(脳をあまり使わなくなったと): 直後で「사용량이 줄어든 것이 아니다」と否定される前提として自然につながり正解。\n② 기억력이 좋아졌다고(記憶力が良くなったと): 記憶を機器に頼るようになったという文脈の裏返しにはならず合わない。\n③ 저장해야 할 정보가 많다고(保存すべき情報が多いと): 直接記憶する必要が減ったという冒頭の内容と矛盾する。\n④ 디지털 기기를 많이 쓴다고(デジタル機器をたくさん使っていると): これは原因であって、「생각할 수 있다」の結果内容にはならない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [16~18] （　）に入る最も適切な言葉を選びなさい。（各2点）", "passage_ja": "デジタル機器への依存度が高まるにつれて、人々が自分で直接記憶しなければならないことは減った。そのため、以前より（　）と考えることができる。しかし、脳の使い方が以前と変わっただけで、使用量が減ったわけではない。かつては単に情報を記憶するために脳を使っていたとすれば、今は以前より圧倒的に増えた情報を処理するために使っているのである。", "question_text_ja": null, "choices_ja": ["脳をあまり使わなくなった", "記憶力が良くなった", "保存すべき情報が多い", "デジタル機器をたくさん使っている"]}, {"id": "91-19", "round": 91, "source": "제91회 읽기 19번", "number": 19, "instruction": "※ [19~20] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "19-20", "passage": "매서운 남극의 겨울, 황제펭귄들은 겹겹이 붙어 서로의 체온으로 추위를 견딘다. 무리 전체가 돌면서 바깥쪽과 안쪽에 있는 펭귄들이 계속 서로의 위치를 바꾼다. 안에서 몸을 데운 펭귄은 밖으로 나가고 밖에서 추위에 떨던 펭귄은 안으로 들어오는 것이다. ( ) 그 움직임은 아주 느리지만 쉬지 않고 이루어져 한 마리의 펭귄이 줄곧 찬바람을 맞고 서 있는 일이 없다. 그렇게 쉼 없이 둥글게 돌면서 펭귄들은 다 함께 살아남는다.", "question_text": "( )에 들어갈 말로 가장 알맞은 것을 고르십시오.", "choices": ["혹시", "또는", "비록", "만약"], "answer": 3, "grammar_point": "비록 〜지만 (たとえ〜でも、譲歩の接続詞)", "explanation": "文脈：後続の「그 움직임은 아주 느리지만(その動きはとてもゆっくりだが)」という譲歩表現と呼応する接続語を選ぶ。\n① 혹시(もしかすると): 不確実な推測を表す副詞で、譲歩の「-지만」とは呼応しない。\n② 또는(または): 選択を表す接続語で文脈に合わない。\n③ 비록(たとえ〜でも): 後ろの「-지만/-아도」と呼応して譲歩を表す副詞で、「動きは遅いが」に自然につながり正解。\n④ 만약(もし): 仮定を表す副詞で、後ろに「-면」が続くのが一般的なため合わない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [19~20] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "厳しい南極の冬、コウテイペンギンたちは幾重にも身を寄せ合い、互いの体温で寒さに耐える。群れ全体が回転しながら、外側と内側にいるペンギンたちは絶えず位置を入れ替える。中で体を温めたペンギンは外へ出て、外で寒さに震えていたペンギンは中に入るのである。（　）その動きはとてもゆっくりだが休みなく続けられ、一羽のペンギンがずっと冷たい風を受け続けて立っていることがない。そうして絶え間なく円を描くように回りながら、ペンギンたちは皆で一緒に生き延びるのである。", "question_text_ja": "（　）に入る最も適切な言葉を選びなさい。", "choices_ja": ["もしかすると", "または", "たとえ〜としても", "もし"]}, {"id": "91-20", "round": 91, "source": "제91회 읽기 20번", "number": 20, "instruction": "※ [19~20] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "19-20", "passage": "매서운 남극의 겨울, 황제펭귄들은 겹겹이 붙어 서로의 체온으로 추위를 견딘다. 무리 전체가 돌면서 바깥쪽과 안쪽에 있는 펭귄들이 계속 서로의 위치를 바꾼다. 안에서 몸을 데운 펭귄은 밖으로 나가고 밖에서 추위에 떨던 펭귄은 안으로 들어오는 것이다. ( ) 그 움직임은 아주 느리지만 쉬지 않고 이루어져 한 마리의 펭귄이 줄곧 찬바람을 맞고 서 있는 일이 없다. 그렇게 쉼 없이 둥글게 돌면서 펭귄들은 다 함께 살아남는다.", "question_text": "윗글의 주제로 가장 알맞은 것을 고르십시오.", "choices": ["황제펭귄은 서로 도우면서 추위에 맞서 생존해 왔다.", "황제펭귄은 둥글게 돌면서 날씨에 대한 정보를 알린다.", "황제펭귄은 추위에서 살아남기 위해 움직임이 느려졌다.", "황제펭귄은 무리 생활을 통해 경쟁에서 이기는 법을 배운다."], "answer": 1, "grammar_point": null, "explanation": "①位置を交代しながら互いに体温を分け合い、共に生き延びるという本文全体の内容と一致し正解。\n②天気情報を伝えるという内容は本文になく無関係。\n③動きが遅いのはもともとの特性で、「寒さを生き延びるために遅くなった」という因果関係は本文にない。\n④競争に勝つ方法という内容はなく、本文はむしろ協力・共生を描いている。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [19~20] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "厳しい南極の冬、コウテイペンギンたちは幾重にも身を寄せ合い、互いの体温で寒さに耐える。群れ全体が回転しながら、外側と内側にいるペンギンたちは絶えず位置を入れ替える。中で体を温めたペンギンは外へ出て、外で寒さに震えていたペンギンは中に入るのである。（　）その動きはとてもゆっくりだが休みなく続けられ、一羽のペンギンがずっと冷たい風を受け続けて立っていることがない。そうして絶え間なく円を描くように回りながら、ペンギンたちは皆で一緒に生き延びるのである。", "question_text_ja": "上の文章の主題として最も適切なものを選びなさい。", "choices_ja": ["コウテイペンギンは互いに助け合いながら寒さに立ち向かい生き延びてきた。", "コウテイペンギンは円を描いて回りながら天気についての情報を知らせる。", "コウテイペンギンは寒さの中で生き延びるために動きが遅くなった。", "コウテイペンギンは群れ生活を通じて競争に勝つ方法を学ぶ。"]}, {"id": "91-21", "round": 91, "source": "제91회 읽기 21번", "number": 21, "instruction": "※ [21~22] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "21-22", "passage": "최근 미술 전시회 수요가 증가하면서 돈벌이에 급급한 전시회가 늘고 있다. 일부 전시 관계자들이 전시 포스터 등 홍보 자료에 복제품 전시임을 밝히지 않고 입장료 수입만을 챙기는 것이다. 전시장을 찾아와서야 이런 사실을 알게 된 관람객들은 불만을 쏟아 내고 있다. 전문가들은 이런 전시 행태가 미술계 발전의 ( ) 수 있다고 우려한다. 전시회에 실망한 사람들이 미술에 대한 관심을 아예 끊을 수 있기 때문이다.", "question_text": "( )에 들어갈 말로 가장 알맞은 것을 고르십시오.", "choices": ["입맛에 맞을", "가슴을 울릴", "발목을 잡을", "손을 맞잡을"], "answer": 3, "grammar_point": "발목을 잡다 (足を引っ張る)", "explanation": "文脈：複製品展示の不正が発覚し観客の不満を招いている状況が、美術界の発展にとってどうなるかを表す慣用句を選ぶ。\n① 입맛에 맞다(好みに合う): 好き嫌いの一致を表す表現で、発展を妨げるという否定的な文脈に合わない。\n② 가슴을 울리다(心を打つ): 感動を表す肯定的な表現で、この否定的な文脈に合わない。\n③ 발목을 잡다(足を引っ張る): 妨げになるという意味の慣用句で、「不正展示→観客の失望→美術への関心喪失」という悪影響の流れに合致し正解。\n④ 손을 맞잡다(手を取り合う): 協力を表す肯定的な表現で、文脈に合わない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [21~22] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "最近、美術展の需要が増える中で、金もうけに汲々とする展示会が増えている。一部の展示関係者が、展示ポスターなどの広報資料に複製品展示であることを明記せず、入場料収入だけを得ているのである。会場を訪れて初めてこの事実を知った観覧客たちは不満をぶちまけている。専門家たちは、こうした展示の在り方が美術界の発展の（　）可能性があると懸念している。展示会に失望した人々が美術への関心をすっかり失ってしまうこともあり得るからである。", "question_text_ja": "（　）に入る最も適切な言葉を選びなさい。", "choices_ja": ["好みに合う", "心を打つ", "足を引っ張る", "手を取り合う"]}, {"id": "91-22", "round": 91, "source": "제91회 읽기 22번", "number": 22, "instruction": "※ [21~22] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "21-22", "passage": "최근 미술 전시회 수요가 증가하면서 돈벌이에 급급한 전시회가 늘고 있다. 일부 전시 관계자들이 전시 포스터 등 홍보 자료에 복제품 전시임을 밝히지 않고 입장료 수입만을 챙기는 것이다. 전시장을 찾아와서야 이런 사실을 알게 된 관람객들은 불만을 쏟아 내고 있다. 전문가들은 이런 전시 행태가 미술계 발전의 ( ) 수 있다고 우려한다. 전시회에 실망한 사람들이 미술에 대한 관심을 아예 끊을 수 있기 때문이다.", "question_text": "윗글의 내용과 같은 것을 고르십시오.", "choices": ["복제품 전시회는 입장료를 받지 않는다.", "최근 미술 전시회를 찾는 사람들이 많지 않다.", "전시회에서 복제품을 전시하는 일이 점점 줄고 있다.", "복제품 전시회인지 모르고 전시회를 방문한 관람객들이 있다."], "answer": 4, "grammar_point": null, "explanation": "①「입장료 수입만을 챙기는」とあり、むしろ入場料収入だけを得ているため誤り。②「미술 전시회 수요가 증가하면서」とあり、最近訪れる人は多いため誤り。③複製品展示は「늘고 있다(増えている)」のであり、減っているわけではないため誤り。④「전시장을 찾아와서야 이런 사실을 알게 된 관람객들」という記述と一致し正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [21~22] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "最近、美術展の需要が増える中で、金もうけに汲々とする展示会が増えている。一部の展示関係者が、展示ポスターなどの広報資料に複製品展示であることを明記せず、入場料収入だけを得ているのである。会場を訪れて初めてこの事実を知った観覧客たちは不満をぶちまけている。専門家たちは、こうした展示の在り方が美術界の発展の（　）可能性があると懸念している。展示会に失望した人々が美術への関心をすっかり失ってしまうこともあり得るからである。", "question_text_ja": "上の文章の内容と一致するものを選びなさい。", "choices_ja": ["複製品の展示会は入場料を取らない。", "最近、美術展を訪れる人は多くない。", "展示会で複製品を展示することは次第に減っている。", "複製品の展示会だと知らずに会場を訪れた観覧客がいる。"]}, {"id": "91-23", "round": 91, "source": "제91회 읽기 23번", "number": 23, "instruction": "※ [23~24] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "23-24", "passage": "꽃집을 지나다가 꽃말에 이끌려 금잔화 꽃씨를 샀다. 화분에 심어 사무실의 내 책상 위에 두었더니 어느 날 싹이 텄다. 때맞춰 물도 주며 나는 수시로 들여다보았다. 신기했다. 작고 여린 싹은 눈에 띄게 쑥쑥 자랐다. 그런데 내가 상상한 모습이 아니었다. 도대체 여기서 어떻게 꽃이 핀다는 건지. 무순처럼 길쭉하게 위로만 자라는 것이었다. 하루는 출근해 보니 금잔화가 쓰러져 있었다. 그럼 그렇지. 내가 무슨 식물을 키우나. 그날 나는 화분을 창가로 옮겨 놓았다. 죽을 것 같은 모습을 눈앞에서 보고 싶지 않았다. 그런데 어느 날부턴가 점점 줄기가 굵어지더니 잎도 제법 풍성해지기 시작했다. 어느 날에는 꽃망울도 올라와 있었다. 금잔화는 창문으로 들어오는 풍성한 햇볕 속에서 스스로 튼튼해졌다. 금잔화에게는 햇빛이 더 많이 필요했었나 보다. 사람도 식물도 사랑하려면 그 대상을 제대로 알아야 하는 건 똑같구나 싶었다. 씩씩하게 꽃피운 금잔화의 꽃말은 '반드시 올 행복'이다.", "question_text": "밑줄 친 부분에 나타난 '나'의 심정으로 가장 알맞은 것을 고르십시오.", "choices": ["의심스럽다", "고통스럽다", "조심스럽다", "부담스럽다"], "answer": 1, "grammar_point": null, "explanation": "下線部「도대체 여기서 어떻게 꽃이 핀다는 건지(一体ここからどうやって花が咲くというのか)」は、想像と違う芽の伸び方に対する半信半疑の心の声。\n① 의심스럽다(疑わしい): このまま本当に花が咲くのか疑わしく思う気持ちに合致し正解。\n② 고통스럽다(苦しい): 強い身体的・精神的苦痛を表す語で、この場面の戸惑いとは強さの度合いが合わない。\n③ 조심스럽다(気がかりだ・慎重だ): 配慮や慎重さを表す語で、疑念を抱くこの場面には合わない。\n④ 부담스럽다(負担に感じる): 重荷に感じる気持ちを表す語で、この場面の心情とは異なる。", "underline_field": "passage", "underline_ko": "도대체 여기서 어떻게 꽃이 핀다는 건지", "underline_ja": "一体ここからどうやって花が咲くというのか", "instruction_ja": "※ [23~24] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "花屋の前を通りかかったとき、花言葉に惹かれてキンセンカの種を買った。鉢に植えてオフィスの自分の机の上に置いておくと、ある日芽が出た。私はタイミングよく水をやりながら、しょっちゅう眺めていた。不思議だった。小さくかよわい芽は目に見えて、ぐんぐん育っていった。しかし、それは私が想像していた姿ではなかった。一体ここからどうやって花が咲くというのか。まるでカイワレ大根のように、ひょろりと上にばかり伸びていくのだった。ある日出勤してみると、キンセンカが倒れていた。やっぱりそうか。私に植物なんて育てられるはずがない。その日、私は鉢を窓際に移した。今にも枯れそうな姿を目の前で見たくなかったのだ。ところが、ある日を境に茎がだんだん太くなり、葉もかなり豊かになり始めた。ある日にはつぼみも上がってきていた。キンセンカは窓から差し込むたっぷりの日差しの中で、自ら丈夫になっていった。キンセンカには、もっと多くの日光が必要だったようだ。人も植物も、愛するにはその対象をきちんと知らなければならないのは同じなのだな、と思った。たくましく花を咲かせたキンセンカの花言葉は「必ず来る幸せ」である。", "question_text_ja": "下線を引いた部分に表れている「私」の心情として最も適切なものを選びなさい。", "choices_ja": ["疑わしい", "苦しい", "気がかりだ", "負担に感じる"]}, {"id": "91-24", "round": 91, "source": "제91회 읽기 24번", "number": 24, "instruction": "※ [23~24] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "23-24", "passage": "꽃집을 지나다가 꽃말에 이끌려 금잔화 꽃씨를 샀다. 화분에 심어 사무실의 내 책상 위에 두었더니 어느 날 싹이 텄다. 때맞춰 물도 주며 나는 수시로 들여다보았다. 신기했다. 작고 여린 싹은 눈에 띄게 쑥쑥 자랐다. 그런데 내가 상상한 모습이 아니었다. 도대체 여기서 어떻게 꽃이 핀다는 건지. 무순처럼 길쭉하게 위로만 자라는 것이었다. 하루는 출근해 보니 금잔화가 쓰러져 있었다. 그럼 그렇지. 내가 무슨 식물을 키우나. 그날 나는 화분을 창가로 옮겨 놓았다. 죽을 것 같은 모습을 눈앞에서 보고 싶지 않았다. 그런데 어느 날부턴가 점점 줄기가 굵어지더니 잎도 제법 풍성해지기 시작했다. 어느 날에는 꽃망울도 올라와 있었다. 금잔화는 창문으로 들어오는 풍성한 햇볕 속에서 스스로 튼튼해졌다. 금잔화에게는 햇빛이 더 많이 필요했었나 보다. 사람도 식물도 사랑하려면 그 대상을 제대로 알아야 하는 건 똑같구나 싶었다. 씩씩하게 꽃피운 금잔화의 꽃말은 '반드시 올 행복'이다.", "question_text": "윗글의 내용과 같은 것을 고르십시오.", "choices": ["내 책상 위에 둔 금잔화는 금방 말라 죽었다.", "나는 금잔화 화분에 물을 제대로 주지 못했다.", "나는 꽃집에서 금잔화가 피어 있는 화분을 샀다.", "내가 금잔화 화분을 옮긴 곳은 햇볕이 잘 들었다."], "answer": 4, "grammar_point": null, "explanation": "①のちに茎が太くなり花も咲いたとあり、すぐに枯れて死んだというのは誤り。②「때맞춰 물도 주며(タイミングよく水をやりながら)」とあり、世話はきちんとしていたため誤り。③花屋で買ったのは「꽃씨(種)」であって、花が咲いている鉢を買ったのではないため誤り。④「창가로 옮겨 놓았다」「풍성한 햇볕 속에서」という記述と一致し正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [23~24] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "花屋の前を通りかかったとき、花言葉に惹かれてキンセンカの種を買った。鉢に植えてオフィスの自分の机の上に置いておくと、ある日芽が出た。私はタイミングよく水をやりながら、しょっちゅう眺めていた。不思議だった。小さくかよわい芽は目に見えて、ぐんぐん育っていった。しかし、それは私が想像していた姿ではなかった。一体ここからどうやって花が咲くというのか。まるでカイワレ大根のように、ひょろりと上にばかり伸びていくのだった。ある日出勤してみると、キンセンカが倒れていた。やっぱりそうか。私に植物なんて育てられるはずがない。その日、私は鉢を窓際に移した。今にも枯れそうな姿を目の前で見たくなかったのだ。ところが、ある日を境に茎がだんだん太くなり、葉もかなり豊かになり始めた。ある日にはつぼみも上がってきていた。キンセンカは窓から差し込むたっぷりの日差しの中で、自ら丈夫になっていった。キンセンカには、もっと多くの日光が必要だったようだ。人も植物も、愛するにはその対象をきちんと知らなければならないのは同じなのだな、と思った。たくましく花を咲かせたキンセンカの花言葉は「必ず来る幸せ」である。", "question_text_ja": "上の文章の内容と一致するものを選びなさい。", "choices_ja": ["私の机の上に置いたキンセンカはすぐに枯れて死んでしまった。", "私はキンセンカの鉢にきちんと水をやれなかった。", "私は花屋でキンセンカの花が咲いている鉢を買った。", "私がキンセンカの鉢を移した場所は日当たりが良かった。"]}, {"id": "91-25", "round": 91, "source": "제91회 읽기 25번", "number": 25, "instruction": "※ [25~27] 다음 신문 기사의 제목을 가장 잘 설명한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "가수 진영, 3년 만의 콘서트에 구름 관중", "question_text": null, "choices": ["가수 진영이 3년 만에 콘서트를 열자 수많은 관중이 몰렸다.", "가수 진영이 3년 내에 다시 콘서트를 열기로 관중에게 약속했다.", "가수 진영이 3년간 준비한 콘서트를 열었으나 관중의 호응이 적었다.", "가수 진영이 3년 만에 하는 콘서트에 많은 관중을 모으려고 홍보했다."], "answer": 1, "grammar_point": null, "explanation": "見出し「구름 관중(黒山の観衆)」は非常に多くの観客が集まったという意味。\n① 3年ぶりのコンサートに多くの観衆が押し寄せたという趣旨で見出しと一致し正解。\n② 「3年以内に再びコンサートを開くと約束した」という未来の約束の話は見出しにない内容。\n③ 「관중의 호응이 적었다(観衆の反応が薄かった)」は「구름 관중」と正反対の内容で誤り。\n④ 「홍보했다(宣伝した)」は集客のための事前活動の話で、実際に多くの観客が来たという見出しの結果とは異なる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [25~27] 次の新聞記事の見出しを最もよく説明しているものを選びなさい。（各2点）", "passage_ja": "歌手ジニョン、3年ぶりのコンサートに黒山の観衆", "question_text_ja": null, "choices_ja": ["歌手ジニョンが3年ぶりにコンサートを開くと、多くの観衆が押し寄せた。", "歌手ジニョンが3年以内にまたコンサートを開くと観衆に約束した。", "歌手ジニョンが3年かけて準備したコンサートを開いたが、観衆の反応は薄かった。", "歌手ジニョンが3年ぶりに行うコンサートに多くの観衆を集めようと宣伝した。"]}, {"id": "91-26", "round": 91, "source": "제91회 읽기 26번", "number": 26, "instruction": "※ [25~27] 다음 신문 기사의 제목을 가장 잘 설명한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "한국 탁구의 간판 김수미, 올해 국제 대회 금메달 싹쓸이", "question_text": null, "choices": ["올해 국제 탁구 대회에서 한국 대표 김수미의 금메달 가능성이 높아졌다.", "한국 탁구계가 김수미를 내세워 올해 국제 대회의 금메달을 노리고 있다.", "한국의 대표 탁구 선수 김수미가 올해 국제 대회에서 모두 금메달을 땄다.", "한국 탁구 선수 김수미가 올해 국제 대회에서 금메달을 따고자 훈련 중이다."], "answer": 3, "grammar_point": null, "explanation": "見出し「금메달 싹쓸이(金メダル総なめ)」は、出場した大会ですべて金メダルを獲得したという意味。\n① 「가능성이 높아졌다(可能性が高まった)」は未確定の見込みの話で、すでに総なめにしたという見出しの事実と異なる。\n② 「금메달을 노리고 있다(金メダルを狙っている)」は今後の目標の話で、すでに獲得した結果を表す見出しと異なる。\n③ 「모두 금메달을 땄다(すべて金メダルを獲得した)」が「싹쓸이」の意味と一致し正解。\n④ 「훈련 중이다(訓練中である)」は準備段階の話で、すでに成果を出した見出しの内容と異なる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [25~27] 次の新聞記事の見出しを最もよく説明しているものを選びなさい。（各2点）", "passage_ja": "韓国卓球の看板選手キム・スミ、今年の国際大会で金メダルを総なめ", "question_text_ja": null, "choices_ja": ["今年の国際卓球大会で韓国代表キム・スミの金メダル獲得の可能性が高まった。", "韓国卓球界がキム・スミを前面に立て、今年の国際大会での金メダルを狙っている。", "韓国の代表卓球選手キム・スミが、今年の国際大会ですべて金メダルを獲得した。", "韓国の卓球選手キム・スミが、今年の国際大会で金メダルを取ろうと訓練中である。"]}, {"id": "91-27", "round": 91, "source": "제91회 읽기 27번", "number": 27, "instruction": "※ [25~27] 다음 신문 기사의 제목을 가장 잘 설명한 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "대출 금리 하락세, 부동산 시장 기지개", "question_text": null, "choices": ["대출 금리가 떨어지면서 부동산 시장이 살아나기 시작했다.", "부동산 시장에 대한 규제가 대출 금리 하락에 영향을 미쳤다.", "대출 금리가 하락했지만 부동산 시장의 거래는 줄어들고 있다.", "부동산 시장을 활성화하려고 대출 금리 안정화 대책이 논의되고 있다."], "answer": 1, "grammar_point": null, "explanation": "見出し「부동산 시장 기지개(不動産市場に活気の兆し)」は、金利低下を受けて市場が動き出したという意味。\n① 「금리가 떨어지면서 부동산 시장이 살아나기 시작했다」が見出しの趣旨と一致し正解。\n② 「규제가 금리 하락에 영향을 미쳤다」は規制→金利という逆方向の因果関係で、見出しにない内容。\n③ 「거래는 줄어들고 있다」は「기지개(伸び・活気)」と正反対の内容で誤り。\n④ 「안정화 대책이 논의되고 있다」は議論段階の話で、すでに金利が下落し市場が動き出したという見出しの内容とは異なる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [25~27] 次の新聞記事の見出しを最もよく説明しているものを選びなさい。（各2点）", "passage_ja": "融資金利、下落傾向 不動産市場に活気の兆し", "question_text_ja": null, "choices_ja": ["融資金利が下がり、不動産市場が上向き始めた。", "不動産市場に対する規制が融資金利の下落に影響を与えた。", "融資金利は下がったが、不動産市場の取引は減っている。", "不動産市場を活性化させるため、融資金利の安定化対策が議論されている。"]}, {"id": "91-28", "round": 91, "source": "제91회 읽기 28번", "number": 28, "instruction": "※ [28~31] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "선글라스는 보통 햇빛이 강할 때 눈 건강을 위해 쓴다. 그런데 선글라스의 렌즈는 사용 기한이 있다. 선글라스의 렌즈에는 자외선 차단을 위한 얇은 막이 입혀져 있는데 열에 계속 노출되면 자외선 차단 기능이 점점 떨어지게 된다. 자외선 차단 기능이 약해진 선글라스로는 눈을 보호하기 어려우므로 5년 정도 쓰고 나면 ( ) 것이 좋다.", "question_text": null, "choices": ["렌즈를 바꿔 주는", "렌즈를 꼼꼼히 잘 닦는", "렌즈의 색을 어둡게 하는", "렌즈의 얇은 막을 벗겨 내는"], "answer": 1, "grammar_point": null, "explanation": "文脈：紫外線遮断膜が劣化した5年後のサングラスにどう対処すべきかを選ぶ。\n① 렌즈를 바꿔 주는(レンズを交換する): 劣化した遮断機能を回復させる方法として自然で正解。\n② 렌즈를 꼼꼼히 잘 닦는(丁寧によく拭く): 汚れの除去であって、遮断膜の劣化という問題の解決にはならない。\n③ 렌즈의 색을 어둡게 하는(色を濃くする): 色の濃さと紫外線遮断機能の劣化は別の話で、本文に根拠がない。\n④ 렌즈의 얇은 막을 벗겨 내는(薄い膜をはがす): その膜こそが必要な遮断機能であり、はがすと逆効果になるため矛盾する。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [28~31] （　）に入る最も適切な言葉を選びなさい。（各2点）", "passage_ja": "サングラスは普通、日差しが強いときに目の健康のためにかける。しかし、サングラスのレンズには使用期限がある。サングラスのレンズには紫外線を遮断するための薄い膜がコーティングされているが、熱にさらされ続けると紫外線遮断機能がだんだん落ちてしまう。紫外線遮断機能が弱まったサングラスでは目を保護しにくいため、5年ほど使ったら（　）ほうがよい。", "question_text_ja": null, "choices_ja": ["レンズを交換する", "レンズを丁寧によく拭く", "レンズの色を濃くする", "レンズの薄い膜をはがす"]}, {"id": "91-29", "round": 91, "source": "제91회 읽기 29번", "number": 29, "instruction": "※ [28~31] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "사진에서 구도는 전체적인 분위기를 살리는 중요한 요소이다. 보통 동적인 느낌을 주고 싶을 때는 대각선 구도를 쓰는데 도로나 폭포 등의 풍경 사진 등에 쓰여 생동감을 표현한다. 한편 전통적인 가족사진은 ( ) 위해서 삼각형 구도를 가장 많이 활용한다. 이 구도는 연장자를 중심으로 가족 구성원이 옆이나 뒤에 배치되어 전체적으로 편안하고 균형 잡힌 분위기를 만들어 낸다.", "question_text": null, "choices": ["동적인 효과를 살리기", "안정적인 느낌을 주기", "풍경을 중앙에 배치하기", "긴장된 분위기를 연출하기"], "answer": 2, "grammar_point": null, "explanation": "文脈：伝統的な家族写真で三角形構図を使う目的を選ぶ。\n① 동적인 효과를 살리기(動的な効果を生かす): 動的な印象は対角線構図の説明であり、三角形構図とは逆の性質。\n② 안정적인 느낌을 주기(安定した感じを与える): 直後の「전체적으로 편안하고 균형 잡힌 분위기」と一致し正解。\n③ 풍경을 중앙에 배치하기(風景を中央に配置する): 家族写真の構図の話であり風景写真の話ではなく、本文に根拠がない。\n④ 긴장된 분위기를 연출하기(緊張感のある雰囲気を演出する): 「편안하고 균형 잡힌」という穏やかな雰囲気と正反対の内容。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [28~31] （　）に入る最も適切な言葉を選びなさい。（各2点）", "passage_ja": "写真において構図は全体の雰囲気を生かす重要な要素である。普通、動的な感じを与えたいときは対角線構図を使い、道路や滝などの風景写真などに用いられて躍動感を表現する。一方、伝統的な家族写真は（　）ために三角形構図を最もよく活用する。この構図は年長者を中心に家族の構成員が横や後ろに配置され、全体として落ち着いてバランスの取れた雰囲気を作り出す。", "question_text_ja": null, "choices_ja": ["動的な効果を生かす", "安定した感じを与える", "風景を中央に配置する", "緊張感のある雰囲気を演出する"]}, {"id": "91-30", "round": 91, "source": "제91회 읽기 30번", "number": 30, "instruction": "※ [28~31] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "풍부한 자원은 경제 성장의 필요조건이지 충분조건은 아니다. 풍부한 천연자원을 갖추고 있음에도 ( ) 경우도 있다. 풍부한 자원에만 의존해 경제 성장의 중심 산업인 제조업이나 서비스업 등에 투자를 하지 않게 되는 것이다. 반면에 천연자원이 빈약해도 새로운 기술 개발이나 교육을 통해 생산 능력을 높이는 나라도 있다.", "question_text": null, "choices": ["제조업에 의존하려는", "자원을 생산하지 못하는", "경제 발전을 이루지 못하는", "기술 개발에 무리하게 투자하는"], "answer": 3, "grammar_point": null, "explanation": "文脈：資源が豊富でも投資を怠った場合に起こりうる結果を選ぶ。\n① 제조업에 의존하려는(製造業に頼ろうとする): 直後で「제조업이나 서비스업 등에 투자를 하지 않게 되는 것」とあり、製造業に頼るのではなく投資しなくなるという内容と矛盾する。\n② 자원을 생산하지 못하는(資源を生産できない): 天然資源はすでに豊富だとあるため矛盾する。\n③ 경제 발전을 이루지 못하는(経済発展を成し遂げられない): 資源の豊富さが経済成長の十分条件ではないという文全体の趣旨と一致し正解。\n④ 기술 개발에 무리하게 투자하는(技術開発に無理に投資する): 本文はむしろ資源国が投資を怠る話をしており、無理な投資の話とは逆。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [28~31] （　）に入る最も適切な言葉を選びなさい。（各2点）", "passage_ja": "豊富な資源は経済成長の必要条件ではあるが、十分条件ではない。豊富な天然資源を備えていても（　）場合もある。豊富な資源にばかり頼って、経済成長の中心産業である製造業やサービス業などへの投資を行わなくなってしまうのである。一方、天然資源が乏しくても、新しい技術開発や教育を通じて生産能力を高める国もある。", "question_text_ja": null, "choices_ja": ["製造業に頼ろうとする", "資源を生産できない", "経済発展を成し遂げられない", "技術開発に無理に投資する"]}, {"id": "91-31", "round": 91, "source": "제91회 읽기 31번", "number": 31, "instruction": "※ [28~31] ( )에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "의사의 모습을 생각하면 우리는 보통 흰색 가운을 떠올리게 된다. 그런데 의사 가운이 처음부터 흰색이었던 것은 아니다. 중세 시대에는 성직자가 의사를 겸하는 경우가 많아 성직자용 검은색 가운을 입고 진료를 했다. 그런데 검은색 옷은 세균으로 오염된 얼룩이 잘 보이지 않았다. 이후 세균 감염의 위험성에 대한 인식이 높아지면서 ( ) 가운의 색이 흰색으로 바뀌었다.", "question_text": null, "choices": ["염색하기 편하게", "환자와 구분이 되도록", "오염이 쉽게 눈에 띄도록", "밝은 이미지를 줄 수 있게"], "answer": 3, "grammar_point": null, "explanation": "文脈：細菌感染への意識が高まり、黒い服から白衣に変わった理由を選ぶ。\n① 염색하기 편하게(染色しやすいように): 染色のしやすさについての記述は本文になく無関係。\n② 환자와 구분이 되도록(患者と見分けがつくように): 区別の目的についての記述は本文になく無関係。\n③ 오염이 쉽게 눈에 띄도록(汚れがすぐ目につくように): 直前の「검은색 옷은…얼룩이 잘 보이지 않았다」という問題点の裏返しとして自然につながり正解。\n④ 밝은 이미지를 줄 수 있게(明るいイメージを与えられるように): イメージ戦略の話は本文になく、衛生上の理由が中心のため合わない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [28~31] （　）に入る最も適切な言葉を選びなさい。（各2点）", "passage_ja": "医者の姿を思い浮かべると、私たちは普通、白衣を思い出す。しかし、医者のガウンが最初から白かったわけではない。中世には聖職者が医者を兼ねる場合が多く、聖職者用の黒いガウンを着て診療を行っていた。ところが、黒い服は細菌による汚れが目立ちにくかった。その後、細菌感染の危険性に対する認識が高まるにつれて、（　）ガウンの色が白に変わった。", "question_text_ja": null, "choices_ja": ["染色しやすいように", "患者と見分けがつくように", "汚れがすぐ目につくように", "明るいイメージを与えられるように"]}, {"id": "91-32", "round": 91, "source": "제91회 읽기 32번", "number": 32, "instruction": "※ [32~34] 다음을 읽고 글의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "당뇨 환자들을 위해 고추 품종인 '살리초'가 개발되었다. 고추는 보통 열매를 얻기 위해 재배하지만 살리초는 열매가 없고 잎을 먹는 품종이다. 일반 고추에 비해 혈당을 낮추는 성분이 10배 이상 많이 함유돼 있어 당뇨병, 비만증 등 성인병의 예방과 치료에 이용될 수 있다. 또한 살리초에는 칼슘, 비타민 등 각종 영양 성분이 풍부하다. 병해충에도 강하고 생육 기간도 짧아서 농가의 고소득 작물로 주목받고 있다.", "question_text": null, "choices": ["살리초는 해충에 취약하다는 단점이 있다.", "살리초의 열매는 크고 영양 성분이 풍부하다.", "살리초는 생육 기간이 길어 관심을 받지 못하고 있다.", "살리초의 잎에는 혈당을 떨어뜨리는 성분이 들어 있다."], "answer": 4, "grammar_point": null, "explanation": "①「병해충에도 강하고(病害虫にも強く)」とあり、弱いというのは誤り。②サルリチョは「열매가 없고 잎을 먹는 품종(実がなく葉を食べる品種)」であり、実が大きいという記述自体が誤り。③「생육 기간도 짧아서…주목받고 있다」とあり、長くて関心を集められないというのは正反対で誤り。④「일반 고추에 비해 혈당을 낮추는 성분이 10배 이상」とあり、葉に血糖降下成分が含まれるという④が一致し正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [32~34] 次を読んで文章の内容と一致するものを選びなさい。（各2点）", "passage_ja": "糖尿病患者のために、唐辛子の品種「サルリチョ」が開発された。唐辛子は普通、実を収穫するために栽培するが、サルリチョは実をつけず、葉を食べる品種である。一般の唐辛子に比べて血糖値を下げる成分が10倍以上多く含まれており、糖尿病や肥満症など成人病の予防と治療に利用できる。また、サルリチョにはカルシウムやビタミンなど各種栄養成分が豊富である。病害虫にも強く生育期間も短いため、農家の高所得作物として注目されている。", "question_text_ja": null, "choices_ja": ["サルリチョは害虫に弱いという欠点がある。", "サルリチョの実は大きく栄養成分が豊富である。", "サルリチョは生育期間が長く、関心を集められずにいる。", "サルリチョの葉には血糖値を下げる成分が含まれている。"]}, {"id": "91-33", "round": 91, "source": "제91회 읽기 33번", "number": 33, "instruction": "※ [32~34] 다음을 읽고 글의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "『임원경제지』는 조선 시대 서유구가 쓴 백과사전이다. 선비가 시골에서 살아가는 데 필요한 지식을 탐색한 것으로 농업, 건축, 의학 등 16개 분야를 정리했다. 서유구는 이 책을 쓸 때 조선의 생활상을 직접 관찰하고 여러 서적들을 참고했으며 거기에 자신의 논평을 첨부했다. 이 과정에서 인용한 책들을 밝혀 놓아 서지학적 가치도 크다. 총 52권의 책을 편찬했는데 개인이 완성했다고 보기 어려울 만큼 방대하고 전문적인 지식이 담겨 있다.", "question_text": null, "choices": ["이 책은 각 분야의 전문가가 모여 만든 책이다.", "서유구는 집필하면서 참고한 문헌을 이 책에 기록해 놓았다.", "서유구는 객관적인 책을 쓰기 위해 자신의 의견은 배제했다.", "이 책은 내용이 특정 분야에 한정되어 서지학적 가치는 크지 않다."], "answer": 2, "grammar_point": null, "explanation": "①「개인이 완성했다고 보기 어려울 만큼(個人が完成させたとは思えないほど)」とあるのは、一人で書いたことへの驚きを表す表現であり、専門家集団が作ったわけではないため誤り。②「인용한 책들을 밝혀 놓아」という記述と一致し正解。③「자신의 논평을 첨부했다」とあり、自分の意見を排除したのではなく加えているため誤り。④「서지학적 가치도 크다」とあり、価値が小さいというのは正反対で誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [32~34] 次を読んで文章の内容と一致するものを選びなさい。（各2点）", "passage_ja": "『林園経済志』は朝鮮時代にソ・ユグが著した百科事典である。両班（知識人）が田舎で暮らしていく上で必要な知識を探求したもので、農業、建築、医学など16の分野をまとめている。ソ・ユグはこの本を書くにあたり、朝鮮の生活の様子を直接観察し、さまざまな書物を参考にしたうえで、そこに自身の論評を加えた。この過程で引用した書籍を明記しており、書誌学的価値も大きい。全52巻を編纂したが、個人が完成させたとは思えないほど膨大で専門的な知識が盛り込まれている。", "question_text_ja": null, "choices_ja": ["この本は各分野の専門家が集まって作った本である。", "ソ・ユグは執筆にあたって参考にした文献をこの本に記録しておいた。", "ソ・ユグは客観的な本を書くために自分の意見は排除した。", "この本は内容が特定の分野に限定されており、書誌学的価値は大きくない。"]}, {"id": "91-34", "round": 91, "source": "제91회 읽기 34번", "number": 34, "instruction": "※ [32~34] 다음을 읽고 글의 내용과 같은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "코알라는 유칼립투스라는 나뭇잎을 먹고 산다. 이 나뭇잎은 독성이 강해서 일반적인 동물들은 먹을 수 없다. 하지만 코알라는 유칼립투스의 독을 해독하는 효소가 있어서 다른 동물들과 경쟁할 필요 없이 유칼립투스 잎을 충분히 먹을 수 있다. 다만 새끼 코알라는 독성을 분해하는 효소가 없어서 유칼립투스 잎 대신 어미의 배설물을 먹는다. 이를 먹다 보면 새끼 코알라의 몸속에도 유칼립투스의 독을 해독하는 효소가 생기게 된다.", "question_text": null, "choices": ["다양한 동물들이 유칼립투스 잎을 차지하기 위해 경쟁한다.", "어미 코알라는 유칼립투스의 독성을 분해하는 효소를 가지고 있다.", "코알라는 태어난 직후부터 많은 양의 유칼립투스 나뭇잎을 먹는다.", "새끼 코알라는 유칼립투스의 독성 때문에 어미의 배설물을 먹지 않는다."], "answer": 2, "grammar_point": null, "explanation": "①コアラは解毒酵素を持つため「다른 동물들과 경쟁할 필요 없이」とあり、様々な動物が競争するという内容は誤り。②「코알라는…독을 해독하는 효소가 있어서」という記述が母コアラについての内容と一致し正解。③子コアラは解毒酵素がなく、生まれた直後はユーカリの葉ではなく母親の排泄物を食べるため誤り。④子コアラは毒性ゆえに「대신 어미의 배설물을 먹는다」とあり、むしろ排泄物を食べるため誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [32~34] 次を読んで文章の内容と一致するものを選びなさい。（各2点）", "passage_ja": "コアラはユーカリという木の葉を食べて生きている。この葉は毒性が強く、一般的な動物は食べることができない。しかしコアラはユーカリの毒を解毒する酵素を持っているため、他の動物と競争する必要なく、ユーカリの葉を十分に食べることができる。ただし、赤ちゃんコアラは毒性を分解する酵素を持っていないため、ユーカリの葉の代わりに母親の排泄物を食べる。これを食べているうちに、赤ちゃんコアラの体内にもユーカリの毒を解毒する酵素ができてくる。", "question_text_ja": null, "choices_ja": ["さまざまな動物がユーカリの葉を得るために競争する。", "母親コアラはユーカリの毒性を分解する酵素を持っている。", "コアラは生まれた直後から大量のユーカリの葉を食べる。", "赤ちゃんコアラはユーカリの毒性のため、母親の排泄物を食べない。"]}, {"id": "91-35", "round": 91, "source": "제91회 읽기 35번", "number": 35, "instruction": "※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "태양계에 존재하는 수많은 소행성에는 천문학적인 가치를 지닌 광물이 있는 것으로 예상된다. 그래서 많은 나라들이 이에 관심을 가지고 있다. 실제로 최근 몇몇 국가에서는 소행성에 있는 광물 시료를 채취하는 데 성공하기도 했다. 하지만 대부분의 나라들에서는 소행성 탐사가 아직 논의 단계에 머무르고 있다. 미래 자원을 확보하기 위해서 적극적으로 소행성 탐사에 대한 투자와 기술 개발에 나설 필요가 있다.", "question_text": null, "choices": ["태양계에는 아직 발견되지 않은 소행성이 많이 존재한다.", "소행성에서 자원을 가져오는 것은 실현 가능성이 희박하다.", "소행성 탐사를 성공시키기 위해 국제 협력을 확대해야 한다.", "미래 자원 확보를 위해 소행성 탐사에 대한 노력을 기울여야 한다."], "answer": 4, "grammar_point": null, "explanation": "①未発見の小惑星についての記述はなく、本文の主題ではない。②実際に鉱物試料の採取に成功した国もあるとしており、実現可能性が低いという内容とは矛盾する。③国際協力についての言及はなく、本文は「투자와 기술 개발에 나설 필요가 있다」と各国の取り組みを述べている。④文末の「미래 자원을 확보하기 위해서…투자와 기술 개발에 나설 필요가 있다」と一致し、これが主題として正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [35~38] 次を読んで文章の主題として最も適切なものを選びなさい。（各2点）", "passage_ja": "太陽系に存在する数多くの小惑星には、天文学的な価値を持つ鉱物があると予想されている。そのため、多くの国がこれに関心を寄せている。実際、最近いくつかの国では小惑星の鉱物試料の採取に成功したこともある。しかし、大半の国では小惑星探査はまだ議論の段階にとどまっている。将来の資源を確保するために、積極的に小惑星探査への投資と技術開発に乗り出す必要がある。", "question_text_ja": null, "choices_ja": ["太陽系にはまだ発見されていない小惑星が数多く存在する。", "小惑星から資源を持ち帰ることは実現可能性が低い。", "小惑星探査を成功させるために国際協力を拡大すべきである。", "将来の資源確保のために小惑星探査への取り組みに力を注ぐべきである。"]}, {"id": "91-36", "round": 91, "source": "제91회 읽기 36번", "number": 36, "instruction": "※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "경기 침체에 빠지면 사람들은 소비보다는 저축을 늘리려고 한다. 그런데 저축이 언제나 긍정적인 것만은 아니다. 소비가 줄면 기업의 매출이 감소해서 생산과 고용이 줄 수밖에 없고 결국 근로자들의 소득도 줄어들게 된다. 그러면 미래가 불확실해진 사람들이 더욱 소비를 줄여 전체 경기가 다시 침체에 빠지는 악순환이 되풀이된다. 개인 차원에서는 저축이 합리적인 행동이지만 경제 전체적으로는 비합리적인 상황을 초래하게 되는 것이다.", "question_text": null, "choices": ["불경기에는 비합리적인 소비로 인해 근로자들의 저축이 줄어든다.", "경기가 침체하면 개인의 소득이 줄어들지 않도록 투자를 늘려야 한다.", "경제 상황을 고려해서 생산과 고용을 적절히 조절하는 것이 중요하다.", "경기 침체 시에는 저축이 국가 경제 전체에 부정적 영향을 줄 수 있다."], "answer": 4, "grammar_point": null, "explanation": "①本文は「불합리한 소비」ではなく貯蓄の増加による悪循環を扱っており、内容が異なる。②「투자를 늘려야 한다」という提言は本文になく無関係。③生産・雇用の調整についての提言はなく、本文の焦点は貯蓄が招く逆説的な悪影響。④「개인 차원에서는…경제 전체적으로는 비합리적인 상황을 초래」という結論と一致し、これが主題として正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [35~38] 次を読んで文章の主題として最も適切なものを選びなさい。（各2点）", "passage_ja": "景気が後退すると、人々は消費よりも貯蓄を増やそうとする。しかし、貯蓄が常に良いことだとは限らない。消費が減れば企業の売上が減少し、生産と雇用も減らざるを得なくなり、結局は労働者の所得も減ってしまう。すると、将来が不安になった人々がさらに消費を減らし、景気全体が再び後退に陥るという悪循環が繰り返される。個人のレベルでは貯蓄は合理的な行動だが、経済全体で見ると不合理な状況を招くことになるのである。", "question_text_ja": null, "choices_ja": ["不景気には、不合理な消費によって労働者の貯蓄が減る。", "景気が後退したら、個人の所得が減らないように投資を増やすべきである。", "経済状況を考慮して生産と雇用を適切に調整することが重要である。", "景気後退時には、貯蓄が国の経済全体に悪影響を及ぼしうる。"]}, {"id": "91-37", "round": 91, "source": "제91회 읽기 37번", "number": 37, "instruction": "※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "참치 쿼터제는 참치의 무분별한 포획을 막기 위해 어획량을 국가별로 정해 놓은 제도이다. 한국은 참치 어획량이 매우 적게 배정돼 있는데 이는 한국 연안에서는 참치가 거의 잡히지 않았기 때문이다. 최근 수온이 상승함에 따라 한국 연안에 유입되는 참치가 급격히 늘어나고 있지만 쿼터제 때문에 그물에 걸린 참치를 대부분 바다에 버리고 있다. 쿼터제의 필요성은 인정하지만 국가별 개체 수 증감을 반영한 융통성 있는 조정이 필요하다.", "question_text": null, "choices": ["국가별 상황에 따라 참치 쿼터제를 현실에 맞게 수정해야 한다.", "참치의 무분별한 포획을 방지하기 위해 쿼터제를 도입해야 한다.", "수온 상승으로부터 참치를 보호하기 위한 대책을 마련해야 한다.", "참치의 유입량을 늘리기 위한 실질적인 연구가 이루어져야 한다."], "answer": 1, "grammar_point": null, "explanation": "①最後の文「쿼터제의 필요성은 인정하지만…융통성 있는 조정이 필요하다」と一致し、これが主題として正解。②クォータ制はすでに導入済みの制度であり、「도입해야 한다」という提言は本文の趣旨に合わない。③水温上昇はマグロの流入量を増やす要因として述べられており、マグロを保護する対策の話ではない。④マグロの流入量を増やす研究についての言及はなく無関係。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [35~38] 次を読んで文章の主題として最も適切なものを選びなさい。（各2点）", "passage_ja": "マグロ割当制は、マグロの無分別な乱獲を防ぐために漁獲量を国別に定めておく制度である。韓国はマグロの漁獲量が非常に少なく割り当てられているが、これは韓国沿岸ではマグロがほとんど獲れなかったためである。最近、水温の上昇に伴い韓国沿岸に流入するマグロが急激に増えているが、割当制のせいで網にかかったマグロの大半を海に捨てている。割当制の必要性は認めるが、国別の個体数の増減を反映した柔軟な調整が必要である。", "question_text_ja": null, "choices_ja": ["国別の状況に応じてマグロ割当制を現実に合わせて修正すべきである。", "マグロの無分別な乱獲を防ぐために割当制を導入すべきである。", "水温上昇からマグロを保護するための対策を講じるべきである。", "マグロの流入量を増やすための実質的な研究が行われるべきである。"]}, {"id": "91-38", "round": 91, "source": "제91회 읽기 38번", "number": 38, "instruction": "※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "기업들은 기술 혁신을 통해 고객에게 편의와 혜택을 제공하려고 한다. 하지만 아무리 획기적인 혁신이라도 고객에게 낯설고 커다란 행동 변화를 요구한다면 외면당하기 쉽다. 예를 들어 초창기 전기 자동차는 전기로 오래 충전을 해야 하는 것이 낯설고 불편해서 큰 관심을 끌지 못했다. 반대로 전자 칠판과 전자 펜처럼 대단한 혁신은 아니지만 사용하는 방법이 고객에게 익숙하고 간단해서 환영받는 경우도 있다.", "question_text": null, "choices": ["고객들의 무리한 요구 때문에 기술 혁신에 어려움을 겪게 된다.", "혁신적인 기업은 고객들에게 신기술의 사용 방법을 잘 설명해 준다.", "기술 혁신에 실패한 기업은 자연스럽게 고객들의 외면을 받게 된다.", "기술 혁신은 고객이 쉽게 받아들일 수 있을 때 성공할 가능성이 높다."], "answer": 4, "grammar_point": null, "explanation": "①顧客の無理な要求が技術革新を妨げるという因果関係は本文になく、本文はむしろ企業側が求める変化の大きさを問題にしている。②使用法の説明についての言及はなく無関係。③「혁신에 실패한 기업」という表現は本文になく、成功・失敗そのものではなく変化の大きさが受容の鍵だという話。④「낯설고 커다란 행동 변화를 요구한다면 외면당하기 쉽다」の裏返しとして、受け入れやすい革新ほど成功しやすいという④が主題として正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [35~38] 次を読んで文章の主題として最も適切なものを選びなさい。（各2点）", "passage_ja": "企業は技術革新を通じて顧客に利便性と恩恵を提供しようとする。しかし、どれほど画期的な革新であっても、顧客にとって不慣れで大きな行動の変化を要求するものであれば、敬遠されやすい。例えば、初期の電気自動車は、電気で長時間充電しなければならないことが不慣れで不便だったため、大きな関心を集められなかった。逆に、電子黒板や電子ペンのように、それほど大した革新ではなくても、使い方が顧客にとって馴染みやすく簡単なため歓迎される場合もある。", "question_text_ja": null, "choices_ja": ["顧客の無理な要求のせいで技術革新が困難になる。", "革新的な企業は顧客に新技術の使い方をしっかり説明してくれる。", "技術革新に失敗した企業は自然と顧客に見放されるようになる。", "技術革新は、顧客が容易に受け入れられるものであるほど成功する可能性が高い。"]}, {"id": "91-39", "round": 91, "source": "제91회 읽기 39번", "number": 39, "instruction": "※ [39~41] 주어진 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "스포츠 경기를 진행할 때 득점이나 반칙 등의 판정은 심판에 의해서 이루어진다. (㉠) 이렇게 눈에 보이지 않는 곳에서 벌어진 상황에 대해서는 심판도 정확한 판단을 하기 어렵다. (㉡) 비디오 판독은 이런 스포츠 경기에서 초고속 카메라를 판정의 근거로 사용하는 기술이다. (㉢) 이처럼 비디오 판독을 활용하면 심판이 판단하기 어려운 부분을 객관적으로 확인할 수 있어 판정에 대한 신뢰도를 높일 수 있다. (㉣)", "question_text": "그런데 심판이 아무리 위치 선정을 잘해도 필연적으로 선수의 몸에 가려서 볼 수 없는 사각지대가 생긴다.", "choices": ["㉠", "㉡", "㉢", "㉣"], "answer": 1, "grammar_point": null, "explanation": "挿入文「그런데 심판이 아무리 위치 선정을 잘해도 필연적으로 선수의 몸에 가려서 볼 수 없는 사각지대가 생긴다(審判がどんなに位置取りを良くしても選手の体に隠れる死角が生じる)」は、審判が判定を行うという最初の説明のすぐ後(㉠)に入れると、続く「이렇게 눈에 보이지 않는 곳에서 벌어진 상황(このように目に見えない場所で起きた状況)」の「이렇게」が指す内容として自然につながる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [39~41] 与えられた文が入る位置として最も適切なところを選びなさい。（各2点）", "passage_ja": "スポーツの試合を進行する際、得点や反則などの判定は審判によって行われる。（㉠）このように目に見えないところで起きた状況については、審判も正確な判断を下すのが難しい。（㉡）ビデオ判定は、こうしたスポーツの試合で超高速カメラを判定の根拠として使う技術である。（㉢）このようにビデオ判定を活用すれば、審判が判断しにくい部分を客観的に確認できるため、判定への信頼性を高めることができる。（㉣）", "question_text_ja": "ところが、審判がどんなに位置取りをうまくしても、必然的に選手の体に隠れて見えない死角が生じる。", "choices_ja": ["㉠", "㉡", "㉢", "㉣"]}, {"id": "91-40", "round": 91, "source": "제91회 읽기 40번", "number": 40, "instruction": "※ [39~41] 주어진 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "유럽과 아시아, 아프리카 대륙으로 둘러싸인 바다를 지중해라고 한다. (㉠) 오늘날 지중해 연안은 기후가 온화해서 살기 좋은 곳으로 손꼽힌다. (㉡) 그런데 지중해는 오래전 사막이었던 적이 있었다. (㉢) 이 소금 퇴적층은 바닷물이 증발되고 남은 소금이 쌓여 만들어진 것으로 지중해가 이전에는 사막이었음을 보여 준다. (㉣) 사막이었던 지중해에 이후 큰 홍수가 발생하면서 다시 오늘날과 같은 바다가 되었다.", "question_text": "그 증거로 지중해 전역에서 발견되고 있는 소금 퇴적층을 들 수 있다.", "choices": ["㉠", "㉡", "㉢", "㉣"], "answer": 3, "grammar_point": null, "explanation": "挿入文「그 증거로…소금 퇴적층을 들 수 있다(その証拠として塩の堆積層が挙げられる)」は、「지중해는 오래전 사막이었던 적이 있었다(地中海はかつて砂漠だった)」という主張の直後(㉢)に入れると、続く「이 소금 퇴적층은(この塩の堆積層は)」という指示語が指す先行内容として自然につながる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [39~41] 与えられた文が入る位置として最も適切なところを選びなさい。（各2点）", "passage_ja": "ヨーロッパ、アジア、アフリカ大陸に囲まれた海を地中海という。（㉠）今日、地中海沿岸は気候が温暖で暮らしやすい場所として知られている。（㉡）ところが、地中海は大昔、砂漠だったことがある。（㉢）この塩の堆積層は、海水が蒸発した後に残った塩が積もってできたもので、地中海がかつて砂漠であったことを示している。（㉣）砂漠だった地中海は、その後大洪水が発生して再び今日のような海になった。", "question_text_ja": "その証拠として、地中海全域で発見されている塩の堆積層が挙げられる。", "choices_ja": ["㉠", "㉡", "㉢", "㉣"]}, {"id": "91-41", "round": 91, "source": "제91회 읽기 41번", "number": 41, "instruction": "※ [39~41] 주어진 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오. (각 2점)", "passage_group": null, "passage": "최근 역사학자 김경민 씨가 『응답하라, 조선』을 펴냈다. (㉠) 이 책은 왕과 신하의 소통을 다루고 있어 사람들의 관심을 끈다. (㉡) 그 소통의 내용 중에서 특히 왕의 노여움을 무릅쓰고 신하가 왕의 잘못을 지적한 상소문을 다룬 부분이 주목받고 있다. (㉢) 『응답하라, 조선』은 눈치를 살피며 윗사람의 잘못을 모르는 체 넘기곤 하는 현대인들을 깨우는 죽비인 것이다. (㉣)", "question_text": "이런 상소문들을 저자는 왕을 향한 깨우침의 죽비 소리로 비유하고 있다.", "choices": ["㉠", "㉡", "㉢", "㉣"], "answer": 3, "grammar_point": null, "explanation": "挿入文「이런 상소문들을 저자는…죽비 소리로 비유하고 있다(著者はこれらの上訴文を…警策の音にたとえている)」は、王への上訴文について述べた部分の直後(㉢)に入れると、次に続く「『응답하라, 조선』은…죽비인 것이다」という文が、挿入文で述べた比喩を本全体の評価として引き継ぐ形で自然につながる。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [39~41] 与えられた文が入る位置として最も適切なところを選びなさい。（各2点）", "passage_ja": "最近、歴史学者キム・ギョンミン氏が『応答せよ、朝鮮』を出版した。（㉠）この本は王と臣下のコミュニケーションを扱っており、人々の関心を集めている。（㉡）そのやり取りの内容の中でも、特に王の怒りを恐れず臣下が王の過ちを指摘した上訴文を扱った部分が注目を集めている。（㉢）『応答せよ、朝鮮』は、上司の顔色をうかがいながら目上の人の過ちを見て見ぬふりをしがちな現代人を目覚めさせる警策なのである。（㉣）", "question_text_ja": "こうした上訴文を、著者は王への戒めとなる警策の音にたとえている。", "choices_ja": ["㉠", "㉡", "㉢", "㉣"]}, {"id": "91-42", "round": 91, "source": "제91회 읽기 42번", "number": 42, "instruction": "※ [42~43] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "42-43", "passage": "민욱이 주말에 친구 부부를 초대해도 되느냐고 물었을 때, 미연은 말없이 한참 뜸을 들였다. 그녀는 그날 민욱과 함께 아파트의 발코니 벽을 페인트칠할 계획이었다. (중략) 그들은 육 개월 전에 E시의 아파트를 사서 이사했다. 지은 지 이십 년도 더 된 낡은 아파트였지만, 누구의 도움도 받지 않고 그들 스스로 이룬 일이었다. 미연은 직접 발품을 팔아 수도부터 새시까지 새로 손을 보았다. 하지만 집수리는 대강 되었다고 해도, 미연이 생각해 둔 대로 인테리어가 완성되려면 아직 부족했다.\n\"손님 초대는 좀 이르지 않아? 집 단장도 덜 되었는데……\"\n\"성재가 한국에 왔대.\"\n민욱이 무거운 목소리로 말했다. (중략)\n민욱과 성재는 고등학교 동창이고, 그들을 통해 만난 미연과 연주도 십여 년이 넘는 인연이었다. 꽤나 가까운 사이였지만 성재가 사업 실패로 한국을 떠나면서 연락이 끊겼다. 미연은 자신이 연주의 이름을 오랫동안 잊고 있었다는 사실을 깨달았다. 더 이상 뭐라고 할 말이 없었다. (중략)\n토요일 오전에 미연은 두 딸아이를 데리고 마트에 가서 고기와 채소를 샀다. 누군가를 초대해 음식을 대접하는 것이 정말로 오랜만이었다.", "question_text": "밑줄 친 부분에 나타난 '미연'의 심정으로 가장 알맞은 것을 고르십시오.", "choices": ["후련하다", "불만스럽다", "허전하다", "자랑스럽다"], "answer": 2, "grammar_point": null, "explanation": "下線部「말없이 한참 뜸을 들였다(黙ってしばらく間を置いた)」は、家の飾り付けがまだ整っていないのに客を招いていいか聞かれたことへの反応。\n① 후련하다(すっきりする): 悩みが解消した爽快感を表す語で、この場面の反応とは逆。\n② 불만스럽다(不満げだ): 直後のセリフ「손님 초대는 좀 이르지 않아?(お客さんを招くのはちょっと早くない?)」という不満げな発言と一致し正解。\n③ 허전하다(もの寂しい): 何かが欠けた寂しさを表す語で、この場面の状況とは合わない。\n④ 자랑스럽다(誇らしい): 肯定的な誇りの感情で、間を置いて言い渋る態度とは逆。", "underline_field": "passage", "underline_ko": "말없이 한참 뜸을 들였다", "underline_ja": "黙ってしばらく間を置いた", "instruction_ja": "※ [42~43] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "ミヌクが週末に友人夫婦を招待してもいいかと尋ねたとき、ミヨンは黙ってしばらく間を置いた。彼女はその日、ミヌクと一緒にマンションのベランダの壁にペンキを塗る予定だった。（中略）彼らは半年前にE市のマンションを購入して引っ越してきた。築20年を優に超える古いマンションだったが、誰の助けも借りず自分たちの力だけで手に入れたものだった。ミヨンは自ら足を運んで、水道からサッシまで一から手を入れた。しかし、家の修理はおおよそ済んだとはいえ、ミヨンが思い描いていたとおりにインテリアが仕上がるにはまだ足りなかった。\n「お客さんを招くのはちょっと早くない？部屋の飾り付けもまだなのに……」\n「ソンジェが韓国に来たって」\nミヌクが重い声で言った。（中略）\nミヌクとソンジェは高校の同級生で、彼らを通じて出会ったミヨンとヨンジュも十年以上の付き合いだった。かなり親しい間柄だったが、ソンジェが事業に失敗して韓国を離れてから連絡が途絶えていた。ミヨンは、自分がヨンジュの名前を長い間忘れていたことに気づいた。もう何も言うことがなかった。（中略）\n土曜日の午前中、ミヨンは二人の娘を連れてスーパーへ行き、肉と野菜を買った。誰かを招いて食事をふるまうのは、本当に久しぶりのことだった。", "question_text_ja": "下線を引いた部分に表れている「ミヨン」の心情として最も適切なものを選びなさい。", "choices_ja": ["すっきりする", "不満げだ", "もの寂しい", "誇らしい"]}, {"id": "91-43", "round": 91, "source": "제91회 읽기 43번", "number": 43, "instruction": "※ [42~43] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "42-43", "passage": "민욱이 주말에 친구 부부를 초대해도 되느냐고 물었을 때, 미연은 말없이 한참 뜸을 들였다. 그녀는 그날 민욱과 함께 아파트의 발코니 벽을 페인트칠할 계획이었다. (중략) 그들은 육 개월 전에 E시의 아파트를 사서 이사했다. 지은 지 이십 년도 더 된 낡은 아파트였지만, 누구의 도움도 받지 않고 그들 스스로 이룬 일이었다. 미연은 직접 발품을 팔아 수도부터 새시까지 새로 손을 보았다. 하지만 집수리는 대강 되었다고 해도, 미연이 생각해 둔 대로 인테리어가 완성되려면 아직 부족했다.\n\"손님 초대는 좀 이르지 않아? 집 단장도 덜 되었는데……\"\n\"성재가 한국에 왔대.\"\n민욱이 무거운 목소리로 말했다. (중략)\n민욱과 성재는 고등학교 동창이고, 그들을 통해 만난 미연과 연주도 십여 년이 넘는 인연이었다. 꽤나 가까운 사이였지만 성재가 사업 실패로 한국을 떠나면서 연락이 끊겼다. 미연은 자신이 연주의 이름을 오랫동안 잊고 있었다는 사실을 깨달았다. 더 이상 뭐라고 할 말이 없었다. (중략)\n토요일 오전에 미연은 두 딸아이를 데리고 마트에 가서 고기와 채소를 샀다. 누군가를 초대해 음식을 대접하는 것이 정말로 오랜만이었다.", "question_text": "윗글의 내용으로 알 수 있는 것을 고르십시오.", "choices": ["미연은 민욱과 성재를 통해 연주를 알게 되었다.", "민욱은 주변 도움을 받아 E시의 새 아파트를 샀다.", "미연은 육 개월 전에 산 아파트로 이사 갈 계획이다.", "민욱은 인테리어를 완성한 후에 마트에 장을 보러 갔다."], "answer": 1, "grammar_point": null, "explanation": "①「민욱과 성재는…그들을 통해 만난 미연과 연주도(ミヌクとソンジェを通じて出会ったミヨンとヨンジュも)」という記述と一致し正解。②「누구의 도움도 받지 않고 그들 스스로 이룬 일(誰の助けも借りず自分たちの力で成し遂げた)」とあり、周囲の助けを借りたというのは誤り。③「육 개월 전에…이사했다(半年前に引っ越した)」とすでに引っ越し済みであり、これから引っ越す計画ではないため誤り。④マートへ行ったのはミヌクではなくミヨンであり、インテリアも「아직 부족했다(まだ足りなかった)」段階なので誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [42~43] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "ミヌクが週末に友人夫婦を招待してもいいかと尋ねたとき、ミヨンは黙ってしばらく間を置いた。彼女はその日、ミヌクと一緒にマンションのベランダの壁にペンキを塗る予定だった。（中略）彼らは半年前にE市のマンションを購入して引っ越してきた。築20年を優に超える古いマンションだったが、誰の助けも借りず自分たちの力だけで手に入れたものだった。ミヨンは自ら足を運んで、水道からサッシまで一から手を入れた。しかし、家の修理はおおよそ済んだとはいえ、ミヨンが思い描いていたとおりにインテリアが仕上がるにはまだ足りなかった。\n「お客さんを招くのはちょっと早くない？部屋の飾り付けもまだなのに……」\n「ソンジェが韓国に来たって」\nミヌクが重い声で言った。（中略）\nミヌクとソンジェは高校の同級生で、彼らを通じて出会ったミヨンとヨンジュも十年以上の付き合いだった。かなり親しい間柄だったが、ソンジェが事業に失敗して韓国を離れてから連絡が途絶えていた。ミヨンは、自分がヨンジュの名前を長い間忘れていたことに気づいた。もう何も言うことがなかった。（中略）\n土曜日の午前中、ミヨンは二人の娘を連れてスーパーへ行き、肉と野菜を買った。誰かを招いて食事をふるまうのは、本当に久しぶりのことだった。", "question_text_ja": "上の文章の内容から分かることを選びなさい。", "choices_ja": ["ミヨンはミヌクとソンジェを通じてヨンジュを知るようになった。", "ミヌクは周囲の助けを借りてE市の新しいマンションを買った。", "ミヨンは半年前に買ったマンションへ引っ越す予定である。", "ミヌクはインテリアを完成させた後、スーパーへ買い物に行った。"]}, {"id": "91-44", "round": 91, "source": "제91회 읽기 44번", "number": 44, "instruction": "※ [44~45] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "44-45", "passage": "'수로왕 신화'는 왕이 알에서 탄생하는 여느 건국 신화와 유사하다. 고대에 아직 나라가 없던 낙동강 하류에 황금알 여섯 개가 하늘에서 내려왔다. 그중 맨 먼저 알을 깨고 나온 아이를 '수로'라 하였고 하늘의 뜻에 따라 수로는 지상의 첫 번째 왕이 되었다. ( ) 다섯 아이 역시 각각 왕이 되었다. 수로왕 신화는 이렇게 한꺼번에 여섯 개 알이 나타나 거기서 태어난 이가 모두 왕이 된다는 점에서 다른 건국 신화와 큰 차이가 있다. 당시 세워진 여섯 나라는 강력한 왕권 국가가 아니었다. 황금알은 하늘로부터 부여받은 절대적 권위를 상징하는데 수로가 알에서 최초로 탄생했다는 부분은 수로왕이 중심이 되어 여섯 나라를 하나의 강력한 국가 '가야'로 통합하려 했다는 것을 말해 준다.", "question_text": "( )에 들어갈 말로 가장 알맞은 것을 고르십시오.", "choices": ["알을 가지고 내려온", "기존의 왕을 물리치고", "수로에 이어 알에서 태어난", "탄생을 축하하며 몹시 기뻐하던"], "answer": 3, "grammar_point": null, "explanation": "文脈：先に首露が卵から生まれ王になったのに続き、残り5人がどうなったかを述べる部分。\n① 알을 가지고 내려온(卵を持って降りてきた): 卵はすでに天から降りてきており、5人の子が卵を「持って」来たという内容は流れと矛盾する。\n② 기존의 왕을 물리치고(既存の王を退けて): 当時はまだ王がいなかった建国神話であり、既存の王を倒す話は本文にない。\n③ 수로에 이어 알에서 태어난(首露に続いて卵から生まれた): 直後の「다섯 아이 역시 각각 왕이 되었다」に自然につながり、六つの卵から生まれた者が皆王になるという文全体の趣旨とも一致し正解。\n④ 탄생을 축하하며 몹시 기뻐하던(誕生を祝って喜んでいた): 誰が誰を祝うのかが不明瞭で、本文の主眼は卵から生まれた点にあり祝賀の話ではない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [44~45] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "「首露王神話」は、王が卵から生まれるという点で他の建国神話とよく似ている。古代、まだ国がなかった洛東江下流に、六個の金の卵が天から降りてきた。その中で最初に卵を割って出てきた子を「首露」と名付け、天の意志に従って首露は地上で最初の王となった。（　）残りの五人の子もそれぞれ王になった。首露王神話は、このように一度に六つの卵が現れ、そこから生まれた者が皆王になるという点で、他の建国神話と大きく異なる。当時建てられた六つの国は、強力な王権国家ではなかった。金の卵は天から授けられた絶対的な権威を象徴しており、首露が卵から最初に生まれたという部分は、首露王を中心に六つの国を一つの強力な国家「加耶」に統合しようとしたことを物語っている。", "question_text_ja": "（　）に入る最も適切な言葉を選びなさい。", "choices_ja": ["卵を持って降りてきた", "既存の王を退けて", "首露に続いて卵から生まれた", "誕生を祝ってひどく喜んでいた"]}, {"id": "91-45", "round": 91, "source": "제91회 읽기 45번", "number": 45, "instruction": "※ [44~45] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "44-45", "passage": "'수로왕 신화'는 왕이 알에서 탄생하는 여느 건국 신화와 유사하다. 고대에 아직 나라가 없던 낙동강 하류에 황금알 여섯 개가 하늘에서 내려왔다. 그중 맨 먼저 알을 깨고 나온 아이를 '수로'라 하였고 하늘의 뜻에 따라 수로는 지상의 첫 번째 왕이 되었다. ( ) 다섯 아이 역시 각각 왕이 되었다. 수로왕 신화는 이렇게 한꺼번에 여섯 개 알이 나타나 거기서 태어난 이가 모두 왕이 된다는 점에서 다른 건국 신화와 큰 차이가 있다. 당시 세워진 여섯 나라는 강력한 왕권 국가가 아니었다. 황금알은 하늘로부터 부여받은 절대적 권위를 상징하는데 수로가 알에서 최초로 탄생했다는 부분은 수로왕이 중심이 되어 여섯 나라를 하나의 강력한 국가 '가야'로 통합하려 했다는 것을 말해 준다.", "question_text": "윗글의 주제로 가장 알맞은 것을 고르십시오.", "choices": ["이 신화는 전형적인 건국 신화의 특성을 지니고 있다.", "이 신화는 낙동강 일대의 유용한 지리적 정보를 담고 있다.", "이 신화는 고대의 문학 작품으로서 훌륭한 가치를 지니고 있다.", "이 신화는 강력한 왕권 국가를 이루려고 한 통합 의식을 반영한다."], "answer": 4, "grammar_point": null, "explanation": "①本文は「다른 건국 신화와 큰 차이가 있다(他の建国神話と大きな違いがある)」と特異性を強調しており、典型的だという内容とは矛盾する。②洛東江一帯の地理情報についての言及はなく無関係。③文学作品としての価値についての評価は本文になく無関係。④「여섯 나라를 하나의 강력한 국가 '가야'로 통합하려 했다는 것을 말해 준다」という結論と一致し、これが主題として正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [44~45] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "「首露王神話」は、王が卵から生まれるという点で他の建国神話とよく似ている。古代、まだ国がなかった洛東江下流に、六個の金の卵が天から降りてきた。その中で最初に卵を割って出てきた子を「首露」と名付け、天の意志に従って首露は地上で最初の王となった。（　）残りの五人の子もそれぞれ王になった。首露王神話は、このように一度に六つの卵が現れ、そこから生まれた者が皆王になるという点で、他の建国神話と大きく異なる。当時建てられた六つの国は、強力な王権国家ではなかった。金の卵は天から授けられた絶対的な権威を象徴しており、首露が卵から最初に生まれたという部分は、首露王を中心に六つの国を一つの強力な国家「加耶」に統合しようとしたことを物語っている。", "question_text_ja": "上の文章の主題として最も適切なものを選びなさい。", "choices_ja": ["この神話は典型的な建国神話の特徴を持っている。", "この神話は洛東江一帯の有用な地理的情報を含んでいる。", "この神話は古代の文学作品として優れた価値を持っている。", "この神話は、強力な王権国家を築こうとした統合の意識を反映している。"]}, {"id": "91-46", "round": 91, "source": "제91회 읽기 46번", "number": 46, "instruction": "※ [46~47] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "46-47", "passage": "주가 조작이나 공금 횡령 등의 경제 범죄는 사람에게 직접적인 상해를 가하는 흉악 범죄보다 범죄 정도가 낮다고 생각하기 쉽다. 그러나 경제 범죄의 수법이 날이 갈수록 다양해지고 지능화되어 사회에 미치는 충격과 피해가 막심하다. 최근 증권사 직원의 주가 조작으로 고객들이 천억 넘게 손해 본 사건만 해도 그렇다. 이러한 경제 범죄는 개인 손해를 넘어 국가 경제와도 직결될 수 있다. 따라서 이를 가벼이 여겨서는 안 되며 관대하게 처벌해서도 안 된다. 건전한 경제 질서를 확립하기 위해 경제 사범을 엄벌할 필요가 있다. '한탕 크게 해 먹고 몸으로 때우면 된다'는 한탕주의가 만연하지 않도록 처벌 수준을 더 높여야 한다. 지금까지 미진했던 부당 이익 환수도 앞으로 잘 이루어져 경제 범죄가 재발되지 않도록 해야 할 것이다.", "question_text": "윗글에 나타난 필자의 태도로 가장 알맞은 것을 고르십시오.", "choices": ["경제 범죄가 사회에 미치는 영향을 부정하고 있다.", "경제 사범에 대한 처벌을 강화하도록 촉구하고 있다.", "경제 사범의 처벌로 생길 결과에 대해 우려하고 있다.", "경제 범죄의 다양한 수법을 객관적으로 분석하고 있다."], "answer": 2, "grammar_point": null, "explanation": "①本文は「사회에 미치는 충격과 피해가 막심하다」と経済犯罪の悪影響を強調しており、影響を否定してはいない。②「관대하게 처벌해서도 안 된다」「처벌 수준을 더 높여야 한다」という記述から、処罰強化を求める筆者の態度と一致し正解。③処罰によって生じる悪影響への懸念は本文になく無関係。④単なる客観的分析ではなく「엄벌할 필요가 있다」という筆者自身の強い主張を含む文章であるため合わない。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [46~47] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "株価操作や公金横領などの経済犯罪は、人に直接危害を加える凶悪犯罪よりも罪の程度が軽いと思われがちである。しかし、経済犯罪の手口は日を追うごとに多様化・巧妙化しており、社会に与える衝撃と被害は甚大である。最近、証券会社社員による株価操作で顧客が千億ウォン以上の損害を被った事件を見ても、それは明らかである。このような経済犯罪は、個人の損害にとどまらず国家経済にも直結しかねない。したがって、これを軽視してはならず、寛大に処罰してもならない。健全な経済秩序を確立するために、経済犯を厳罰に処す必要がある。「一発大きく稼いで、あとは体で償えばいい」という一攫千金主義がまん延しないよう、処罰の水準をさらに引き上げるべきである。これまで不十分だった不当利益の没収も今後しっかりと行われ、経済犯罪が再発しないようにしなければならない。", "question_text_ja": "上の文章に表れている筆者の態度として最も適切なものを選びなさい。", "choices_ja": ["経済犯罪が社会に与える影響を否定している。", "経済犯に対する処罰の強化を促している。", "経済犯を処罰した結果生じることについて懸念している。", "経済犯罪のさまざまな手口を客観的に分析している。"]}, {"id": "91-47", "round": 91, "source": "제91회 읽기 47번", "number": 47, "instruction": "※ [46~47] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "46-47", "passage": "주가 조작이나 공금 횡령 등의 경제 범죄는 사람에게 직접적인 상해를 가하는 흉악 범죄보다 범죄 정도가 낮다고 생각하기 쉽다. 그러나 경제 범죄의 수법이 날이 갈수록 다양해지고 지능화되어 사회에 미치는 충격과 피해가 막심하다. 최근 증권사 직원의 주가 조작으로 고객들이 천억 넘게 손해 본 사건만 해도 그렇다. 이러한 경제 범죄는 개인 손해를 넘어 국가 경제와도 직결될 수 있다. 따라서 이를 가벼이 여겨서는 안 되며 관대하게 처벌해서도 안 된다. 건전한 경제 질서를 확립하기 위해 경제 사범을 엄벌할 필요가 있다. '한탕 크게 해 먹고 몸으로 때우면 된다'는 한탕주의가 만연하지 않도록 처벌 수준을 더 높여야 한다. 지금까지 미진했던 부당 이익 환수도 앞으로 잘 이루어져 경제 범죄가 재발되지 않도록 해야 할 것이다.", "question_text": "윗글의 내용과 같은 것을 고르십시오.", "choices": ["경제 범죄로 생긴 부당 이익을 문제없이 잘 환수해 왔다.", "공금을 불법으로 가로채는 범죄는 경제 범죄에 포함된다.", "개인이 저지른 주가 조작 범죄는 국가 경제와 큰 관련이 없다.", "경제 범죄 수법이 교묘해졌지만 사회에 미치는 충격은 크지 않다."], "answer": 2, "grammar_point": null, "explanation": "①「지금까지 미진했던 부당 이익 환수(これまで不十分だった不当利益の没収)」とあり、うまく没収してきたというのは正反対で誤り。②本文冒頭「주가 조작이나 공금 횡령 등의 경제 범죄」という記述と一致し正解。③「개인 손해를 넘어 국가 경제와도 직결될 수 있다」とあり、関係がないというのは誤り。④「사회에 미치는 충격과 피해가 막심하다」とあり、衝撃が大きくないというのは正反対で誤り。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [46~47] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "株価操作や公金横領などの経済犯罪は、人に直接危害を加える凶悪犯罪よりも罪の程度が軽いと思われがちである。しかし、経済犯罪の手口は日を追うごとに多様化・巧妙化しており、社会に与える衝撃と被害は甚大である。最近、証券会社社員による株価操作で顧客が千億ウォン以上の損害を被った事件を見ても、それは明らかである。このような経済犯罪は、個人の損害にとどまらず国家経済にも直結しかねない。したがって、これを軽視してはならず、寛大に処罰してもならない。健全な経済秩序を確立するために、経済犯を厳罰に処す必要がある。「一発大きく稼いで、あとは体で償えばいい」という一攫千金主義がまん延しないよう、処罰の水準をさらに引き上げるべきである。これまで不十分だった不当利益の没収も今後しっかりと行われ、経済犯罪が再発しないようにしなければならない。", "question_text_ja": "上の文章の内容と一致するものを選びなさい。", "choices_ja": ["経済犯罪で生じた不当利益は、これまで問題なくしっかり没収されてきた。", "公金を不法に横領する犯罪は経済犯罪に含まれる。", "個人が行った株価操作犯罪は、国家経済とあまり関係がない。", "経済犯罪の手口は巧妙になったが、社会に与える衝撃は大きくない。"]}, {"id": "91-48", "round": 91, "source": "제91회 읽기 48번", "number": 48, "instruction": "※ [48~50] 다음을 읽고 물음에 답하십시오. (각 2점)", "passage_group": "48-50", "passage": "예술인은 독창적인 문화를 창조하고 고유한 문화를 보존하는 동시에 예술 활동을 업으로 삼아 수익을 내서 생활하는 사람이다. 그런데 많은 예술인이 기본 생활이 불가능한 적은 수입 탓에 예술 활동을 포기한다. 그 결과 예술인이 감소하며 고령화되는 현상이 나타나고 있다. 2011년에는 생활고로 한 작가가 사망하는 사건까지 일어났다. 이 사건이 계기가 되어 2012년부터 예술인의 권리 보호를 위해 '예술인 복지법'이 시행되었다. 그러나 이는 예술 현장의 실상에 맞지 않아 많은 예술인이 여전히 ( ). 이런 상황에서 올해 예술 활동을 증명하지 못해 지원을 못 받았던 예술인을 위해 예술인 복지법이 개정되었다. 개정안은 이런 예술인도 일반 직업인과 같이 권리를 보호받을 수 있는 대상임을 명확히 하고 있다. 또 예술인이 불리한 처우를 받지 않도록 세부 조치를 마련하는 등 예술인의 고용 안정을 위한 여러 내용을 담고 있다. 앞으로는 이를 바탕으로 유능한 예술인이 활동을 포기하지 않도록 해야 할 것이다.", "question_text": "윗글을 쓴 목적으로 가장 알맞은 것을 고르십시오.", "choices": ["예술인의 자질에 대해 분석하려고", "예술 발전의 어려움을 토로하려고", "예술 작품의 창작 활동을 설명하려고", "예술인 생활 보장의 필요성을 강조하려고"], "answer": 4, "grammar_point": null, "explanation": "①芸術家の資質を分析する内容ではなく無関係。②「예술 발전의 어려움」という芸術界全体の発展の困難さではなく、芸術家個人の生活問題に焦点を当てているためずれる。③創作活動そのものの説明ではなく、制度や生活保障についての文章。④生活苦による芸術活動の断念、法改正の経緯、今後の課題という文章全体の流れから、芸術人の生活保障の必要性を訴える④が目的として正解。", "underline_field": null, "underline_ko": null, "underline_ja": null, "instruction_ja": "※ [48~50] 次を読んで質問に答えなさい。（各2点）", "passage_ja": "芸術家は独創的な文化を創造し、固有の文化を保存すると同時に、芸術活動を職業として収益を得て生活する人である。しかし、多くの芸術家が基本的な生活さえ成り立たないほどの少ない収入のせいで、芸術活動を諦めている。その結果、芸術家が減少し高齢化する現象が現れている。2011年には、生活苦によりある作家が死亡する事件まで起きた。この事件がきっかけとなり、2012年から芸術家の権利保護のために「芸術人福祉法」が施行された。しかし、これは芸術の現場の実情に合っておらず、多くの芸術家が依然として（　）。こうした状況の中、今年、芸術活動を証明できずに支援を受けられなかった芸術家のために、芸術人福祉法が改正された。改正案は、このような芸術家も一般の職業人と同じように権利を保護される対象であることを明確にしている。また、芸術家が不利な扱いを受けないよう細部の措置を設けるなど、芸術家の雇用安定のためのさまざまな内容を盛り込んでいる。今後はこれをもとに、有能な芸術家が活動を諦めずに済むようにすべきである。", "question_text_ja": "上の文章を書いた目的として最も適切なものを選びなさい。", "choices_ja": ["芸術家の資質について分析するため", "芸術発展の難しさを訴えるため", "芸術作品の創作活動を説明するため", "芸術家の生活保障の必要性を強調するため"]}, {"id": "91-49", "round": 91, "source": "제 字の文章で書きなさい。ただし、タイトルは書かないこと。(30点)", "chart_data": ["조사 기관: 한국스포츠연구소", "인주시 마라톤 대회 참가자 수: 2013년 40만 명 → 2023년 100만 명 (2.5배 증가)", "연령별 참가자 수 변화: 20~30대 4배 증가 / 40~50대 1.3배 증가", "원인: 건강 관리에 대한 관심 증가로 달리기 문화 확산 / SNS를 통한 마라톤 모임 활성화로 20~30대 참가자 증가"], "chart_data_ja": ["調査機関: 韓国スポーツ研究所", "インジュ市マラソン大会参加者数: 2013年40万人 → 2023年100万人 (2.5倍増加)", "年齢別参加者数の変化: 20〜30代は4倍増加 / 40〜50代は1.3倍増加", "原因: 健康管理への関心の高まりでランニング文化が拡散 / SNSを通じたマラソン仲間作りの活性化で20〜30代の参加者が増加"], "word_count": "200~300자", "word_count_ja": "200〜300字", "model_answer": "한국스포츠연구소에서 인주시 마라톤 대회 참가자 수의 변화를 조사하였다. 그 결과 인주시 마라톤 대회 참가자 수는 2013년 40만 명에서 2023년 100만 명으로 2.5배 증가한 것으로 나타났다. 이를 연령별로 살펴보면 20~30대는 지난 10년간 4배 증가한 반면 40~50대는 같은 기간에 1.3배 증가하는 데에 그쳤다. 이러한 변화의 원인은 건강 관리에 대한 관심이 높아져 달리기 문화가 확산되었고 SNS를 통한 마라톤 모임이 활성화되어 20~30대 참가자가 증가하였기 때문인 것으로 보인다. (280자)", "model_answer_ja": "韓国スポーツ研究所がインジュ市マラソン大会の参加者数の変化を調査した。その結果、参加者数は2013年の40万人から2023年には100万人へと2.5倍に増加したことが分かった。年齢別に見ると、20〜30代はこの10年で4倍に増加した一方、40〜50代は同期間に1.3倍の増加にとどまった。このような変化の原因は、健康管理への関心が高まりランニング文化が広がったこと、そしてSNSを通じたマラソン仲間作りが活発になり20〜30代の参加者が増えたことによるものと考えられる。(参考訳)", "checklist": ["자료의 수치와 변화를 정확히 설명했는가", "변화의 원인을 언급했는가", "전망(예상)까지 포함했는가", "200~300자 분량을 지켰는가", "글의 제목을 쓰지 않았는가"], "checklist_ja": ["資料の数値と変化を正確に説明できたか", "変化の原因に触れたか", "見通し(予想)まで含められたか", "200〜300字の分量を守れたか", "タイトルを書かずに済んだか"], "charts": [{"type": "bar-groups", "title": "인주시 마라톤 대회 참가자 수", "title_ja": "インジュ市マラソン大会参加者数", "caption": "조사 기관: 한국스포츠연구소  ·  단위: 명", "caption_ja": "調査機関: 韓国スポーツ研究所  ・  単位: 人", "unit": "명", "series_labels": ["참가자 수"], "series_labels_ja": ["参加者数"], "categories": [{"label": "2013년", "label_ja": "2013年", "values": [400000], "value_labels": ["40만 명"], "value_labels_ja": ["40万人"]}, {"label": "2023년", "label_ja": "2023年", "values": [1000000], "value_labels": ["100만 명 (2.5배)"], "value_labels_ja": ["100万人 (2.5倍)"]}]}, {"type": "bar-groups", "title": "연령별 참가자 수 변화 (2013년 대비 2023년)", "title_ja": "年齢別参加者数の変化 (2013年比2023年)", "caption": "배수는 2013년을 1로 봤을 때의 상대적 증가 배수", "caption_ja": "倍率は2013年を1としたときの相対的な増加倍率", "unit": "배", "series_labels": ["증가 배수"], "series_labels_ja": ["増加倍率"], "categories": [{"label": "20~30대", "label_ja": "20〜30代", "values": [4], "value_labels": ["4배"], "value_labels_ja": ["4倍"]}, {"label": "40~50대", "label_ja": "40〜50代", "values": [1.3], "value_labels": ["1.3배"], "value_labels_ja": ["1.3倍"]}]}]}, {"id": "96-w54", "round": 96, "number": 54, "type": "essay", "instruction": "※ 다음을 참고하여 600~700자로 글을 쓰시오. 단, 문제를 그대로 옮겨 쓰지 마시오. (50점)", "instruction_ja": "※ 次を参考にして600〜700字で文章を書きなさい。ただし、問題文をそのまま書き写さないこと。(50点)", "context": "오늘날 직장 내에서 복장, 출퇴근 시간, 업무 방식 등에 대해 개인의 자율성을 원하는 사람들이 많다. 회사에서 이런 자율성이 보장될 때 생기는 장점이 있다. 그러나 개인의 자율성만을 중시하는 사람이 많아지면 여러 문제가 발생할 우려도 있다. 아래의 내용을 중심으로 '직장과 개인의 자율성'에 대한 자신의 생각을 쓰라.", "context_ja": "今日、職場内で服装、出退勤時間、業務方式などについて個人の自律性を求める人が多い。会社でこのような自律性が保障されるときに生じる長所がある。しかし個人の自律性だけを重視する人が増えると、様々な問題が生じる恐れもある。以下の内容を中心に「職場と個人の自律性」について自分の考えを書きなさい。", "sub_questions": ["직장에서 개인의 자율성이 보장될 때의 장점은 무엇인가?", "직장 내 사람들이 개인의 자율성만 중시할 때 생기는 문제는 무엇인가?", "이런 문제를 해결하기 위해서는 어떻게 해야 하는가?"], "sub_questions_ja": ["職場で個人の自律性が保障されるときの長所は何か？", "職場の人々が個人の自律性だけを重視するとき生じる問題は何か？", "この問題を解決するためにはどうすればよいか？"], "word_count": "600~700자", "word_count_ja": "600〜700字", "model_answer": "사회의 변화로 개인의 자율성을 중시하는 사람들이 많아졌다. 이에 따라 기업에서도 유연근무제를 실시하는 등 직장 내 자율성을 높이고자 노력하고 있다. 직장에서 개인의 자율성이 보장되면 직장 내 문화가 유연해져 개인이 창의성을 발휘할 수 있는 근무 환경이 만들어진다. 또한 개인이 자신에게 적합한 근무 여건을 조성하여 일할 수 있어 일과 삶의 균형이 생긴다. 이것이 구성원의 업무 효율을 높이는 데 기여하여 조직의 목표를 달성하는 데에 도움이 된다.\n그러나 직장 내 사람들이 개인의 자율성만 중시하면 부작용이 발생할 수 있다. 먼저, 개인이 공동의 목표보다는 자신의 입장만을 생각하다 보면 자율성이 이기주의로 변질될 수 있다. 이러한 상황이 계속되면 책임자와 팀원 간 갈등, 세대 간 갈등이 발생할 수도 있다. 또한 업무의 자율성이 높아져 개별적으로 일할 수 있는 환경이 익숙해지면 소통이 부재하여 합의점을 찾기 어렵고 협력을 통한 성과를 내기 어려울 수 있다.\n이러한 문제를 해결하기 위해서는 직장 내 개개인이 자율성을 가지면서도 업무를 수행할 때는 최대한 동료와 협업하고 서로를 배려하는 마음을 가질 필요가 있다. 또한 조직은 구성원의 자율성을 높이면서 조직의 목표를 성취하는 데 도움이 되는 방안을 고민해야 한다. 나아가 효율적인 의사소통 방안을 마련하여 구성원 간 원활한 협력이 가능하도록 해야 할 것이다. (678자)", "model_answer_ja": "社会の変化により、個人の自律性を重視する人が増えた。これに伴い、企業でも柔軟勤務制を導入するなど、職場内の自律性を高めようと努力している。職場で個人の自律性が保障されると、社内文化が柔軟になり個人が創造性を発揮できる勤務環境が生まれる。また、自分に合った勤務条件を整えて働けるため、仕事と生活のバランスが生まれる。これが構成員の業務効率を高め、組織の目標達成に寄与する。\nしかし、職場の人々が個人の自律性だけを重視すると、副作用が生じることがある。まず、個人が共同の目標より自分の立場ばかりを考えると、自律性が利己主義に変質しかねない。このような状況が続くと、責任者とチームメンバーの間、世代間の葛藤が生じることもある。また、業務の自律性が高まり個別に働ける環境に慣れると、意思疎通が不足して合意点を見つけにくく、協力による成果を出しにくくなる可能性がある。\nこの問題を解決するためには、職場内の各個人が自律性を持ちながらも、業務を行う際にはできる限り同僚と協業し、互いを配慮する心を持つ必要がある。また組織は、構成員の自律性を高めながら組織の目標を達成するのに役立つ方策を考えるべきである。さらに、効率的な意思疎通の方法を用意し、構成員間の円滑な協力が可能になるようにすべきである。(参考訳)", "checklist": ["3가지 하위 질문에 모두 답했는가", "서론-본론-결론 구조로 전개했는가", "600~700자 분량을 지켰는가", "문제를 그대로 옮겨 쓰지 않았는가", "다양한 문법·어휘를 정확하게 사용했는가"], "checklist_ja": ["3つの下位質問すべてに答えられたか", "序論-本論-結論の構成で展開できたか", "600〜700字の分量を守れたか", "問題文をそのまま書き写していないか", "多様な文法・語彙を正確に使えたか"]}, {"id": "91-w51", "round": 91, "number": 51, "type": "blank", "instruction": "※ [51~52] 다음 글의 ㉠과 ㉡에 알맞은 말을 각각 쓰시오. (각 10점)", "instruction_ja": "※ [51〜52] 次の文章の㉠と㉡に入る適切な言葉をそれぞれ書きなさい。(各10点)", "passage": "[인주 피부과 병원]\n11월 13일 오전 10시에 진료 예약이 되어 있습니다.\n\n[답장]\n안녕하세요. 제가 13일에 일이 생겨서 병원에 못 가게 되었습니다.\n그래서 예약을 14일 오전 10시로 ( ㉠ ).\n만약에 이날 예약이 ( ㉡ ) 저는 15일 오전도 괜찮습니다.\n예약 변경이 가능한지 확인해 주십시오.", "passage_ja": "[インジュ皮膚科病院]\n11月13日午前10時に診療予約が入っています。\n\n[返信]\nこんにちは。13日に用事ができて病院に行けなくなりました。\nそこで予約を14日午前10時に( ㉠ )。\nもしこの日の予約が( ㉡ )私は15日午前でも大丈夫です。\n予約変更が可能かご確認ください。", "blanks": [{"label": "㉠", "answer": "변경하고 싶습니다 / 바꾸고 싶습니다", "answer_ja": "変更したいです / 変えたいです"}, {"label": "㉡", "answer": "불가능하면 / 어려우면", "answer_ja": "不可能であれば / 難しければ"}], "checklist": ["문맥에 맞는 표현을 사용했는가", "문법적으로 자연스러운 문장인가", "앞뒤 문장과 논리적으로 이어지는가"], "checklist_ja": ["文脈に合った表現を使えているか", "文法的に自然な文になっているか", "前後の文と論理的につながっているか"]}, {"id": "91-w52", "round": 91, "number": 52, "type": "blank", "instruction": "※ [51~52] 다음 글의 ㉠과 ㉡에 알맞은 말을 각각 쓰시오. (각 10점)", "instruction_ja": "※ [51〜52] 次の文章の㉠と㉡に入る適切な言葉をそれぞれ書きなさい。(各10点)", "passage": "스트레스를 받았을 때 사탕이나 과자와 같이 단 음식을 먹으면 기분이 좋아진다. 단 음식으로 인해 뇌에서 기분을 좋게 만드는 호르몬이 나오기 때문이다. 그런데 전문가들은 사람들이 술이나 담배에 중독되는 것처럼 단맛에도 ( ㉠ ). 따라서 평소에 단 음식을 지나치게 많이 ( ㉡ ) 주의할 필요가 있다.", "passage_ja": "ストレスを受けたとき、飴やお菓子のような甘い食べ物を食べると気分が良くなる。甘い食べ物 {"type": "bar-groups", "title": "편의점과 대형 마트 매출액", "title_ja": "コンビニと大型マートの売上額", "caption": "조사 기관: 산업경제연구소  ·  단위: 억 원", "caption_ja": "調査機関: 産業経済研究所  ・  単位: 億ウォン", "unit": "억 원", "series_labels": ["2015년", "2022년"], "series_labels_ja": ["2015年", "2022年"], "categories": [{"label": "대형 마트", "label_ja": "大型マート", "values": [242000, 243000], "value_labels": ["24조 2천억", "24조 3천억"], "value_labels_ja": ["24兆2千億", "24兆3千億"]}, {"label": "편의점", "label_ja": "コンビニ", "values": [172000, 223000], "value_labels": ["17조 2천억", "22조 3천억"], "value_labels_ja": ["17兆2千億", "22兆3千億"]}]}]}, {"id": "91-w54", "round": 91, "number": 54, "type": "essay", "instruction": "※ 다음을 참고하여 600~700자로 글을 쓰시오. 단, 문제를 그대로 옮겨 쓰지 마시오. (50점)", "instruction_ja": "※ 次を参考にして600〜700字で文章を書きなさい。ただし、問題文をそのまま書き写さないこと。(50点)", "context": "오늘날 우리는 정보 통신 기술의 발달로 누구나 쉽게 정보를 생산하고 대중에게 전달할 수 있다. 그런데 정보의 생산과 유통을 통해 개인과 집단이 이익을 얻을 수도 있게 되면서 사실과 다른 가짜 뉴스가 늘어나고 있다. 아래의 내용을 중심으로 '가짜 뉴스의 등장이 사회에 미치는 영향'에 대한 자신의 생각을 쓰라.", "context_ja": "今日、私たちは情報通信技術の発達により、誰でも簡単に情報を作り出し大衆に伝えることができる。しかし情報の生産と流通を通じて個人や集団が利益を得られるようになったことで、事実と異なる偽ニュースが増えている。以下の内容を中心に「偽ニュースの登場が社会に及ぼす影響」について自分の考えを書きなさい。", "sub_questions": ["가짜 뉴스가 생겨나는 사회적 배경은 무엇인가?", "가짜 뉴스로 인해 어떤 문제가 생길 수 있는가?", "이런 문제들을 해결하기 위해서 어떤 방안이 필요한가?"], "sub_questions_ja": ["偽ニュースが生まれる社会的背景は何か？", "偽ニュースによってどのような問題が生じ得るか？", "このような問題を解決するためにどのような方策が必要か？"], "word_count": "600~700자", "word_count_ja": "600〜700字", "model_answer": "정보 통신 기술의 발달과 소셜 미디어의 대중화로 인해 이 시대에는 누구나 쉽게 정보를 생산하고 불특정 다수와 공유할 수 있게 되었다. 이는 정보를 생산하고 유통하는 매체가 신문이나 방송과 같은 전통적 미디어에서 디지털 미디어 플랫폼으로 확장되면서 가능해진 것이다. 나아가 그 과정에서 경제적 가치를 창출하는 것 역시 가능해지면서 다양한 문제가 양산되고 있다. 사람들의 이목을 끌기 위한 가짜 뉴스의 등장도 그 문제 중 하나이다.\n가짜 뉴스는 정보 수용자로 하여금 잘못된 지식과 선입견, 편협한 사고를 형성하게 한다. 가짜 뉴스의 소재가 되는 개인이나 기업, 단체의 경우 이미지 타격과 경제적 피해는 물론이고 사회적으로 재기가 어려울 정도로 명예가 훼손되기도 한다. 또한 가짜 뉴스는 혐오를 확산하고 사회적 불안을 야기하며 사회 구성원들의 통합을 방해한다. 나아가 정치 및 외교적 문제로 심화될 가능성도 있기 때문에 심각한 사회 문제라 말할 수 있다.\n가짜 뉴스를 근절하기 위해서는 우선 제도적으로 가짜 뉴스의 생산과 유통이 불법적 행위임을 규정하고, 가짜 뉴스 단속을 위한 기구를 만들어 가짜 뉴스가 확산되지 않도록 규제를 강화해야 ", "「せっかく〜したのに」と、期待を込めた表現にも使う"], "examples": [{"ko": "모처럼 휴일이라 늦잠을 잤어요.", "ja": "久しぶりの休みなので寝坊しました。"}, {"ko": "모처럼의 여행인데 비가 와서 아쉬워요.", "ja": "せっかくの旅行なのに雨で残念です。"}], "register": "both", "registerNote": "日常会話で非常によく使われ、文章でも自然です。"}, {"term": "껑충", "formula": "擬態語「껑충」+ 뛰다/오르다/늘다など", "meaning": "ぴょんと(跳ぶ様子)、数値が急に大きく上がる様子", "points": ["新聞見出しでは、数値・物価・問い合わせなどが「急増・急騰」することを表す", "もともとは跳ね上がる様子を表す擬態語(토끼가 껑충 뛰다)"], "examples": [{"ko": "올해 채소 가격이 껑충 뛰었다.", "ja": "今年は野菜の価格が急上昇した。"}, {"ko": "토끼가 껑충 뛰어서 울타리를 넘었다.", "ja": "ウサギがぴょんと跳んで柵を越えた。"}], "register": "both", "registerNote": "会話でも使われ、ニュースの見出しでもよく使われます。"}, {"term": "-을/를 맞아", "formula": "名詞+을/를 맞아(맞이하여)", "meaning": "〜を迎えて、〜に際して", "points": ["記念日・季節・行事など、ある時期を迎えることを表す。ニュース・書き言葉でよく使う"], "examples": [{"ko": "새해를 맞아 가족과 여행을 갔다.", "ja": "新年を迎えて家族と旅行に行った。"}, {"ko": "개교 50주년을 맞아 행사가 열렸다.", "ja": "開校50周年を迎えて行事が開かれた。"}], "register": "written", "registerNote": "ニュースや文章でよく使う硬い表現で、日常会話ではあまり使いません。"}, {"term": "-더라도", "formula": "動詞・形容詞:語幹+더라도 / 名詞:이더라도(名詞の後は(이)라도も可) / 過去:語幹+았/었더라도", "meaning": "たとえ〜だとしても(譲歩)", "points": ["事実の順序ではなく、仮定・想定を認めた上で「それでも」と続ける表現", "-아/어도 とほぼ同義だが、-더라도 のほうが書き言葉的で仮定の意味が強い。後ろには命令・勧誘・意志も来られる", "「비록/아무리 〜더라도」の形でよく使う"], "examples": [{"ko": "비가 오더라도 내일 등산을 갈 거예요.", "ja": "雨が降ったとしても明日は登山に行きます。"}, {"ko": "힘들더라도 끝까지 포기하지 마세요.", "ja": "大変でも最後まで諦めないでください。"}], "register": "written", "registerNote": "かたい書き言葉で日常会話ではあまり使いません。会話では「-아/어도」がよく使われます。"}], "96-26": [{"term": "유력(하다)", "formula": "名詞:유력 / 形容詞:유력하다 / 連体形:유력한 + 名詞", "meaning": "有力だ、(可能性が)高い", "points": ["見出しでは「N 유력」の形で「〜が有力だ」の意味になる(예: 수상 유력)", "確定ではなく「可能性が高い」ことを表す"], "examples": [{"ko": "그가 우승할 가능성이 유력하다.", "ja": "彼が優勝する可能性が有力だ。"}, {"ko": "그는 유력한 우승 후보로 꼽힌다.", "ja": "彼は有力な優勝候補に挙げられている。"}], "register": "written", "registerNote": "ニュース見出しなどで使う硬い語で、日常会話ではほとんど使いません。"}, {"term": "고조(되다)", "formula": "名詞:고조 / 動詞:고조되다 / 連体形:고조된 + 名詞", "meaning": "(気持ち・雰囲気・緊張などが)高まること、盛り上がる", "points": ["「기대・긴장・분위기」などが高まるときに使う", "見出しでは「되다」を省略して「기대 고조」のように名詞止めにする"], "examples": [{"ko": "축제가 시작되면서 분위기가 고조되 性が良い"], "examples": [{"ko": "저는 제주도에 간 적이 있어요.", "ja": "私は済州島に行ったことがあります。"}, {"ko": "김치를 만들어 본 적이 없어요.", "ja": "キムチを作ってみたことがありません。"}], "register": "both", "registerNote": "話し言葉でも書き言葉でも自然に使われる経験表現です。"}, {"term": "-고 싶다", "formula": "動詞:語幹+고 싶다(가다→가고 싶다)。3人称は -고 싶어 하다", "meaning": "〜したい(話し手の願望)", "points": ["主語は1人称(平叙文)か2人称(疑問文)。他人の願望は「-고 싶어 하다」", "目的語は「을/를」でも「이/가」でもよい(한국어를/가 배우고 싶다)", "経験を述べる文(오래전에〜)とは意味が合わない"], "examples": [{"ko": "저는 한국에서 공부하고 싶어요.", "ja": "私は韓国で勉強したいです。"}, {"ko": "주말에 친구를 만나고 싶습니다.", "ja": "週末に友達に会いたいです。"}], "register": "both", "registerNote": "会話でも文章でもよく使う基本的な願望表現です。"}, {"term": "-아/어도 되다", "formula": "動詞・形容詞:陽母音語幹+아도 되다 / 陰母音語幹+어도 되다 / 하다→해도 되다(가다→가도 되다, 먹다→먹어도 되다)", "meaning": "〜してもよい(許可)", "points": ["許可を求める・与える。「-아/어도 괜찮다」も同じ", "反対(禁止)は「-(으)면 안 되다」", "「-아/어도」単独は「〜しても」という譲歩の意味"], "examples": [{"ko": "여기에서 사진을 찍어도 돼요?", "ja": "ここで写真を撮ってもいいですか。"}, {"ko": "이 책을 빌려 가도 됩니다.", "ja": "この本を借りて行ってもいいです。"}], "register": "both", "registerNote": "許可を求める表現で、話し言葉・書き言葉どちらも自然です。"}, {"term": "-(으)ㄹ 것 같다", "formula": "動詞・形容詞:母音語幹+ㄹ 것 같다 / 子音語幹+을 것 같다。現在の様子の推測は 動詞-는 것 같다・形容詞-(으)ㄴ 것 같다、過去は -(으)ㄴ 것 같다", "meaning": "〜しそうだ・〜だろうと思う(推測)", "points": ["未来や今後の状況についての推測", "断定を避けた婉曲な言い方としても使う", "「過去の経験」を述べる文脈には合わない"], "examples": [{"ko": "내일은 비가 올 것 같아요.", "ja": "明日は雨が降りそうです。"}, {"ko": "이 음식은 매울 것 같아요.", "ja": "この料理は辛そうです。"}], "register": "both", "registerNote": "推測を表す表現で、会話でも文章でも普通に使われます。"}], "91-2": [{"term": "-고 나서", "formula": "動詞:語幹+고 나서(먹다→먹고 나서)。名詞には付かない", "meaning": "〜してから・〜した後で", "points": ["前の動作が完了してから後の動作へ移る。順序をはっきり示す", "主語は同じことが多いが、命令・勧誘も後ろに使える(손을 씻고 나서 드세요)", "「-(으)ㄴ 후에/뒤에」とほぼ同じ"], "examples": [{"ko": "밥을 먹고 나서 커피를 마셨어요.", "ja": "ご飯を食べてからコーヒーを飲みました。"}, {"ko": "숙제를 끝내고 나서 게임을 했어요.", "ja": "宿題を終えてからゲームをしました。"}], "register": "both", "registerNote": "動作の順序を示す表現で、会話・文章ともに自然に使えます。"}, {"term": "-(으)ㄴ 지", "formula": "動詞:母音語幹+ㄴ 지 / 子音語幹+은 지(오다→온 지, 먹다→먹은 지)。後ろに期間+되다/지나다/넘다", "meaning": "〜してから(期間)になる", "points": ["「〜してから何年/何日経った」と経過期間を述べる専用の形", "後ろに直接ほかの動作を続けて「〜してから〜した」とは言えない(その場合は -고 나서)", "「-(으)ㄴ 지 얼마 안 되다」は「〜して間もない」"], "examples": [{"ko": "한국에 온 지 3년이 되었습니다.", "ja": "韓国に来て3年になります。"}, {"ko": "이 회사에 다닌 지 오래됐어요.", "ja": "この会社に勤めて長くなりました。"}], "register": "both", "registerNote": "経過期間を表す表現で、話し言葉・書き言葉どちらでも使います。"}, {"term": "-거든", "formula": "動詞・形容詞:語幹+거든(과거は -았/었거든)。文末では -거든(요)", "meaning": "〜したら(条件)/文末で「〜なんですよ」(理由・補足)", "points": ["条件用法では後ろに命令・勧誘・意志が来る(오거든 연락하세요)", "後ろが過去の平叙文(〜を買った)には使えない", "文末の「-거든요」は理由や事情を補足する口語表現"], "examples": [{"ko": "집에 도착하거든 전화해 주세요.", "ja": "家に着いたら電話してください。"}, {"ko": "내일 시간이 있거든 같이 영화 봐요.", "ja": "明日時間があったら一緒に映画を見ましょう。"}], "register": "spoken", "registerNote": "くだけた話し言葉的な条件・説明表現で、硬い文章にはあまり使いません。"}, {"term": "-(으)려면", "formula": "動詞:母音語幹+려면 / 子音語幹+으려면(가다→가려면, 먹다→먹으려면)", "meaning": "〜しようとするなら・〜したければ", "points": ["「-(으)려고 하면」の縮約。目的・意図を仮定条件にする", "後ろは「필요하다」「-아/어야 하다」「-는 게 좋다」などが典型", "すでに行った過去の事実(가구를 샀다)にはつながらない"], "examples": [{"ko": "한국에서 일하려면 한국어를 잘해야 해요.", "ja": "韓国で働こうとするなら韓国語が上手でなければなりません。"}, {"ko": "표를 사려면 여기에서 줄을 서세요.", "ja": "チケットを買うならここに並んでください。"}], "register": "both", "registerNote": "条件・意図を表す表現で、会話でも文章でもよく使われます。"}], "91-3": [{"term": "-고자", "formula": "動詞:語幹+고자(돕다→돕고자)。「-고자 하다」の形もよく使う", "meaning": "〜しようと・〜するために(目的)", "points": ["書き言葉・スピーチなど改まった場面で使う目的表現(≈ -(으)려고, -기 위해서)", "前後の主語は同じ。名詞には付かない", "「-고자 합니다」で「〜しようと思います」という丁寧な意図表明"], "examples": [{"ko": "장학금을 받고자 열심히 공부했습니다.", "ja": "奨学金をもらおうと一生懸命勉強しました。"}, {"ko": "여러분께 인사를 드리고자 이 자리에 섰습니다.", "ja": "皆さんにご挨拶しようとこの場に立ちました。"}], "register": "written", "registerNote": "格式のある書き言葉です。会話では『-(으)려고』の方が自然です。"}, {"term": "-기 위해서", "formula": "動詞:語幹+기 위해서 / 名詞:+을/를 위해서(위해, 위하여も可)", "meaning": "〜するために(目的)/Nのために", "points": ["動詞の目的を表す標準的な表現。後ろに命令・勧誘も使える", "名詞には「Nを/를 위해서」で「Nのために」", "「-고자」より一般的で、書き言葉・話し言葉どちらにも使える"], "examples": [{"ko": "건강해지기 위해서 매일 운동해요.", "ja": "健康になるために毎日運動しています。"}, {"ko": "가족을 위해서 열심히 일해요.", "ja": "家族のために一生懸命働いています。"}], "register": "both", "registerNote": "目的を表す表現で、話し言葉・書き言葉どちらでも自然に使えます。"}, {"term": "-는 대신에", "formula": "動詞:語幹+는 대신(에) / 形容詞:語幹+(으)ㄴ 대신(에) / 名詞:+대신(에)", "meaning": "〜する代わりに/〜な代わりに", "points": ["「代替」(Aの代わりにB)と「引き換え」(Aである反面Bだ)の2つの意味", "目的の意味は表さない"], "examples": [{"ko": "주말에 일하는 대신에 평일에 쉬어요.", "ja": "週末に働く代わりに平日に休みます。"}, {"ko": "이 집은 비싼 대신에 교통이 편해요.", "ja": "この家は高い代わりに交通が便利です。"}], "register": "both", "registerNote": "会話でも文章でもよく使われる代替・交換の表現です。"}, {"term": "-기가 무섭게", "formula": "動詞:語幹+기가 무섭게(오다→오기가 무섭게)", "meaning": "〜するやいなや・〜するとすぐに", "points": ["前の動作の直後に次の事態が起こる(≈ -자마자)", "前節は過去形にしない(-았기가 は不可)", "主語は前後で違ってもよい"], "examples": [{"ko": "종이 울리기가 무섭게 학생들이 뛰어나갔다.", "ja": "チャイムが鳴るやいなや生徒たちが走り出た。"}, {"ko": "그는 집에 돌아오기가 무섭게 잠들었다.", "ja": "彼は家に帰るやいなや眠りについた。"}], "register": "both", "registerNote": "やや書き言葉寄りですが、会話でも通じる表現です。"}, {"term": "-는 바람에", "formula": "動詞:語幹+는 바람에(過去の出来事にも -는 を使う)", "meaning": "〜したせいで・〜したために(原因)", "points": ["予想外の否定的な結果の原因を述べる", "後ろに命令・勧誘は使えない", "「-기 위해서」のような目的の意味はない"], "examples": [{"ko": "늦잠을 자는 바람에 지각했어요.", "ja": "寝坊したせいで遅刻しました。"}, {"ko": "비가 갑자기 오는 바람에 옷이 다 젖었어요.", "ja": "急に雨が降ったせいで服がすっかり濡れました。"}], "register": "both", "registerNote": "原因を述べる際、会話でも文章でも非常によく使われます。"}], "91-4": [{"term": "-는 셈이다", "formula": "動詞現在:語幹+는 셈이다 / 動詞過去:語幹+(으)ㄴ 셈이다 / 形容詞:語幹+(으)ㄴ 셈이다 / 名詞:+인 셈이다", "meaning": "結局〜ということになる・〜も同然だ", "points": ["厳密には違っても、事情を整理・計算すれば実質的にそうなる、という結論を述べる", "「거의」「사실상」などと一緒に使われやすい", "「-(으)ㄴ 셈 치다」は「〜したつもりにする」"], "examples": [{"ko": "이 정도면 다 끝낸 셈이에요.", "ja": "これくらいならほぼ終わったも同然です。"}, {"ko": "한 달에 한 번밖에 못 만나니 거의 못 만나는 셈이다.", "ja": "月に一度しか会えないのでほとんど会えないのと同じだ。"}], "register": "both", "registerNote": "話し言葉でも書き言葉でも自然に使える結論づけの表現です。"}, {"term": "-(으)ㄴ 거나 마찬가지이다", "formula": "動詞過去:語幹+(으)ㄴ 거나 마찬가지이다 / 現在:-는 거나 / 形容詞:-(으)ㄴ 거나 / 名詞:+(이)나 마찬가지이다", "meaning": "〜したのと同じだ・〜も同然だ", "points": ["実質的に同じ状態だと言う表現(≈ -는 셈이다, -는 것과 같다)", "名詞は「공짜나 마찬가지이다」のように(이)나 が付く"], "examples": [{"ko": "그 일은 이미 끝난 거나 마찬가지예요.", "ja": "その仕事はもう終わったも同然です。"}, {"ko": "거의 안 쓰니까 없는 거나 마찬가지예요.", "ja": "ほとんど使わないのでないのも同然です。"}], "register": "both", "registerNote": "会話・文章どちらでも使える『同然だ』という表現です。"}, {"term": "-(으)ㄴ 척하다", "formula": "動詞現在:語幹+는 척하다 / 動詞過去・形容詞:語幹+(으)ㄴ 척하다 / 名詞:+인 척하다(≈ -체하다)", "meaning": "〜したふりをする・〜なふりをする", "points": ["実際はそうでないのに、そう見せかける", "「본 척했다」は実際に見たかどうかに関係なく「見たふりをした」。「-는 셈이다」とは意味が異なる"], "examples": [{"ko": "그는 아무것도 모르는 척했어요.", "ja": "彼は何も知らないふりをしました。"}, {"ko": "피곤한 척하지 마세요.", "ja": "疲れたふりをしないでください。"}], "register": "both", "registerNote": "日常会話でも文章でもよく使われる『ふりをする』表現です。"}, {"term": "-기 나름이다", "formula": "動詞:語幹+기 나름이다 / 名詞:+나름이다", "meaning": "〜次第だ", "points": ["結果がやり方・心がけによって変わる", "名詞に付くと「人それぞれ」(사람 나름이다)"], "examples": [{"ko": "행복은 마음먹기 나름이에요.", "ja": "幸せは気の持ちよう次第です。"}, {"ko": "성공은 노력하기 나름이다.", "ja": "成功は努力次第だ。"}], "register": "both", "registerNote": "会話でも文章でも自然に使われる『次第だ』という表現です。"}, {"term": "-(으)ㄹ 수밖에 없다", "formula": "動詞・形容詞:母音語幹+ㄹ 수밖에 없다 / 子音語幹+을 수밖에 없다(過去:없었다)", "meaning": "〜するしかない・〜せざるを得ない", "points": ["他に選択肢がない、そうなるのは当然だという意味(≈ -지 않을 수 없다)", "「同然」ではなく「しかなかった」という意味になる"], "examples": [{"ko": "길이 막혀서 늦을 수밖에 없었어요.", "ja": "道が混んでいて遅れるしかありませんでした。"}, {"ko": "비가 오니까 행사를 취소할 수밖에 없다.", "ja": "雨が降っているので行事を中止するしかない。"}], "register": "both", "registerNote": "話し言葉・書き言葉どちらでも非常によく使われる表現です。"}], "91-16": [{"term": "-기 위해(서)", "formula": "動詞:語幹+기 위해(서) / 名詞:+을/를 위해(서) / 連体形:-기 위한 + 名詞", "meaning": "〜するために(目的)", "points": ["「-기」は動詞を名詞化する形。この問題では選択肢がすべて「-기」で終わる形", "名詞は「Nを위해」で「Nのために」", "後ろに命令・勧誘も使える"], "examples": [{"ko": "한국어를 배우기 위해서 한국에 왔어요.", "ja": "韓国語を学ぶために韓国に来ました。"}, {"ko": "건강을 지키기 위해 매일 걸어요.", "ja": "健康を守るために毎日歩いています。"}], "register": "both", "registerNote": "目的を表す表現で、話し言葉・書き言葉どちらでも自然に使えます。"}], "91-17": [{"term": "-기 때문이다", "formula": "動詞・形容詞:語幹+기 때문이다(過去:-았/었기 때문이다) / 名詞:+(이)기 때문이다", "meaning": "〜だからだ(理由を文末で述べる)", "points": ["先に結果を述べ、文末で理由を説明するときに使う", "文中で理由をつなぐ場合は「-기 때문에」", "名詞+때문이다は「Nのせいだ・Nのためだ」"], "examples": [{"ko": "제가 늦은 이유는 길이 막혔기 때문이에요.", "ja": "私が遅れた理由は道が混んでいたからです。"}, {"ko": "그가 인기가 많은 것은 성격이 좋기 때문이다.", "ja": "彼が人気があるのは性格がいいからだ。"}], "register": "written", "registerNote": "文末で理由を述べる書き言葉調の表現です。会話では『-기 때문이에요』を使います。"}, {"term": "-는 것만은 아니다", "formula": "動詞:語幹+는 것만은 아니다 / 形容詞:語幹+(으)ㄴ 것만은 아니다", "meaning": "〜とは限
