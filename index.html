function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Questions that share a passage_group (e.g. one passage with 2-4 sub-questions,
// like the real TOPIK exam) are clustered into one "group" so they always stay
// together — never split apart or reordered independently, even under random
// order or a partial question count. A group is a plain array of 1+ question
// objects, in their original (가/나/다 ... or 번호) order.
function buildGroupedQuestions(scope){
  let qs = ALL_QUESTIONS.slice();
  if(scope === '96') qs = qs.filter(q=>q.round===96);
  else if(scope === '91') qs = qs.filter(q=>q.round===91);
  qs.sort((a,b)=> a.round===b.round ? a.number-b.number : a.round-b.round);
  const groups = [];
  const groupIndexByKey = {};
  qs.forEach(q=>{
    const key = q.passage_group ? `${q.round}-${q.passage_group}` : null;
    if(key && groupIndexByKey[key] !== undefined){
      groups[groupIndexByKey[key]].push(q);
      return;
    }
    if(key) groupIndexByKey[key] = groups.length;
    groups.push([q]);
  });
  return groups;
}

function buildPool(){
  let groups = buildGroupedQuestions(state.scope);
  if(state.order === 'random') groups = shuffle(groups);
  if(typeof state.count === 'number' && state.count > 0){
    const limited = [];
    let total = 0;
    for(const g of groups){
      if(total >= state.count) break;
      limited.push(g);
      total += g.length;
    }
    groups = limited;
  }
  return groups; // array of groups; each group is an array of 1+ question objects
}

function poolQuestionCount(pool){
  return pool.reduce((sum, g)=> sum + g.length, 0);
}

function countFor(scope){
  if(scope==='all') return ALL_QUESTIONS.length;
  if(scope==='96') return ALL_QUESTIONS.filter(q=>q.round===96).length;
  if(scope==='91') return ALL_QUESTIONS.filter(q=>q.round===91).length;
  return 0;
}

function countForWriting(scope){
  if(scope==='all') return ALL_WRITING.length;
  if(scope==='96') return ALL_WRITING.filter(q=>q.round===96).length;
  if(scope==='91') return ALL_WRITING.filter(q=>q.round===91).length;
  return 0;
}

const CHART_COLORS = ['var(--chart-1)','var(--chart-2)','var(--chart-3)','var(--chart-4)','var(--chart-5)','var(--chart-6)'];

function donutChartHtml(chart, lang){
  const segs = chart.segments;
  const total = segs.reduce((s,x)=>s+x.value, 0);
  let acc = 0;
  const stops = segs.map((s,i)=>{
    const start = total ? (acc/total*100) : 0;
    acc += s.value;
    const end = total ? (acc/total*100) : 0;
    return `${CHART_COLORS[i%CHART_COLORS.length]} ${start}% ${end}%`;
  }).join(', ');
  const title = lang==='ja' ? (chart.title_ja||chart.title) : chart.title;
  const caption = lang==='ja' ? (chart.caption_ja||chart.caption) : chart.caption;
  const legend = segs.map((s,i)=>{
    const label = lang==='ja' ? (s.label_ja||s.label) : s.label;
    return `<div class="chart-legend-item"><span class="chart-swatch" style="background:${CHART_COLORS[i%CHART_COLORS.length]}"></span>${escapeHtml(label)} ${s.value}%</div>`;
  }).join('');
  return `
    <div class="chart-card">
      <div class="chart-title">${escapeHtml(title)}</div>
      <div class="donut-wrap">
        <div class="donut-ring" style="background:conic-gradient(${stops})"></div>
        <div class="donut-hole"></div>
      </div>
      <div class="chart-legend">${legend}</div>
      ${caption ? `<div class="chart-caption">${escapeHtml(caption)}</div>` : ''}
    </div>
  `;
}

function barGroupsChartHtml(chart, lang){
  const title = lang==='ja' ? (chart.title_ja||chart.title) : chart.title;
  const caption = lang==='ja' ? (chart.caption_ja||chart.caption) : chart.caption;
  const seriesLabels = lang==='ja' ? (chart.series_labels_ja||chart.series_labels) : chart.series_labels;
  const maxVal = Math.max(...chart.categories.flatMap(c=>c.values), 0.0001);
  const groups = chart.categories.map(cat=>{
    const label = lang==='ja' ? (cat.label_ja||cat.label) : cat.label;
    const valueLabels = lang==='ja' ? (cat.value_labels_ja||cat.value_labels) : cat.value_labels;
    const bars = cat.values.map((v,i)=>{
      const pct = Math.max((v/maxVal*100), 2);
      const vLabel = valueLabels ? valueLabels[i] : String(v);
      // Stagger alternate labels higher so two bars of similar height in the
      // same group don't render their value text on top of each other.
      const labelClass = i % 2 === 1 ? 'bar-value bar-value-alt' : 'bar-value';
      return `<div class="bar" style="height:${pct}%;background:${CHART_COLORS[i%CHART_COLORS.length]}"><span class="${labelClass}">${escapeHtml(vLabel)}</span></div>`;
    }).join('');
    return `<div class="bar-group"><div class="bar-set">${bars}</div><div class="bar-cat-label">${escapeHtml(label)}</div></div>`;
  }).join('');
  const showLegend = seriesLabels && seriesLabels.length > 1;
  const legend = showLegend ? seriesLabels.map((s,i)=>`<div class="chart-legend-item"><span class="chart-swatch" style="background:${CHART_COLORS[i%CHART_COLORS.length]}"></span>${escapeHtml(s)}</div>`).join('') : '';
  return `
    <div class="chart-card">
      <div class="chart-title">${escapeHtml(title)}</div>
      <div class="bar-chart">${groups}</div>
      ${showLegend ? `<div class="chart-legend">${legend}</div>` : ''}
      ${caption ? `<div class="chart-caption">${escapeHtml(caption)}</div>` : ''}
    </div>
  `;
}

function chartHtml(chart, lang){
  if(!chart) return '';
  if(chart.type === 'donut') return donutChartHtml(chart, lang);
  if(chart.type === 'bar-groups') return barGroupsChartHtml(chart, lang);
  return '';
}

// Wrap `target` in <u>, HTML-escaping every part. Falls back to a plain
// escaped string when target is missing or not found (translation gaps, etc).
function underlineHtml(text, target){
  if(!text) return '';
  if(!target) return escapeHtml(text);
  const idx = text.indexOf(target);
  if(idx === -1) return escapeHtml(text);
  const before = text.slice(0, idx);
  const match = text.slice(idx, idx+target.length);
  const after = text.slice(idx+target.length);
  return escapeHtml(before) + '<u>' + escapeHtml(match) + '</u>' + escapeHtml(after);
}

// Tap detection that tolerates scroll gestures: a touch/pointer that moves
// more than a few px, or lingers past a short window, is treated as a scroll
// or press-and-hold rather than a selection — plain 'click' fires too eagerly
// on mobile when a scroll starts on top of a choice button.
function attachTapHandler(target, handler){
  const MAX_DIST = 10;
  const MAX_TIME = 500;
  let startX = 0, startY = 0, startT = 0, tracking = false;
  target.addEventListener('pointerdown', (e)=>{
    tracking = true;
    startX = e.clientX; startY = e.clientY; startT = Date.now();
  });
  target.addEventListener('pointermove', (e)=>{
    if(!tracking) return;
    const dist = Math.hypot(e.clientX-startX, e.clientY-startY);
    if(dist > MAX_DIST) tracking = false;
  });
  target.addEventListener('pointerup', (e)=>{
    if(!tracking) return;
    tracking = false;
    const dist = Math.hypot(e.clientX-startX, e.clientY-startY);
    const dt = Date.now() - startT;
    if(dist <= MAX_DIST && dt <= MAX_TIME) handler(e);
  });
  target.addEventListener('pointercancel', ()=>{ tracking = false; });
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function render(){
  const app = document.getElementById('app');

  if(state.screen === 'start') app.appendChild(renderStart());
  else if(state.screen === 'quiz') app.appendChild(renderQuiz());

  else if(state.screen === 'writing-done') app.appendChild(renderWritingDone());
  else if(state.screen === 'analysis') app.appendChild(renderAnalysis());
  saveSession();
}

const STATS_KEY = 'topikQuizStats_v1';
function loadStats(){

    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveStats(stats){

}
function recordStat(id, correct){
  const stats = loadStats();
  const s = stats[id] || {correct:0, wrong:0};
  if(correct) s.correct++; else s.wrong++;
  stats[id] = s;
  saveStats(stats);
}

}


// ---- Resumable session (per-browser, via localStorage) ----
const SESSION_KEY = 'topikQuizSession_v1';
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
function currentWritingSnap(){
  return {revealed: state.writingRevealed, checks: state.writingChecks, inputs: state.writingInputs, essay: state.writingEssayText};
}
function saveSession(){
  if(state.reviewing) return;
  let data = null;
  if(state.screen === 'quiz'){
    data = {
      kind:'reading', scope:state.scope, order:state.order, count:state.count,
      pool: state.pool.map(g=>g.map(q=>q.id)),
      idx: state.idx, allSub: state.allSub, score: state.score,
      answers: state.answers.map(a=>({id:a.q.id, chosen:a.chosen, correct:a.correct})),
    };
  } else if(state.screen === 'writing-quiz'){
    data = {
      kind:'writing', scope:state.scope, order:state.order,
      pool: state.writingPool.map(q=>q.id),
      idx: state.writingIdx, snaps: state.writingSnaps, cur: currentWritingSnap(),
    };
  } else if(state.screen === 'result' || state.screen === 'writing-done'){
    clearSession();
    return;
  }
  if(!data) return;
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(data)); }catch(e){}
}
function confirmOverwriteSession(){
  return !loadSession() || confirm(t('overwriteConfirm'));
}
function sessionIsValid(s){
  try{
    if(!s) return false;
    if(s.kind === 'reading'){
      const ids = new Set(ALL_QUESTIONS.map(q=>q.id));
      return Array.isArray(s.pool) && s.pool.length > 0 && s.pool.every(g=>g.every(id=>ids.has(id)))
        && s.idx >= 0 && s.idx < s.pool.length
        && Array.isArray(s.allSub) && s.allSub.length === s.pool.length
        && s.allSub.every((a,i)=>Array.isArray(a) && a.length === s.pool[i].length);
    }
    if(s.kind === 'writing'){
      const ids = new Set(ALL_WRITING.map(q=>q.id));
      return Array.isArray(s.pool) && s.pool.length > 0 && s.pool.every(id=>ids.has(id))
        && s.idx >= 0 && s.idx < s.pool.length;
    }
  }catch(e){}
  return false;
}
function resumeSession(){
  const s = loadSession();
  if(!sessionIsValid(s)){ clearSession(); render(); return; }
  state.reviewing = false;
  state.scope = s.scope; state.order = s.order;
  if(s.kind === 'reading'){
    const byId = Object.fromEntries(ALL_QUESTIONS.map(q=>[q.id,q]));
    state.mode = 'reading';
    state.count = s.count;
    state.pool = s.pool.map(g=>g.map(id=>byId[id]));
    state.idx = s.idx;
    state.allSub = s.allSub;
    state.subAnswers = state.allSub[state.idx];
    state.score = s.score;
    state.answers = s.answers.map(a=>({q:byId[a.id], chosen:a.chosen, correct:a.correct}));
    state.screen = 'quiz';
  } else {
    const byId = Object.fromEntries(ALL_WRITING.map(q=>[q.id,q]));
    state.mode = 'writing';
    state.writingPool = s.pool.map(id=>byId[id]);
    state.writingIdx = s.idx;
    state.writingSnaps = s.snaps || {};
    const c = s.cur || {};
    state.writingRevealed = !!c.revealed;
    state.writingChecks = c.checks || {};
    state.writingInputs = c.inputs || {};
    state.writingEssayText = c.essay || '';
    state.screen = 'writing-quiz';
  }
  render();
}
function discardSession(){
  if(confirm(t('discardConfirm'))){ clearSession(); render(); }
}

function renderWritingQuiz(){
  const wrap = el(`<div></div>`);
  const q = currentWritingQuestion();
  const total = state.writingPool.length;
  const pct = Math.round((state.writingIdx/total)*100);

  wrap.appendChild(topbarHtml(`

      <div class="progress-label">${t('writingProgressLabel', state.writingIdx+1, total)}</div>
    </div>
  `, true));

  const card = el(`<div class="q-card"></div>`);
  card.appendChild(el(`
    <div class="q-meta">
      <div class="q-source">${q.round}회 쓰기 ${q.number}번</div>
    </div>
  `));
  const instruction = tf(q,'instruction');
  card.appendChild(el(`<p class="q-instruction">${escapeHtml(instruction)}</p>`));

  if(q.type === 'blank'){
    const passage = tf(q,'passage');
    card.appendChild(el(`<div class="passage-box">${escapeHtml(passage)}</div>`));
    const blanksWrap = el(`<div class="blank-list"></div>`);
    q.blanks.forEach((b,i)=>{
      const row = el(`
        <div class="blank-row">
          <div class="blank-label">${escapeHtml(b.label)}</div>
          <input type="text" class="blank-input" data-i="${i}" ${state.writingRevealed?'disabled':''}>
        </div>
      `);
      const input = row.querySelector('.blank-input');
      input.value = state.writingInputs[i] || '';
      input.addEventListener('input', (e)=>{ state.writingInputs[i] = e.target.value; saveSession(); });
      blanksWrap.appendChild(row);
    });
    card.appendChild(blanksWrap);
  } else {
    if(q.charts){
      q.charts.forEach(chart=>{
        card.appendChild(el(chartHtml(chart, state.lang)));
      });
    } else if(q.chart_data){
      const chartData = state.lang==='ja' ? (q.chart_data_ja||q.chart_data) : q.chart_data;
      const chartCard = el(`<div class="chart-card"></div>`);
      chartCard.appendChild(el(`<div class="chart-card-label">${escapeHtml(t('chartDataLabel'))}</div>`));
      chartData.forEach(line=>{
        chartCard.appendChild(el(`<div class="chart-line">${escapeHtml(line)}</div>`));
      });
      card.appendChild(chartCard);
    }
    if(q.context){
      card.appendChild(el(`<p class="q-stem">${escapeHtml(tf(q,'context'))}</p>`));
      const subQuestions = state.lang==='ja' ? (q.sub_questions_ja||q.sub_questions) : q.sub_questions;
      const subWrap = el(`<ul class="sub-questions"></ul>`);
      subQuestions.forEach(sq=>{
        subWrap.appendChild(el(`<li>${escapeHtml(sq)}</li>`));
      });
      card.appendChild(subWrap);
    }
    const wordCount = state.lang==='ja' ? (q.word_count_ja||q.word_count) : q.word_count;
    card.appendChild(el(`<div class="word-count-hint">${escapeHtml(wordCount)}</div>`));
    const textarea = el(`<textarea class="writing-textarea" id="writing-textarea" ${state.writingRevealed?'disabled':''} placeholder="${escapeHtml(t('yourAnswerLabel'))}"></textarea>`);
    textarea.value = state.writingEssayText;
    textarea.addEventListener('input', (e)=>{ state.writingEssayText = e.target.value; saveSession(); });
    card.appendChild(textarea);
  }

  if(!state.writingRevealed){
    const checkBtn = el(`<button class="start-btn" id="check-answer-btn" style="margin-top:18px;">${t('checkAnswerBtn')}</button>`);
    checkBtn.addEventListener('click', ()=>{ state.writingRevealed = true; state.writingChecks = {}; render(); });
    card.appendChild(checkBtn);
  } else {
    if(q.type === 'blank'){
      const answerWrap = el(`<div class="model-answer-box"></div>`);
      answerWrap.appendChild(el(`<div class="grammar-badge">${escapeHtml(t('modelAnswerLabel'))}</div>`));
      q.blanks.forEach(b=>{
        const ans = state.lang==='ja' ? (b.answer_ja||b.answer) : b.answer;
        answerWrap.appendChild(el(`<div class="explain-text"><b>${escapeHtml(b.label)}</b> ${escapeHtml(ans)}</div>`));
      });
      card.appendChild(answerWrap);
    } else {
      const answerWrap = el(`<div class="model-answer-box"></div>`);
      answerWrap.appendChild(el(`<div class="grammar-badge">${escapeHtml(t('modelAnswerLabel'))}</div>`));
      const modelAnswer = tf(q,'model_answer');
      answerWrap.appendChild(el(`<div class="explain-text">${escapeHtml(modelAnswer)}</div>`));
      card.appendChild(answerWrap);
    }

    const checklist = state.lang==='ja' ? (q.checklist_ja||q.checklist) : q.checklist;
    const checkedCount = checklist.filter((_,i)=>state.writingChecks[i]).length;
    const checklistWrap = el(`
      <div class="checklist-box">
        <div class="grammar-badge">${escapeHtml(t('checklistLabel'))}</div>
        <div class="checklist-count">${escapeHtml(t('checklistCount', checkedCount, checklist.length))}</div>
      </div>
    `);
    checklist.forEach((item,i)=>{
      const row = el(`
        <label class="checklist-item">
          <input type="checkbox" data-i="${i}" ${state.writingChecks[i]?'checked':''}>
          <span>${escapeHtml(item)}</span>
        </label>
      `);
      row.querySelector('input').addEventListener('change', (e)=>{
        state.writingChecks[i] = e.target.checked;
        render();
      });
      checklistWrap.appendChild(row);
    });
    card.appendChild(checklistWrap);
  }

  if(state.writingRevealed || state.writingIdx > 0){
    const nextRow = el(`<div class="next-row ${state.writingIdx > 0 ? 'has-prev' : ''}"></div>`);
    if(state.writingIdx > 0){
      const prevBtn = el(`<button class="prev-btn">← ${t('prevBtn')}</button>`);
      prevBtn.addEventListener('click', goPrevWriting);
      nextRow.appendChild(prevBtn);
    }
    if(state.writingRevealed){
      const isLast = state.writingIdx === total-1;
      const nextBtn = el(`<button class="next-btn">${isLast ? t('writingDoneBtn') : t('writingNextBtn')}</button>`);
      nextBtn.addEventListener('click', goNextWriting);
      nextRow.appendChild(nextBtn);
    }
    card.appendChild(nextRow);
  }

  wrap.appendChild(card);
  return wrap;
}

function gotoWriting(i){
  state.writingSnaps[state.writingIdx] = currentWritingSnap();
  state.writingIdx = i;
  const snap = state.writingSnaps[i] || {};
  state.writingRevealed = !!snap.revealed;
  state.writingChecks = snap.checks || {};
  state.writingInputs = snap.inputs || {};
  state.writingEssayText = snap.essay || '';
  render();
}

function goNextWriting(){
  if(state.writingIdx < state.writingPool.length-1){
    gotoWriting(state.writingIdx + 1);
  } else {
    state.screen = 'writing-done';
    render();
  }
}

function goPrevWriting(){
  if(state.writingIdx > 0) gotoWriting(state.writingIdx - 1);
}

function renderWritingDone(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(topbarHtml());
  const card = el(`
    <div class="result-card">
      <div class="char-result">🖋️</div>
      <div class="result-sub" style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;">${escapeHtml(t('writingDoneTitle'))}</div>
      <div class="result-sub">${escapeHtml(t('writingDoneSub'))}</div>
      <div class="result-actions">
        <button class="btn-primary" id="restart-btn" style="flex:1;">${t('restartBtn')}</button>
      </div>
    </div>
  `);
  card.querySelector('#restart-btn').addEventListener('click', ()=>{
    state.screen = 'start';
    render();
  });
  wrap.appendChild(card);
  return wrap;
}

function renderStart(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">${t('brand')}</div>
      </div>
    </header>
  `));
  wrap.querySelector('.topbar-row').appendChild(el(langToggleHtml()));
  wrap.querySelector('#lang-toggle-btn').addEventListener('click', toggleLang);
  const modes = [
    {key:'reading', label:t('modeReading', ALL_QUESTIONS.length)},
    {key:'writing', label:t('modeWriting', ALL_WRITING.length)},
  ];
  const isWriting = state.mode === 'writing';
  const countForScope = isWriting ? countForWriting : countFor;
  const scopes = [
    {key:'all', label:t('scopeAll', countForScope('all'))},
    {key:'96', label:t('scope96', countForScope('96'))},
    {key:'91', label:t('scope91', countForScope('91'))},
  ];
  const orders = [
    {key:'sequential', label:t('orderSeq')},
    {key:'random', label:t('orderRandom')},
  ];
  const maxCount = countFor(state.scope); // reading-only: drives the "문제 수" selector, hidden in writing mode
  if(!isWriting && typeof state.count === 'number' && state.count > maxCount) state.count = maxCount;
  const countPresets = [10, 20, 30].filter(n => n < maxCount);
  const card = el(`
    <div class="start-card">
      <h1>${t('title')}</h1>
      <p class="lead">${t('lead', ALL_QUESTIONS.length)}</p>
      <div class="option-group">
        <h3>${t('modeHeading')}</h3>
        <div class="chip-row" id="mode-row"></div>
      </div>
      <div class="option-group">
        <h3>${t('scopeHeading')}</h3>
        <div class="chip-row" id="scope-row"></div>
      </div>
      <div class="option-group" id="order-group" ${isWriting ? 'style="display:none;"' : ''}>
        <h3>${t('orderHeading')}</h3>
        <div class="chip-row" id="order-row"></div>
      </div>
      <div class="option-group" id="count-group" ${isWriting ? 'style="display:none;"' : ''}>
        <h3>${t('countHeading')}</h3>
        <div class="chip-row" id="count-row"></div>
        <div class="custom-count-row">
          <label for="custom-count-input">${escapeHtml(t('customCountLabel', maxCount))}</label>
          <input type="number" id="custom-count-input" min="1" max="${maxCount}" step="1">
        </div>
      </div>
      <button class="start-btn" id="start-btn">${t('startBtn')}</button>
      <button class="analysis-link" id="analysis-link-btn">${t('analysisLink')}</button>
    </div>
  `);
  card.querySelector('#analysis-link-btn').addEventListener('click', ()=>{
    state.screen = 'analysis';
    render();
  });
  const modeRow = card.querySelector('#mode-row');
  modes.forEach(m=>{
    const chip = el(`<div class="chip ${state.mode===m.key?'active':''}">${m.label}</div>`);
    chip.addEventListener('click', ()=>{ state.mode = m.key; render(); });
    modeRow.appendChild(chip);
  });
  const scopeRow = card.querySelector('#scope-row');
  scopes.forEach(s=>{
    const chip = el(`<div class="chip ${state.scope===s.key?'active':''}">${s.label}</div>`);
    chip.addEventListener('click', ()=>{ state.scope = s.key; render(); });
    scopeRow.appendChild(chip);
  });
  const orderRow = card.querySelector('#order-row');
  orders.forEach(o=>{
    const chip = el(`<div class="chip ${state.order===o.key?'active':''}">${o.label}</div>`);
    chip.addEventListener('click', ()=>{ state.order = o.key; render(); });
    orderRow.appendChild(chip);
  });
  const countRow = card.querySelector('#count-row');
  const isCustomCount = typeof state.count === 'number' && !countPresets.includes(state.count);
  [...countPresets.map(n=>({key:n, label:t('countN', n)})), {key:'all', label:t('countAll', maxCount)}].forEach(c=>{
    const chip = el(`<div class="chip ${state.count===c.key?'active':''}">${c.label}</div>`);
    chip.addEventListener('click', ()=>{ state.count = c.key; render(); });
    countRow.appendChild(chip);
  });
  const customInput = card.querySelector('#custom-count-input');
  customInput.value = isCustomCount ? state.count : '';
  customInput.classList.toggle('active', isCustomCount);
  customInput.addEventListener('input', (e)=>{
    const v = parseInt(e.target.value, 10);
    if(Number.isFinite(v) && v >= 1){
      state.count = Math.min(v, maxCount);
    }
  });
  customInput.addEventListener('blur', ()=>{ render(); });
  card.querySelector('#start-btn').addEventListener('click', isWriting ? startWriting : startQuiz);
  const saved = loadSession();
  if(sessionIsValid(saved)){
    const info = saved.kind === 'reading'
      ? t('resumeInfoReading', saved.allSub.reduce((n,g)=>n+g.filter(x=>x.answered).length,0), saved.pool.reduce((n,g)=>n+g.length,0))
      : t('resumeInfoWriting', saved.idx+1, saved.pool.length);
    const resumeCard = el(`
      <div class="resume-card">
        <div class="resume-text">
          <div class="resume-title">${t('resumeTitle')}</div>
          <div class="resume-info">${escapeHtml(info)}</div>
        </div>
        <div class="resume-actions">
          <button class="resume-discard" id="resume-discard-btn">${t('discardBtn')}</button>
          <button class="resume-go" id="resume-go-btn">${t('resumeBtn')}</button>
        </div>
      </div>
    `);
    resumeCard.querySelector('#resume-go-btn').addEventListener('click', resumeSession);
    resumeCard.querySelector('#resume-discard-btn').addEventListener('click', discardSession);
    wrap.appendChild(resumeCard);
  }
  wrap.appendChild(card);
  return wrap;
}

function newSubAnswers(group){
  return group.map(()=>({answered:false, chosen:null}));
}

function beginReading(pool){
  state.pool = pool;
  state.idx = 0;
  state.allSub = pool.map(newSubAnswers);
  state.subAnswers = state.allSub[0];
  state.score = 0;
  state.answers = [];
  state.reviewing = false;
  state.mode = 'reading';
  state.screen = 'quiz';
  render();
}

function startQuiz(){
  const pool = buildPool();
  if(pool.length === 0) return;
  if(!confirmOverwriteSession()) return;
  beginReading(pool);
}

function buildWritingPool(){
  let pool = ALL_WRITING.slice();
  if(state.scope === '96') pool = pool.filter(q=>q.round===96);
  else if(state.scope === '91') pool = pool.filter(q=>q.round===91);
  if(state.order === 'random') pool = shuffle(pool);
  return pool;
}

function startWriting(){
  state.writingPool = buildWritingPool();
  if(state.writingPool.length === 0) return;
  if(!confirmOverwriteSession()) return;
  state.reviewing = false;
  state.writingSnaps = {};
  state.writingIdx = 0;
  state.writingRevealed = false;
  state.writingChecks = {};
  state.writingInputs = {};
  state.writingEssayText = '';
  state.screen = 'writing-quiz';
  render();
}

function registerBadgeHtml(n){
  if(!n.register) return '';
  const labelKey = n.register === 'written' ? 'registerWritten' : n.register === 'spoken' ? 'registerSpoken' : 'registerBoth';
  const note = n.registerNote ? `<div class="gref-register-note">${escapeHtml(n.registerNote)}</div>` : '';
  return `
    <div class="gref-register gref-register-${escapeHtml(n.register)}">
      <span class="gref-register-badge">${escapeHtml(t(labelKey))}</span>
      ${note}
    </div>`;
}

function grammarRefHtml(q){
  const notes = GRAMMAR_NOTES[q.id];
  if(!notes || !notes.length) return null;
  const cards = notes.map(n=>{
    const points = (n.points||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join('');
    const examples = (n.examples||[]).map(e=>`
      <div class="gref-ex"><div class="gref-ex-ko">${escapeHtml(e.ko)}</div><div class="gref-ex-ja">${escapeHtml(e.ja)}</div></div>`).join('');
    return `
      <div class="gref-card">
        <div class="gref-term">${escapeHtml(n.term)}</div>
        <div class="gref-meaning">${escapeHtml(n.meaning)}</div>
        <div class="gref-formula">${escapeHtml(n.formula)}</div>
        ${registerBadgeHtml(n)}
        ${points ? `<ul class="gref-points">${points}</ul>` : ''}
        ${examples ? `<div class="gref-examples">${examples}</div>` : ''}
      </div>`;
  }).join('');
  return el(`<details class="gref" open><summary>${t('grammarRefTitle')}</summary>${cards}</details>`);
}

function currentGroup(){
  return state.pool[state.idx];
}

function renderQuiz(){
  const wrap = el(`<div></div>`);
  const group = currentGroup();
  const totalQuestions = poolQuestionCount(state.pool);
  const answeredSoFar = state.answers.length;
  const pct = Math.round((answeredSoFar/totalQuestions)*100);

  wrap.appendChild(el(`
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">${t('brand')}</div>
      </div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${answeredSoFar} / ${totalQuestions}</div>
      </div>
      <div class="score-label">${t('scoreLabel', state.score, state.answers.length)}</div>
    </header>
  `));
  wrap.querySelector('.topbar-row').appendChild(el(topbarActionsHtml(true)));
  attachTopbarActions(wrap);

  const card = el(`<div class="q-card"></div>`);
  const first = group[0];
  const isGroup = group.length > 1;
  const sourceLabel = isGroup
    ? `${first.source.replace(/[0-9]+번$/, '')}${first.number}~${group[group.length-1].number}번`
    : first.source;
  card.appendChild(el(`
    <div class="q-meta">
      <div class="q-source">${escapeHtml(sourceLabel)}</div>
    </div>
  `));

  const qInstruction = tf(first, 'instruction');
  if(qInstruction){
    card.appendChild(el(`<p class="q-instruction">${escapeHtml(qInstruction)}</p>`));
  }

  // Passage (and its underline, if any member of the group needs one) is shared
  // and shown exactly once, above all of the group's sub-questions.
  const passageUnderlineQ = group.find(q=>q.underline_field === 'passage');
  const qPassage = tf(first, 'passage');
  if(first.chart){
    card.appendChild(el(chartHtml(first.chart, state.lang)));
  } else if(qPassage){
    const target = passageUnderlineQ ? (state.lang === 'ja' ? passageUnderlineQ.underline_ja : passageUnderlineQ.underline_ko) : null;
    const html = passageUnderlineQ ? underlineHtml(qPassage, target) : escapeHtml(qPassage);
    card.appendChild(el(`<div class="passage-box">${html}</div>`));
  }

  let allAnswered = true;
  group.forEach((q, subIdx)=>{
    const sub = state.subAnswers[subIdx];
    if(!sub.answered) allAnswered = false;

    const subWrap = el(`<div class="sub-question"></div>`);
    if(isGroup) subWrap.classList.add('sub-question-numbered');

    const qStem = tf(q, 'question_text');
    const stemPrefix = isGroup ? `<span class="sub-num">${q.number}.</span> ` : '';
    if(qStem){
      const target = q.underline_field === 'question_text' ? (state.lang === 'ja' ? q.underline_ja : q.underline_ko) : null;
      const html = q.underline_field === 'question_text' ? underlineHtml(qStem, target) : escapeHtml(qStem);
      subWrap.appendChild(el(`<p class="q-stem">${stemPrefix}${html}</p>`));
    } else if(isGroup){
      subWrap.appendChild(el(`<p class="q-stem">${stemPrefix}</p>`));
    }

    const qChoices = tfChoices(q);
    const choicesWrap = el(`<div class="choices"></div>`);
    qChoices.forEach((choiceText, i)=>{
      const choiceNum = i+1;
      const btn = el(`
        <div class="choice">
          <span class="choice-num">${choiceNum}</span>
          <span class="choice-text">${escapeHtml(choiceText)}</span>
        </div>
      `);
      if(sub.answered){
        btn.classList.add('disabled');
        if(choiceNum === q.answer) btn.classList.add('correct');
        else if(choiceNum === sub.chosen) btn.classList.add('wrong');
        else btn.classList.add('dim');
      } else {
        attachTapHandler(btn, ()=>selectChoice(subIdx, choiceNum));
      }
      choicesWrap.appendChild(btn);
    });
    subWrap.appendChild(choicesWrap);

    if(sub.answered){
      const isCorrect = sub.chosen === q.answer;
      subWrap.appendChild(el(`
        <div class="feedback-banner ${isCorrect?'ok':'ng'}">${isCorrect ? t('correctBanner') : t('wrongBanner')}</div>
      `));
      const explainPanel = el(`<div class="explain-panel"></div>`);
      if(q.grammar_point){
        explainPanel.appendChild(el(`<div class="grammar-badge">${escapeHtml(q.grammar_point)}</div>`));
      }
      explainPanel.appendChild(el(`<div class="explain-text">${escapeHtml(q.explanation)}</div>`));
      subWrap.appendChild(explainPanel);
      const refPanel = grammarRefHtml(q);
      if(refPanel) subWrap.appendChild(refPanel);
    }

    card.appendChild(subWrap);
  });

  const canGoBack = state.idx > 0 && !state.reviewing;
  if(allAnswered || canGoBack){
    const nextRow = el(`<div class="next-row ${canGoBack ? 'has-prev' : ''}"></div>`);
    if(canGoBack){
      const prevBtn = el(`<button class="prev-btn">← ${t('prevBtn')}</button>`);
      prevBtn.addEventListener('click', goPrev);
      nextRow.appendChild(prevBtn);
    }
    if(allAnswered){
      const isLast = state.idx === state.pool.length-1;
      const nextBtn = el(`<button class="next-btn">${isLast ? t('resultBtn') : t('nextBtn')}</button>`);
      nextBtn.addEventListener('click', goNext);
      nextRow.appendChild(nextBtn);
    }
    card.appendChild(nextRow);
  }

  wrap.appendChild(card);
  return wrap;
}

function selectChoice(subIdx, choiceNum){
  const sub = state.subAnswers[subIdx];
  if(sub.answered) return;
  const q = currentGroup()[subIdx];
  sub.answered = true;
  sub.chosen = choiceNum;
  const correct = choiceNum === q.answer;
  if(correct) state.score++;
  state.answers.push({q, chosen: choiceNum, correct});
  recordStat(q.id, correct);
  render();
}

function goNext(){
  if(state.idx < state.pool.length-1){
    state.idx++;
    state.subAnswers = state.allSub[state.idx];
    render();
  } else {
    state.screen = 'result';
    render();
  }
}

function goPrev(){
  if(state.idx > 0){
    state.idx--;
    state.subAnswers = state.allSub[state.idx];
    render();
  }
}

function renderAnalysis(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(topbarHtml());

  const stats = loadStats();
  const ids = Object.keys(stats);
  let totalCorrect = 0, totalWrong = 0;
  ids.forEach(id=>{ totalCorrect += stats[id].correct||0; totalWrong += stats[id].wrong||0; });
  const totalAttempts = totalCorrect + totalWrong;

  const card = el(`<div class="analysis-card"></div>`);
  card.appendChild(el(`<h1 style="font-size:22px;margin:0 0 18px;">${escapeHtml(t('analysisTitle'))}</h1>`));

  if(totalAttempts === 0){
    card.appendChild(el(`<div class="analysis-empty">${escapeHtml(t('analysisEmpty'))}</div>`));
  } else {
    const pct = Math.round((totalCorrect/totalAttempts)*100);
    card.appendChild(el(`<div class="analysis-overall">${escapeHtml(t('analysisOverall', totalCorrect, totalAttempts, pct))}</div>`));

    // worst individual questions (any with at least one wrong attempt)
    const worstQuestions = ids
      .map(id=>({id, ...stats[id], q: ALL_QUESTIONS.find(x=>x.id===id)}))
      .filter(x=>x.q && x.wrong > 0)
      .sort((a,b)=> b.wrong - a.wrong)
      .slice(0, 10);

    // worst grammar points (aggregate wrong counts across questions sharing a grammar_point)
    const grammarMap = {};
    ids.forEach(id=>{
      const q = ALL_QUESTIONS.find(x=>x.id===id);
      if(!q || !q.grammar_point || !stats[id].wrong) return;
      grammarMap[q.grammar_point] = (grammarMap[q.grammar_point]||0) + stats[id].wrong;
    });
    const worstGrammar = Object.entries(grammarMap).sort((a,b)=>b[1]-a[1]).slice(0, 8);

    if(worstGrammar.length){
      const sec = el(`<div class="analysis-section"></div>`);
      sec.appendChild(el(`<div class="analysis-section-heading">${escapeHtml(t('analysisWorstGrammarHeading'))}</div>`));
      worstGrammar.forEach(([label, count])=>{
        sec.appendChild(el(`
          <div class="analysis-item">
            <span class="analysis-item-label">${escapeHtml(label)}</span>
            <span class="analysis-item-count">${escapeHtml(t('analysisMissLabel', count))}</span>
          </div>
        `));
      });
      card.appendChild(sec);
    }

    if(worstQuestions.length){
      const sec = el(`<div class="analysis-section"></div>`);
      sec.appendChild(el(`<div class="analysis-section-heading">${escapeHtml(t('analysisWorstQuestionsHeading'))}</div>`));
      worstQuestions.forEach(x=>{
        const snippet = (x.q.question_text || x.q.passage || '').replace(/\n/g, ' ');
        sec.appendChild(el(`
          <div class="analysis-item">
            <span class="analysis-item-label">${escapeHtml(x.q.source)} — ${escapeHtml(truncate(snippet, 24))}</span>
            <span class="analysis-item-count">${escapeHtml(t('analysisMissLabel', x.wrong))}</span>
          </div>
        `));
      });
      card.appendChild(sec);
    }

    const actions = el(`<div class="analysis-actions"></div>`);
    const retryBtn = el(`<button class="btn-primary" ${worstQuestions.length? '' : 'style="display:none;"'}>${t('retryWorstBtn')}</button>`);
    retryBtn.addEventListener('click', ()=>{
      if(!confirmOverwriteSession()) return;
      beginReading(worstQuestions.map(x=>[x.q]));
    });
    actions.appendChild(retryBtn);
    card.appendChild(actions);
  }

  const bottomActions = el(`<div class="analysis-actions" style="margin-top:20px;"></div>`);
  const backBtn = el(`<button class="btn-secondary">${t('backToStartBtn')}</button>`);
  backBtn.addEventListener('click', ()=>{ state.screen = 'start'; render(); });
  bottomActions.appendChild(backBtn);
  if(totalAttempts > 0){
    const resetBtn = el(`<button class="btn-secondary">${t('resetStatsBtn')}</button>`);
    resetBtn.addEventListener('click', ()=>{
      if(confirm(t('resetStatsConfirm'))){
        resetStats();
        render();
      }
    });
    bottomActions.appendChild(resetBtn);
  }
  card.appendChild(bottomActions);

  wrap.appendChild(card);
  return wrap;
}

function renderResult(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">${t('brand')}</div>
      </div>
    </header>
  `));
  wrap.querySelector('.topbar-row').appendChild(el(langToggleHtml()));
  wrap.querySelector('#lang-toggle-btn').addEventListener('click', toggleLang);
  const total = state.answers.length;
  const wrongList = state.answers.filter(a=>!a.correct);
  const pct = total ? Math.round((state.score/total)*100) : 0;
  const card = el(`
    <div class="result-card">
      <div class="result-sub">${t('resultHeading')}</div>
      <div class="result-score">${state.score} / ${total}</div>
      <div class="result-sub">${t('accuracyLabel', pct)}</div>
    </div>
  `);
  if(wrongList.length){
    const listWrap = el(`<div class="review-list"></div>`);
    listWrap.appendChild(el(`<h3 style="font-size:15px;color:var(--sub);margin:0 0 4px;text-align:left;">${t('wrongReviewTitle', wrongList.length)}</h3>`));
    wrongList.forEach(a=>{
      const stemText = (tf(a.q,'question_text') || tf(a.q,'passage') || '').replace(/\n/g, ' ');
      const item = el(`
        <div class="review-item">
          <span>${a.q.source} — ${escapeHtml(truncate(stemText,28))}</span>
          <span class="tag-wrong">${t('myAnswer', a.chosen)}</span>
        </div>
      `);
      item.addEventListener('click', ()=>reviewSingle(a));
      listWrap.appendChild(item);
    });
    card.appendChild(listWrap);
  }
  const actions = el(`
    <div class="result-actions">
      <button class="btn-secondary" id="restart-btn">${t('restartBtn')}</button>
      <button class="btn-primary" id="retry-wrong-btn" ${wrongList.length? '' : 'style="display:none;"'}>${t('retryWrongBtn')}</button>
    </div>
  `);
  actions.querySelector('#restart-btn').addEventListener('click', ()=>{
    state.screen = 'start';
    render();
  });
  const retryBtn = actions.querySelector('#retry-wrong-btn');
  if(retryBtn){
    retryBtn.addEventListener('click', ()=>{
      beginReading(wrongList.map(a=>[a.q]));
    });
  }
  card.appendChild(actions);
  wrap.appendChild(card);
  return wrap;
}

function reviewSingle(a){
  // inline review of one past question with its answer revealed; the result-screen state is restored on the way back
  const snapshot = {pool:state.pool, idx:state.idx, allSub:state.allSub, subAnswers:state.subAnswers, score:state.score, answers:state.answers};
  state.reviewing = true;
  state.pool = [[a.q]];
  state.idx = 0;
  state.allSub = [[{answered:true, chosen:a.chosen}]];
  state.subAnswers = state.allSub[0];
  state.score = a.correct ? 1 : 0;
  state.answers = [a];
  state.screen = 'quiz';
  render();
  const nextBtn = document.querySelector('.next-btn');
  if(nextBtn){
    nextBtn.textContent = t('backToResultBtn');
    nextBtn.onclick = ()=>{
      Object.assign(state, snapshot);
      state.reviewing = false;
      state.screen = 'result';
      render();
    };
  }
}

function truncate(s, n){
  if(!s) return '';
  return s.length>n ? s.slice(0,n)+'…' : s;
}

function escapeHtml(str){
  if(str===null || str===undefined) return '';
  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;')
    .replaceAll('\n','<br>');
}

render();
</script>
